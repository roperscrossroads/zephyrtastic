manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      # PINNED, not `main`. A floating branch made this manifest unreproducible:
      # the bench built against the tree from whenever `west update` last ran,
      # while a fresh clone (and CI) got whatever upstream main was that day --
      # two months newer, by the time CI first tried to apply the carried
      # patches and they would not apply. Bumping Zephyr is now a deliberate
      # act: change this SHA, run `west update && west patch apply`, and fix
      # whatever the patches no longer apply to.
      revision: 6072d4880d2d8deeadb506929adca4dba44c8220
      clone-depth: 1
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_espressif
          - hal_nordic  # needed for any nRF52 target (e.g. xiao_ble); absent until the
                        # first Nordic-chip board (2026-08-23)
          - hal_stm32
          - hal_xtensa
          - mbedtls
          - tf-psa-crypto
          - nanopb
          - picolibc
          - mcuboot # needed for sysbuild/OTA (MCUboot A/B) builds; the upstream trimmed
                    # manifest didn't need it since it targets simple-boot only
          - zcbor   # needed by MESHTASTIC_OTA's MCUmgr/SMP transport, same reason as mcuboot
          - littlefs # the firmware depot (CONFIG_MESHTASTIC_DEPOT): a LittleFS of images for
                     # other nodes on the Heltec 16 MB map's spare flash (2026-08-26)
          - loramac-node # drop me eventually, not used but there's a kconfig issue preventing
                         # build when HAS_SEMTECH_SX126X=y but module is not present, even when
                         # using native lora backend
