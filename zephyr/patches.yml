# Local patches carried on top of the upstream Zephyr tree.
#
# `west update` restores each project to its manifest revision, discarding
# in-tree edits. Re-apply these afterwards with:
#
#     west patch apply           # apply all patches below
#     west patch clean           # revert projects to pristine
#     west patch list            # show carried patches
#
# Patch files live in main/zephyr/patches/ (patch-base). Paths in each .patch
# are relative to the target module's root (module: zephyr).
patches:
  - path: 0001-adc-esp32-skip-disruptive-gpio-disconnect.patch
    sha256sum: ef1ad9de50389a5ad32187b3c3122f9103f526881959688f0bf55aa729be60a1
    module: zephyr
    author: Adam Roper
    email: adam.r.roper@gmail.com
    date: "2026-07-21"
    upstreamable: true
    comments: |
      adc_esp32 channel-setup: drop the gpio_pin_configure_dt(GPIO_DISCONNECTED)
      call. On the ESP32-S3 it runs rtcio_hal_function_select() + interrupt-config
      touches on the shared gpio0/RTC-IO controller, which silently knocks out an
      unrelated *digital* GPIO interrupt on a neighbouring RTC-capable pin on the
      same controller. On the Heltec V4 that neighbour is the SX1262 DIO1 (GPIO14,
      next to the ADC1_CH0 battery pin GPIO1): the first battery ADC channel-setup
      killed the radio's TX-done/RX-done IRQ (both TX and RX dead). Upstream
      ESP-IDF adc_oneshot never touches the GPIO here; the SAR ADC reads the
      undriven analog input without it. Confirmed on hardware: with the call
      dropped, the Heltec V4 display+battery UI and the LoRa radio coexist
      (tx ok / rx decoding with the full UI enabled).
  - path: 0002-sx126x-poll-dio1-on-light-sleep-wake.patch
    sha256sum: 71cab4cc1a40f2a2eb9aefe59922670bd983848c2c202b59e5fcb73d25410252
    module: zephyr
    author: Adam Roper
    email: adam.r.roper@gmail.com
    date: "2026-07-25"
    upstreamable: true
    comments: |
      drivers/lora/native/sx126x: add sx126x_poll_dio1(dev), a public entry that
      submits the driver's DIO1 work if DIO1 is currently asserted. Needed for
      ESP32-S3 light sleep: DIO1 is an EDGE interrupt (dio1_isr), but
      PM_STATE_STANDBY powers the GPIO peripheral down, so the RX/TX-done rising
      edge is MISSED — on wake DIO1 is a static HIGH with no fresh edge, dio1_isr()
      never fires, and the frame sits unread. The app's PM wake hook (a
      pm_notifier .state_exit in meshtastic_radio.c, gated on CONFIG_PM +
      CONFIG_LORA_SX126X) calls this on every wake with mt.lora_dev; if DIO1 is
      high it submits the same work the edge ISR would have, and
      sx126x_irq_work_handler() reads+clears the SX126x IRQ status over SPI
      regardless of the missed edge. Idempotent (k_work_submit coalesces). Takes
      the device explicitly because this driver instantiates for two compatibles
      (sx1261 / sx1262), so there is no single DEVICE_DT_INST_GET. Without this the
      EXT1 DIO1 wake (armed via GPIO_INT_WAKEUP on the board dio1-gpios cell) wakes
      the CPU but never reads the packet. Upstreamable: a generic light-sleep
      helper for the edge-IRQ radio, no board coupling in the driver.
  - path: 0003-sx126x-busy-timeout-diagnostics.patch
    sha256sum: d852ababba8ce70b059900ff70ed945de8f2d9fd40ddb0b0d93c969b4b6662b6
    module: zephyr
    author: Adam Roper
    email: adam.r.roper@gmail.com
    date: "2026-07-29"
    upstreamable: false
    comments: |
      drivers/lora/native/sx126x: diagnostics for the recurring BUSY timeout
      (agents-qnpp / agents-3ujx). sx126x_hal_wait_busy() gains an opcode arg AND a
      pre/post phase flag (pre = the wait BEFORE the SPI transfer, so a timeout means
      the PRIOR op left BUSY high; post = after, so THIS command did not complete) plus
      prev_opcode (the last command actually issued over SPI — on a PRE timeout, the op
      that left BUSY high, i.e. the culprit) so a timeout can name the command that
      stalled — splitting TX-path
      (SET_TX_PARAMS / WRITE_BUFFER) from RX-path (GET_IRQ_STATUS / READ_BUFFER)
      and config, and discriminating the CAD/LBT suspect (agents-la0m). The
      timeout LOG_WRN is moved into a __weak sx126x_hal_busy_timeout_report(dev,
      opcode, timeout_ms) so the application can override it (strong symbol) to add
      context it owns — meshtastic_radio.c does, appending the light-sleep wake
      sequence + ms-since-wake from powermon so a timeout can be placed relative to
      a PM_STATE_STANDBY wake WITHOUT wall-clock time (node log timestamps read
      1970). Pure diagnostics; no behavioural change to the radio. Not upstreamable
      as-is (the weak-hook contract is app-specific); revisit once the root cause is
      known and the instrumentation can be trimmed.
  - path: 0004-sx126x-busy-timeout-fix-and-recovery.patch
    sha256sum: 168db5019105d92addd592270850a4a4896f5a20024962679910e7f90a8a397d
    module: zephyr
    author: Adam Roper
    email: adam.r.roper@gmail.com
    date: "2026-07-29"
    upstreamable: true
    comments: |
      drivers/lora/native/sx126x: fix + recovery for the recurring 1 s BUSY timeout
      (agents-3ujx), pinned via the 0003 diagnostics. Two parts:

      (1) FIX (sx126x_set_standby): with CONFIG_LORA_SX126X_NATIVE_SLEEP the chip rests
      in SLEEP between operations, where it holds BUSY HIGH until an NSS-edge wake — but
      SET_STANDBY's write_cmd waits for BUSY LOW before sending, so any teardown/
      transition path reaching set_standby without an intervening wake stalls a full
      second (op=0x80 pre, prev=0x84/SET_SLEEP). Wake with a raw NSS edge first, gated on
      (driver state==SLEEP || sx126x_hal_is_busy()): the state flag also catches the
      sleep-ENTRY window right after SET_SLEEP where BUSY reads transiently low and the
      is_busy check alone missed it (a residual op=0x80 POST). Skipped (no extra SPI) when
      genuinely awake. (First attempt fixed sx126x_duty_cycle_stop(), but the app uses
      continuous RX .recv_async not the duty-cycle path — a dead target the 0003 soak
      caught before it was believed fixed.)

      (2) RECOVERY (agents-oieb): a module-scope consecutive-BUSY-timeout streak in
      sx126x_hal_wait_busy (cleared on any success); sx126x_lora_config() resets the
      radio (sx126x_chip_init: RESET pin pulse + re-init) when the streak crosses
      SX126X_BUSY_RECOVERY_THRESHOLD, then continues to re-apply the full modem config —
      so a wedged radio (BUSY stuck) is bounded instead of hanging forever. The app
      re-runs lora_config every TX, so a wedge clears within a TX cycle. Upstreamable —
      generic driver-correctness fixes, no board coupling.
  - path: 0005-sx126x-cad-pa-clamp-agc-reset-rx-boost.patch
    sha256sum: 5947d0b0cb2fa9890c0d7ce744234a50593634d5d55771022185aefa4d4813c6
    module: zephyr
    author: Adam Roper
    email: adam.r.roper@gmail.com
    date: "2026-08-06"
    upstreamable: true
    comments: |
      drivers/lora/native/sx126x: four radio-reliability fixes, found auditing this
      driver against upstream Meshtastic/RadioLib source (not just re-reading the
      datasheet). Each closes a gap where the driver's config *looked* correct but
      was silently a no-op or missing entirely.

      (1) CAD (sx126x_do_cad, wired into sx126x_lora_send_async before SetTx). The
      driver's lora_modem_config.cad.mode=LORA_CAD_MODE_LBT contract ("lora_send()
      performs CAD before transmitting and returns -EBUSY if the channel is busy")
      was accepted but never implemented — the app (meshtastic_radio.c) had been
      setting cad.mode=LBT believing it got real hardware listen-before-talk; every
      TX actually went out with zero channel sensing. Implements the real
      SetCadParams(0x88)/SetCad(0xC5) sequence with CAD_DONE/CAD_ACTIVITY_DETECTED
      IRQ handling (poll DIO1 directly, matching RadioLib's own scanChannel() —
      short/synchronous, not worth the async IRQ+workqueue pipeline). Auto-derived
      parameters (symbol_num/detection_peak/detection_minimum = 0) resolve to
      RadioLib's own SX1262 defaults — confirmed against RadioLib source
      2026-08-06, not assumed: 4-symbol window, detPeak=spreadingFactor+13
      (SF-dependent), detMin=10, always exits to STDBY_RC. Restores the driver's
      standard TX/RX/timeout/CRC-err DIO1 mask afterward regardless of result,
      since SetCadParams' own IRQ config otherwise displaces it and the
      subsequent SetTx's TX_DONE IRQ depends on it.

      (2) PA-clamping errata fix (sx126x_hal_fix_pa_clamping, sx126x_hal.c). The
      SX1262/SX1268 datasheet (ch.15 "Known Limitations" sec 15.2) documents an
      overly-eager PA over-current clamp that silently caps actual TX power below
      what's configured, worse at high power / antenna mismatch, no error raised.
      RadioLib applies this unconditionally for every SX1262 (fixPaClamping()).
      This exact fix already existed in this same driver tree's STM32WL HAL
      variant (sx126x_hal_stm32wl.c) but was never ported to the discrete-chip
      path Heltec V4 and similar boards actually use.

      (3) Periodic AGC reset (sx126x_reset_agc + meshtastic_radio.c timer, 60s
      default via new CONFIG_MESHTASTIC_AGC_RESET_INTERVAL_MS). Upstream
      Meshtastic runs this every AGC_RESET_INTERVAL_MS because — per upstream's
      own commit history — the SX126x's internal AGC can get stuck and RX
      sensitivity silently degrades, never recovering until reboot. A plain
      standby cycle does not reset it; only a warm-sleep power-cycle does, which
      this driver already had via sx126x_set_sleep()/sx126x_ensure_ready()
      (SLEEP_WARM_START retains config, so this is cheap) — just never invoked
      for this purpose. Also re-applies the RX-sensitivity register patch
      (0x8B5 bit 0) upstream sets alongside its own reset. The app owns
      pausing/resuming continuous async RX around the chip-level cycle, the same
      pattern already used around a TX.

      (4) RX-boosted-gain runtime control (sx126x_set_rx_boosted_gain). The
      driver only ever read the devicetree rx-boosted default
      (hal_config->rx_boosted); config.lora.sx126x_rx_boosted_gain (a real,
      phone-app-settable proto field, present in this port's config.proto but
      never read anywhere in the app layer either) had no effect whatsoever.
      Fixed at both ends: the app now reads it (meshtastic_config_store.c) and
      pushes it at boot (meshtastic_radio_init, a LoRaConfig change already
      requires a reboot to take effect, so no live-apply path is needed); the
      driver now tracks it in persistent runtime state (data->rx_boosted) rather
      than the devicetree constant, since sx126x_lora_config() re-applies
      whichever one is the source of truth on *every* call (before every TX) —
      a one-shot override without this would have been silently clobbered back
      on the very next transmit.

      Upstreamable — all four are generic driver-correctness/completeness fixes
      citing upstream RadioLib/Meshtastic source and the Semtech datasheet, no
      board-specific coupling. Verified: 220/220 native_sim protocol tests green
      (unaffected, as expected — native_sim doesn't compile this driver); real
      ESP32-S3 builds for both heltec-v4 and heltec-v4r8 (v4-unified profile)
      succeed cleanly with zero warnings in any changed file. Not yet verified
      on-air (CAD/AGC/PA-clamp/RX-boost all need real RF to prove out —
      native_sim has no PHY).
  - path: 0006-sx126x-cad-agc-diagnostic-counters.patch
    sha256sum: 1566fd757742be0eb48c9d27396ca886cf1fa9c058136487191350fb0bd5f327
    module: zephyr
    author: Adam Roper
    email: adam.r.roper@gmail.com
    date: "2026-08-06"
    upstreamable: false
    comments: |
      drivers/lora/native/sx126x: diagnostic counters for the CAD and periodic
      AGC-reset mechanisms 0005 added, requested for the live bench soak of
      0005 itself -- there was previously no way to answer "how often does CAD
      find the channel busy, has the DIO1/irq_work timeout race recurred, has
      AGC-reset ever failed" except grepping node logs by hand.

      Eight module-scope uint32_t counters (sx126x.c), matching the existing
      sx126x_busy_streak precedent (sx126x_hal_common.c) rather than atomics --
      every increment site already runs under data->lock, and these are
      soak-test visibility, not synchronization state:

        cad_clear / cad_busy / cad_timeout / cad_error   -- sx126x_do_cad()'s
          four possible outcomes, incremented at its single classification
          point (channel clear, activity detected, DIO1 poll timeout -- the
          exact symptom 0005's own fix closed, kept counted specifically to
          watch for recurrence -- or an SPI/comms error before CAD completed).
        agc_reset_ok / agc_reset_fail / agc_reset_skipped / agc_patch_fail --
          sx126x_reset_agc()'s outcomes: skipped means a TX was already in
          flight (not a failure, matching how the caller already treats it as
          benign); patch_fail is the sensitivity-register-patch soft-failure
          that 0005 already logs a warning for and swallows -- now also
          counted, since "ok" still increments alongside it (the core cycle
          did succeed).

      Exported via plain accessor + reset functions (sx126x_*_count_get(),
      sx126x_cad_agc_stats_reset()), in the same style as
      sx126x_hal_busy_timeout_streak()/_reset(). Wired through a
      CONFIG_LORA_SX126X-gated chip-agnostic wrapper in meshtastic_radio.c
      (meshtastic_radio_cad_clear_count() etc. -- a build without this radio
      reads a flat 0 rather than needing its own guard), surfaced as two new
      lines on `meshtastic sched stats` and reset by `sched stats reset`
      alongside the existing counters.

      Not upstreamable as scoped -- these counters and their shell surface are
      specific to 0005's own CAD/AGC-reset implementation, which itself isn't
      upstream (upstream Meshtastic runs on RadioLib against a different
      driver entirely; there's no equivalent counter surface to align with).

      Verified: 220/220 native_sim protocol tests green (these counters are
      inert there -- CONFIG_LORA_SX126X unset, wrapper reads back 0); real
      ESP32-S3 builds for both heltec-v4 and heltec-v4r8 succeed cleanly with
      zero warnings; live-queried via `meshtastic sched stats` over telnet on
      all three bench nodes post-flash -- CAD/AGC counts increment correctly,
      `sched stats reset` zeroes them correctly.
  - path: 0007-wdt-esp32-convert-timeout-ms-to-mwdt-ticks.patch
    sha256sum: 5a5754bb6bf6df65babae59308208ccdc1577ebbfb13cd7cfbaf79bf24f544b4
    module: zephyr
    author: Adam Roper
    email: adam.r.roper@gmail.com
    date: "2026-08-10"
    upstreamable: true
    comments: |
      wdt_esp32: convert window.max from milliseconds to MWDT ticks. Zephyr's
      watchdog API documents struct wdt_timeout_cfg's window.max in
      milliseconds, but wdt_esp32_install_timeout() stored it verbatim and
      wdt_esp32_set_config() passed it straight to wdt_hal_config_stage(),
      which takes ticks. The driver's own MWDT_TICK_PRESCALER (40000) is the
      vendor's pre-calculated prescaler for a 500 us tick -- and the file
      already carried the matching `#define MWDT_TICKS_PER_US 500`, defined
      and never used. So every timeout came out at half the requested value,
      on every ESP32 SoC this driver serves.

      Found via subsys/task_wdt's hardware fallback, where the error is
      unusually dangerous: task_wdt sizes the hardware timeout as
      CONFIG_TASK_WDT_MIN_TIMEOUT + CONFIG_TASK_WDT_HW_FALLBACK_DELAY and
      feeds it from a background channel whose period is MIN_TIMEOUT, so the
      whole safety margin is HW_FALLBACK_DELAY. Halving the deadline eats the
      margin from the wrong end: at MIN_TIMEOUT=10000 with the Kconfig-default
      DELAY of 20, the MWDT's stage 0 (interrupt) landed at 5.01 s and stage 1
      (SoC reset) at 10.02 s against a 10.00 s feed -- 20 ms of margin, i.e.
      a single late k_timer expiry resets the SoC. Observed on Heltec V4 /
      V4-R8 (ESP32-S3) bench nodes as repeated resets with WATCHDOG cause and
      no software fault, plus a stage-0 interrupt firing in 100% of sampled
      windows.

      Fix mirrors ESP-IDF's own conversion (esp_task_wdt.c does the same
      ms -> ticks arithmetic against the same two constants), with a 64-bit
      intermediate so a large-but-legal millisecond timeout cannot overflow
      the multiply. zephyr/sys/clock.h is included explicitly for
      USEC_PER_MSEC rather than relied on transitively.

      Verified: 220/220 native_sim tests green (inert there -- native_sim has
      no MWDT); both ESP32-S3 board builds link clean; and on Heltec V4 +
      V4-R8 bench nodes the stage-0 interrupt count reads zero across sampled
      heartbeat windows with the task_wdt values restored to plain
      milliseconds, where the pre-fix configuration fired in 100% of them.

      Note on that last figure: pre-fix, stage 0 firing was arithmetic rather
      than jitter -- a 5.01 s halved deadline against a 10 s feed period can
      never be fed in time -- so it demonstrates the halving, not the margin.
      The margin claim rests on the arithmetic: stage 1 at 10.02 s against a
      10.00 s feed leaves 20 ms. The stage-0 timing has NOT been measured
      directly against a stopped feed; that would need a deliberate
      feed-starvation test.
  - path: 0008-sx126x-gate-poll-dio1-and-irq-work-on-armed-callback.patch
    sha256sum: a18ec2190e49e365f6ec45b325f2a4a6a9ac3965502ff32624bae67c118e8309
    module: zephyr
    author: Adam Roper
    email: adam.r.roper@gmail.com
    date: "2026-08-07"
    upstreamable: true
    comments: |
      drivers/lora/native/sx126x: make sx126x_poll_dio1() honor the same
      "callback disarmed" gate the DIO1 edge ISR does, and assert the
      invariant in the IRQ work handler.

      sx126x_do_cad()'s synchronous poll and sx126x_set_sleep()'s
      SPI-sensitive window both clear data->hal.dio1_callback to claim
      exclusive ownership of the chip's IRQ-status register. The edge ISR
      respects that; sx126x_poll_dio1() -- added by 0002 so a PM wake still
      observes a DIO1 edge missed while the SoC slept -- did not, giving the
      unlocked sx126x_irq_work_handler() a second, ungated path to run
      concurrently with CAD's own read/clear. The race silently eats a real
      TX_DONE, surfacing as a rare exact-15s sx126x_lora_send() timeout
      (~1-2 per board per day on the Heltec V4 / V4-R8 bench nodes, none
      before CAD shipped). The CAD poll loop does not need this path anyway:
      it reads the DIO1 level directly, so it is immune to the missed-edge
      problem sx126x_poll_dio1() exists to solve.

      The __ASSERT in the work handler documents and enforces the invariant
      for every future caller -- a loud coredump at the violation beats
      diagnosing another silently-eaten IRQ.

      PROVENANCE: this change was written and validated on hardware
      2026-08-07 but was never captured as a carried patch -- it existed only
      as an uncommitted edit in the zephyr/ working tree, where the next
      `west update` or `west patch clean` would have discarded it and
      reintroduced the TX-timeout bug. Found and captured 2026-08-19 while
      reconstructing the patch baseline for 0009. The diff is that working
      tree edit verbatim; pristine + 0002/0004/0005/0006 + this patch
      reproduces the live file byte-for-byte.
  - path: 0009-sx126x-do-not-report-a-failed-packet-status-read-as-a-measurement.patch
    sha256sum: 8219fa4f712f8fd6c31804b676df798f532d7e9a508de966e919dfd4256ca8b7
    module: zephyr
    author: Adam Roper
    email: adam.r.roper@gmail.com
    date: "2026-08-19"
    upstreamable: true
    comments: |
      drivers/lora/native/sx126x: check sx126x_get_packet_status()'s return
      code in the RX-done handler instead of discarding it.

      struct sx126x_rx_result is zero-initialised, so a failed status read
      (SPI error, or a BUSY timeout inside sx126x_hal_read_cmd()) delivered
      the packet with RSSI 0 / SNR 0 and no indication anything had gone
      wrong. 0/0 is not a neutral value: the Meshtastic stack reads it as
      "this packet was generated locally, not received over RF" (reference
      firmware, RadioLibInterface.cpp), and SNR 0 additionally feeds the
      rebroadcast contention window.

      The packet itself is still delivered -- link metrics are advisory and a
      payload that read back cleanly is a good packet -- but the failure is
      now logged, which is what makes an *unavailable* reading
      distinguishable from a legitimately-zero one. That distinction has
      practical teeth: RssiPkt is an unsigned -dBm/2 byte, so any signal at
      or above 0 dBm at the antenna -- an ordinary +17 dBm bench node under a
      metre away -- also reads back as exactly 0. Without this log the two
      causes are indistinguishable in the field, which is what sent the
      2026-08-19 "rssi 0 on relayed frames" investigation looking at the
      relay path first.

      No behaviour change on a healthy radio: the read does not fail.
  - path: 0010-gnss-nmea-generic-enlarge-uart-rx-buffer.patch
    sha256sum: 41fa89c7fa48627bcf6be2a8c0bbd22fd3593e1682c9bcbdd9bc8ec689c5f8a7
    module: zephyr
    author: Adam Roper
    email: adam.r.roper@gmail.com
    date: "2026-08-05"
    upstreamable: false
    comments: |
      drivers/gnss/gnss_nmea_generic: UART_RX_BUF_SZ 256 -> 1024 for the
      non-SATELLITES case, plus a recorded negative result on the PMTK
      output-filtering approach that was tried and reverted.

      modem_backend_uart splits this buffer in half (double-buffered RX): the
      ISR fills the active half and a workqueue item swaps halves at ~95%
      full. At the L76K's 9600 baud a 128-byte half left ~6.7 ms between
      "schedule the swap" and "ISR has nowhere to put the next byte", which
      the unified WiFi+LoRa+BLE image reliably missed during NMEA acquisition
      bursts -> "modem_backend_uart_isr: Receive buffer overrun"
      (docs/KNOWN-ISSUES.md STABILITY-1). 512-byte halves take the margin to
      ~26.7 ms. CONFIG_MODEM_DEDICATED_WORKQUEUE narrows but cannot close the
      gap -- an ISR preempts the workqueue at any thread priority -- and the
      log-level cap in overlay-gnss.conf only silenced the symptom.

      Not upstreamable as-is: the right upstream fix is a Kconfig for the
      buffer size rather than a hardcoded bump, since the correct value is a
      function of baud rate and the host's workqueue latency.

      PROVENANCE: written 2026-08-05, never captured as a carried patch --
      it existed only as an uncommitted edit in the zephyr/ working tree,
      which the next `west update` / `west patch clean` would have reverted,
      reintroducing the overrun. The in-file comment asserted that leaving it
      uncommitted matched "this workspace's existing convention (see the
      sibling sx126x/adc_esp32 local patches)", but those siblings are all
      carried patches here -- the convention is this directory. Found and
      captured 2026-08-19 during a full audit of modified files in zephyr/
      against patches.yml.
