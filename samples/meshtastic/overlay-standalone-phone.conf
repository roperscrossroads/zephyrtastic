# ===== overlay-standalone-phone =====
# A node that is carried and used from a phone (the Meshtastic app, or the web
# client over Web Bluetooth) rather than managed as part of a fleet. Stack it
# LAST, after overlay-ota-ble.conf, whose BLE buffer/MTU settings the phone
# link still wants.

# Pairing: a fixed PIN with MITM protection, as the reference firmware does on
# a board with no screen (FIXED_PIN, 123456). Every PhoneAPI characteristic
# then needs an authenticated link; Just Works would let anyone in range pair.
CONFIG_MESHTASTIC_BLE_FIXED_PASSKEY=y

# Bonds must survive a reboot, or every node restart leaves the phone holding a
# key the node has forgotten and the next connect fails until it is re-paired.
# Room for a phone, a laptop and a spare.
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4

# No SMP over BLE: this node is updated over USB. Left on, the service is open
# (overlay-ota-ble.conf's PERM_RW) and carries the shell group — anyone in
# range could run shell commands. SMP over the USB console is unaffected.
CONFIG_MCUMGR_TRANSPORT_BT=n

# No node-to-node BLE peer link: that is the fleet courier's channel.
CONFIG_MESHTASTIC_BLE_PEER=n
