# Derive the node id from the identity public key -- crc32(X25519 public key) -- as the
# reference firmware has done since 2.8 (CONFIG_MESHTASTIC_NODE_ID_FROM_KEY, Kconfig.pki).
#
# ⚠️ Adding this to an image for a node that is already deployed CHANGES THAT NODE'S ID, once,
# on its first boot. Its keys do not change, so the new id can be computed beforehand
# (crc32 of the public key), and every peer then holds the node under both ids until the old
# entry is forgotten. Read the option's help before rolling it out.
#
# Removing it again returns a node to its hardware-derived id: the id is derived at every
# boot, so a roll-back is a reflash.
CONFIG_MESHTASTIC_NODE_ID_FROM_KEY=y
