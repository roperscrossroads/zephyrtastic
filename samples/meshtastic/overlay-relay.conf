# ===== overlay-relay =====
# The cross-preset relay's RECEIVING half (agents-jbrq.12): re-originates the
# broadcast text its ear forwards over the BLE peer link, on this node's
# preset. Needs the peer link (overlay-ble-peer.conf, or a profile carrying
# it). Off at boot: turn it on with `meshtastic relay dir in`.
CONFIG_MESHTASTIC_RELAY=y
