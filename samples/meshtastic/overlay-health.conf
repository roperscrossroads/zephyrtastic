# Turn on the mesh-facing health/crash-loop announcement (Kconfig.health,
# Phase 4 of the diagnostics-baseline plan). CONFIG_MESHTASTIC_HEALTH_REPORT
# defaults n so it costs nothing on a build that doesn't opt in; this is that
# opt-in for the fleet.
#
# Still inert on its own: it only ever sends on a boot with a pending crash
# breadcrumb, and only once a channel named CONFIG_MESHTASTIC_HEALTH_CHANNEL_NAME
# ("health" by default) is actually provisioned -- see Kconfig.health. Turning
# this on with no such channel costs nothing either; the module resolves the
# channel fresh on every attempt and idles when it finds none.
CONFIG_MESHTASTIC_HEALTH_REPORT=y
