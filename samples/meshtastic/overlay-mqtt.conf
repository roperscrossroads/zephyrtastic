# MQTT bridge with the broker client, on a networked image (agents-zo3o.2). Chain it LAST,
# where overlay-nomqtt.conf would otherwise go; the justfile appends it for MQTT=1.
#
# Why this file exists: overlay-v4-unified.conf enables MQTT in its "overlay-mqtt" block and
# then sets CONFIG_MQTT_LIB=n in its closing "unified DRAM slimming" block. So a profile image
# built without overlay-nomqtt.conf got the bridge with only its PhoneAPI proxy back end and
# no broker client (MESHTASTIC_MQTT_BROKER needs MQTT_LIB), and MQTT=1 was close to a label.
#
# Plaintext to port 1883; for TLS chain overlay-mqtt-tls.conf after this file. Point
# MESHTASTIC_MQTT_BROKER_HOST at a real broker in a local, gitignored overlay: the profile's
# value is a documentation placeholder. The net buffer counts stay at the profile's slimmed
# values; the gateway builds at 92.77% dram0 (V4) this way, but a broker under load has not
# been proven on them.

CONFIG_MQTT_LIB=y
CONFIG_MESHTASTIC_MQTT=y
