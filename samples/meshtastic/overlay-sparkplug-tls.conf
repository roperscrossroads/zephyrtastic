# The gateway's Sparkplug Edge Node over TLS, the broker verified (MESHTASTIC_SPARKPLUG_TLS): chain
# it after overlay-sparkplug.conf (and overlay-sparkplug-sim.conf on native_sim). The broker must
# be given by NAME (`sparkplug set broker <name>`): the name is checked against its certificate.
# Trust anchor: src/meshtastic_sparkplug_ca.h (Let's Encrypt's ECDSA root, ISRG Root X2).
CONFIG_MESHTASTIC_SPARKPLUG_TLS=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y

# mbedTLS: TLS 1.2 client with X.509 verification, ECDHE-ECDSA only: an ECDSA (P-256/P-384)
# certificate chain, as Let's Encrypt issues them under ISRG Root X2. No RSA.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
# mbedTLS allocates from the C library's malloc (no dedicated static heap: on the R8 that alone
# overflowed dram0 by 53 KB; malloc there has the free RAM and a PSRAM heap).
# Records: Mosquitto sends each handshake message in its own record; the largest is the
# Certificate message, 3418 B for a Let's Encrypt ECDSA chain of four (leaf, YE1, Root YE, the X2
# cross-sign), so 4 KB holds it with ~680 B to spare. A longer chain needs this raised.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
