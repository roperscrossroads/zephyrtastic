# agents-xhli.24: close the level-1 interrupt re-entry window that corrupts the
# Xtensa per-CPU nested count on the ESP32-S3 (class-B hard-hang). The default
# (=n) takes EXCINT_HANDLER's fragile "_not_l1 -> PS_INTLEVEL(1)" branch, which
# the asm's own comment flags with an "optimization FIXME": a level-1 interrupt
# re-fires the instant EXCM is unmasked in the handler's exit, re-entering it and
# underflowing nested. NONPREEMPTABLE=y holds PS.INTLEVEL high through the whole
# handler incl. the exit, so nothing preempts the exit window. Upstream-sanctioned
# alternative branch; test build for the courier (rzr3). See LOCKDOWN/KNOWN-ISSUES.
CONFIG_XTENSA_INTERRUPT_NONPREEMPTABLE=y
