# ===== overlay-relay-ear =====
# The cross-preset relay's EAR (agents-jbrq.12): forwards the broadcast text it
# hears on its preset, byte for byte, to the receiving half over the BLE peer
# link. Transmit is compiled out (MESHTASTIC_RELAY_EAR_RX_ONLY, default y): an
# ear sits on a public channel it does not own. Set the receiving half with
# `meshtastic ear peer <id>`, or bake it in:
#   CONFIG_MESHTASTIC_RELAY_EAR_PEER=0x<id>
# Needs the peer link (overlay-ble-peer.conf, or a profile carrying it).
CONFIG_MESHTASTIC_RELAY_EAR=y
# An ear only listens: nothing to announce.
CONFIG_MESHTASTIC_NODEINFO_AUTO_SEND=n
CONFIG_MESHTASTIC_DEVICE_METRICS_AUTO_SEND=n
