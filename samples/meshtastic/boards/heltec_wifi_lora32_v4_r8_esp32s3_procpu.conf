# Heltec WiFi LoRa 32 (V4-R8) — ESP32-S3R8 + SX1262 behind a KCT8103L FEM.
# Board target: heltec_wifi_lora32_v4_r8/esp32s3/procpu.
#
# Counterpart to heltec_wifi_lora32_v4_esp32s3_procpu.conf. The two boards are
# electrically the same design apart from the memory part and the four control
# pins the octal PSRAM displaced (see the R8 board .dts) — so this file
# deliberately mirrors the V4 one rather than inventing different values.
#
# Without this file the R8 silently fell back to subsystem defaults and built a
# materially different image from the V4: TX power 17 dBm instead of 20, and
# CONFIG_POWEROFF=n, which quietly turns the admin "shutdown" command into a
# no-op. Neither shows up as a build failure.

# The FEM raises max output well above the bare SX1262's +22 dBm. Start
# CONSERVATIVE: the driver commands the SX1262 output, then the FEM adds ~+7 to
# +11 dB on top (non-linear, see variant.h). 20 dBm at the chip already means
# high-20s dBm at the antenna — set per region/antenna and VERIFY on the bench.
CONFIG_MESHTASTIC_TX_POWER=20

# No fuel-gauge IC (battery is a plain ADC divider), same as V3/V4. On R8 the
# divider is UNGATED — there is no ADC_CTRL pin, because GPIO37 went to the
# octal PSRAM bus (confirmed against HTIT-WBR8H_V4.3.2.pdf: ADC_Ctrl appears
# nowhere, and R27 390k / R28 100k sit straight across VBAT). The board .dts
# drops the vbatt `power-gpios` property accordingly.

# GPS enable uses a gpio-hog from the board DT (GPIO42 on R8, not the V4's
# GPIO34). The FEM pins are NOT hogged — heltec_wifi_lora32_v4_fem.c owns them
# and runtime-detects GC1109 vs KCT8103L (R8 fits the KCT8103L).
CONFIG_GPIO_HOGS=y

# Admin "shutdown" = deep sleep via sys_poweroff() (ESP32-S3 HAS_POWEROFF).
CONFIG_POWEROFF=y

# NOTE: PSRAM mode/type/speed/heap-size are NOT set here. They are properties of
# the module, not of this application, and live in the board's Kconfig.defconfig
# (8 MB OCTAL @ 80 MHz, 4 MB shared-multi-heap pool). Setting them in an
# application file is what previously left this board configured to drive an
# octal part in quad mode.

# 2026-09-03: idle stack 1 KB -> 2 KB. Three ESP32-S3 nodes (rzr1, rzr2 on V4;
# rzr3 on V4-R8) died within 70 min of 0.3.11 soak with `ZEPHYR FATAL ERROR 2:
# Stack overflow`, current thread idle, raised by z_check_stack_sentinel() on
# the interrupt-exit path (z_get_next_switch_handle) from the outermost ISR
# frame -- so idle's sentinel word was already gone when the next interrupt
# returned. The idle thread's own high-water read 292/1024 every minute; what
# it does not show is the per-interrupt cost Zephyr's Xtensa entry puts on the
# INTERRUPTED thread's stack before switching to the ISR stack (the base save
# area plus the lazy register-window spills, xtensa_asm2.inc.S CROSS_STACK_CALL),
# and every fault sat inside a burst of LoRa + BLE-controller interrupts around
# a neighbour rebooting. The Zephyr Xtensa default is 1 KB (kernel/Kconfig).
# In these images z_interrupt_stacks ends exactly where z_idle_stacks begins,
# so the two stories -- idle dipping below its base, or an ISR-context write
# just above the ISR top -- leave the same corpse; only a bigger idle stack
# separates them: the faults stop (idle was overflowing) or they do not (the
# writer is in interrupt context). RF-PARITY-PLAN.md section 8.13.
CONFIG_IDLE_STACK_SIZE=2048
