# Seeed XIAO nRF52840 (PLAIN, no Sense) + Wio-SX1262 shield.
# ⚠ The kits' boards are the PLAIN variant even though their Seeed bootloader
# enumerates as "XIAO nRF52840 Sense" (2886:0045) — the USB string lies; trust
# the silkscreen. Building for /sense adds the Sense-only IMU/I2C/mic devices,
# which do not exist on this hardware.
# Otherwise identical to the Sense conf: — the ble variant, as board
# defaults: this board has no WiFi silicon, so BLE is its only phone transport,
# and it is the a4it.7 peer-link bench target. The ESP32 family reaches the
# same feature set via VARIANT=ble (overlay-nonet.conf); here it IS the
# baseline, so a plain
#   west build -b xiao_ble/nrf52840/sense main/samples/meshtastic -- -DSHIELD=wio_sx1262_xiao
# produces the peer-capable image (agents-zo3o.3, XIAO half).
# LFCLK from the internal RC oscillator, NOT the board-default external
# crystal. Found 2026-08-23 the hard way: on xiao-kit the 32 kHz crystal never
# starts, and Zephyr's clock driver waits for it FOREVER during pre-main boot
# — no USB, no console, no watchdog (the WDT itself ticks off LFCLK), a board
# that looks completely dead. Proven by differential: an RC-clocked beacon
# blinks and reboots itself; the identical XTAL build is a brick. Stock
# Meshtastic ran because the Arduino core doesn't insist on the crystal.
# RC + periodic calibration is fully supported for BLE (500 ppm class).
#
# Since Zephyr 4.5 the source is the lfclk devicetree node's k32src, set in
# boards/xiao-lfclk-rc.dtsi (included by this board's .overlay). The Kconfig
# this file used to carry (CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC/_500PPM) belongs to
# the deprecated CLOCK_CONTROL_NRF driver: on 4.5 Kconfig warned, dropped both,
# and the XIAOs ran on the crystal again (agents-xf7q). Do not put them back.
# Count the RC calibrations, so `meshtastic state` ("lfclk") can show they run
# (agents-mvwn). Two counters in the calibration path; no code elsewhere.
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_DEBUG=y

# NO MCUboot in a PLAIN build of this board — the resident bootloader is
# Seeed's Adafruit UF2 fork, which jumps straight to the vector table at
# 0x27000. The sample's prj.conf sets CONFIG_BOOTLOADER_MCUBOOT=y for the
# ESP32 OTA story, and that reserves a 512-byte zero-filled signing header at
# the image start (ROM_START_OFFSET=0x200) — so the CPU loads SP=0/PC=0 and
# locks up before the first instruction: THE "dead XIAO" bug of 2026-08-23.
# Every full-sample image died this way while every minimal probe (no MCUboot
# config) booted.
#
# Since 2026-08-26 the board DOES have an MCUboot layout — but only under
# --sysbuild, where sysbuild.cmake attaches mcuboot-xiao/ (MCUboot itself is
# put at 0x27000 for the UF2 bootloader to jump to, the app moves to slot0 at
# 0x37000, slot1 goes on the QSPI) and re-asserts =y after this line. Without
# --sysbuild this =n keeps the legacy single image the UF2 bootloader boots
# directly. The two are keyed on the same switch that builds the bootloader,
# on purpose: see sysbuild.cmake.
CONFIG_BOOTLOADER_MCUBOOT=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_MESHTASTIC_BLE=y

# PKC (X25519 + AES-CCM) for DMs and remote admin (agents-xhli.3). The BT host
# already pulls mbedTLS/PSA with ECDH + SHA-256 on this target; this adds the
# X25519 curve, the ECC key-pair/public-key types, and CCM — the same set the
# ESP32 ble variant carries (overlay-nonet keeps it there; here it is board
# baseline like everything else).
CONFIG_MESHTASTIC_PKI=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ALG_CCM=y

# The node-to-node peer link (service + scanner + central + blepeer shell).
# THREE conn slots: phone + inbound peer + outbound peer. Two proved too few on
# the first 3-node bench (2026-08-24): with one link up, connectable
# advertising reserves the last conn object, so the central's own
# bt_conn_le_create() gets -ENOMEM and a chain topology (A -> B -> C) is
# impossible. The peer code build-asserts >= 2; RAM cost of the third is noise
# on 256 KB.
CONFIG_MESHTASTIC_BLE_PEER=y
CONFIG_BT_MAX_CONN=3

# The fleet class (1 for the XIAO node, and every other XIAO class) and its
# signed TLV come from the build recipe (the rxrbench catalog), not from the
# board conf: one place per image (agents-ls39.2.4). A build without a recipe is
# class 0 (unset).

# --- BLE connection parameters: measured on a bench XIAO over SMP/BLE, 2026-08-26 ---
# Do NOT let the peripheral request a connection-parameter update. Zephyr's
# default asks the central, 5 s after connecting, for the PPCP values below;
# a Linux central grants them with an IDENTICAL interval (48.75 ms before and
# after), and on this controller that no-op update desynchronised the link at
# the instant in 5 of 12 tries — the node goes silent and the central times
# out one supervision timeout later, whatever that timeout is (420 ms and 6 s
# both measured). Central-initiated updates, including a real change to
# 11.25 ms pushed mid-transfer, passed 3 of 3; with no request at all, 3 of 3.
# A phone connecting at Android's default (~48.75 ms) would take the same
# path, so this also protects the PhoneAPI, which no phone has yet tested.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# The preferred parameters still advertised in GAP's PPCP characteristic, for
# a central that chooses to honour them: upstream's 6 s supervision timeout
# (NimbleBluetooth.cpp: "6 seconds = 600") instead of Zephyr's 420 ms. It did
# not cure the desync above (it only delays the timeout), but a node that also
# services a LoRa radio and flash erases wants the slack upstream gives it.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# GATT discovery (our central's, and the phone's against us) runs on the BT RX
# thread, whose 2048-byte default is known-tight — the ESP32 unified profile
# carries 6144 for the same reason. 4096 fits comfortably in 256 KB RAM.
CONFIG_BT_RX_STACK_SIZE=4096

# The bench surface: this board's only console is USB CDC, so the shell rides
# the serial backend (`meshtastic blepeer …`, `meshtastic dfu`). The ESP32
# family gets this from overlay-v4-unified.conf, which XIAO builds never see.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_MESHTASTIC_SHELL=y
# The shell runs every command's handler on its own thread's stack, and in deferred
# log mode it also formats every console log line there. At Zephyr's 2048 bytes the
# stack stood at 81% straight after boot (1664 B, before any command), `admin trust`
# reached 84% and `fleet desire` overflowed it twice out of two (bench 2026-11-24,
# rzr7, agents-vnfu). The sends and the fleet verbs go through the shell work thread
# (meshtastic_shell.c); this is the margin for the config writes that still run
# inline. RAM only, no flash: ~1 KB of the ~14 KB this image leaves free.
CONFIG_SHELL_STACK_SIZE=3072
# `log` and `settings`, which the ESP32 profile has carried all along
# (overlay-v4-unified.conf) and this board did not. Both earned their place on
# 2026-08-25: without `log disable <module>` a chatty node overruns the shell's
# RX ring buffer and silently swallows commands, and without `settings list
# mtclus` there is no way to see what the persisted cluster document actually
# holds — which is exactly the evidence needed to tell "the clear failed" from
# "a peer put it back".
CONFIG_LOG_CMDS=y
CONFIG_SETTINGS_SHELL=y

# Software bootloader re-entry (`meshtastic dfu`, plus the 1200-baud touch so
# adafruit-nrfutil --touch works like on stock). This board has no reset
# button, only an RST pad — never make anyone tweeze it twice again.
CONFIG_MESHTASTIC_DFU_TRIGGER=y
CONFIG_REBOOT=y
CONFIG_UART_LINE_CTRL=y
# Bring-up is over (2026-08-27): a fatal error reboots into the APP, not the
# bootloader. With DFU_ON_FATAL the fatal handler stamped the UF2 bootloader's
# serial-DFU magic before every reset, so a crash — including a deliberately
# bad test image — parked the kit in DFU "ready to reflash" instead of letting
# MCUboot revert it. That was agents-xhli.16 ("drops to its bootloader"), and
# it defeats the fleet's revert-on-bad-boot (F5). CONFIG_RESET_ON_FATAL_ERROR
# stays: faults reset rather than halt, and an unconfirmed image then reverts.
# A deliberate bootloader entry is still one 1200-baud touch away (DFU_TOUCH).
CONFIG_MESHTASTIC_DFU_ON_FATAL=n
CONFIG_RESET_ON_FATAL_ERROR=y
# The WDT-based boot guard: ON for this board (operator consent 2026-08-23,
# revisiting the earlier no-watchdog stance after a day of RST-pad tapping —
# this board has no reset button, and a hang is otherwise unrecoverable
# without hands on the pads). Three consecutive boots that never reach the
# system workqueue self-eject into the bootloader; a one-off runtime stall
# (>15 s without a workqueue feed) costs a single reboot, never a DFU park.
# Revisit before deployment: an unattended node may prefer reboot-and-retry
# over parking in DFU. The general task watchdog stays off during bring-up.
CONFIG_MESHTASTIC_DFU_BOOT_GUARD=y
# This board has no reset button, so the guard above is its ONLY hands-free way
# back from a boot hang. Declaring it REQUIRED turns a silent loss into a build
# failure: the guard arms the nRF hardware WDT itself and so `depends on
# !WATCHDOG`, while MESHTASTIC_WATCHDOG *selects* WATCHDOG -- meaning the
# obvious "make diagnostics uniform" edit below would drop the guard to n with
# no error at all. See the BUILD_ASSERT in meshtastic_dfu_trigger.c.
CONFIG_MESHTASTIC_DFU_BOOT_GUARD_REQUIRED=y
# The task watchdog stays OFF on this board -- the default is set in
# Kconfig.debug (`default n if BOARD_XIAO_BLE`), with this reason next to it.

# Cluster config sync (agents-xhli.4): fleet convergence over the "cluster"
# channel. Bench cadence 60 s while M4a measures divergence rates.
CONFIG_MESHTASTIC_CLUSTER=y
CONFIG_MESHTASTIC_CLUSTER_DIGEST_PERIOD_SEC=60
# Document scope (agents-xhli.10) left at the AUTO default deliberately, even
# though this is the "constrained board" the design register names. 256 KB with
# no PSRAM sounds like the CORE tier's use case, but the table is 32 x ~168 B =
# ~5.4 KB, which this board holds comfortably — so pinning CORE here would give
# up being a restore source for the fleet in exchange for nothing. AUTO already
# does the right thing: claim everything until the table genuinely cannot hold
# it, then narrow. Pin CORE only for a board that CANNOT hold a realistic
# fleet's document, which is a statement about the deployment, not the part.

# The cluster digest TX runs on the SYSTEM workqueue and channel-encrypts via
# PSA/mbedTLS there — the default 2048 overflowed the moment the first digest
# fired (both kits DFU-ejected at t≈+60 s, 2026-08-24; the ESP32 profile
# already carries 4096 and sent digests clean). Crypto on the sysworkq needs
# this headroom.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Off here UNCONDITIONALLY (bench 2026-08-27, agents-xhli.16): the base profile's LOGGING
# backend dumps all of RAM through a USB CDC that cannot run once the fatal handler has locked
# interrupts, so a fatal spent ~9 s spinning on a dead console until the hardware watchdog
# MCUboot left running fired — and a *watchdog* reset into a pending MCUboot revert sometimes
# landed the board in the UF2 bootloader instead of reverting cleanly. This board conf applies to
# BOTH the plain (legacy, single-image) and --sysbuild (MCUboot A/B) builds, and the legacy layout
# has no coredump partition at all — so this stays the floor for both.
#
# The real fix (same root cause found on the V4 on 2026-08-30, agents-quo6: FLASH_PARTITION writes
# in well under a second and never touches the console) is turned back on for the --sysbuild
# build ONLY, in mcuboot-xiao/app.conf, which is where its coredump_partition (partitions.dtsi)
# actually exists — flipping it on here too would break the plain build, whose devicetree has no
# such node (confirmed: FAILED "Need a fixed partition named 'coredump-partition'!").
# The OFF default itself now lives in Kconfig.debug (`default n if BOARD_XIAO_BLE`).

# ---- From overlay-ota-shell.conf, which every fleet class on this board listed (agents-ls39.2.4).

# ===== overlay-ota-shell =====
# --- Firmware update over SMP (mcumgr) on the shell's serial console ---
# The same MESHTASTIC_OTA subsystem overlay-ota.conf runs over UDP, carried
# instead on the console the board already has: SMP frames ride the shell's
# serial backend (base64, 0x06 0x09-framed lines), demultiplexed from the
# interactive shell by the transport itself. No second port, no IP stack —
# which is what makes it the first update path for the XIAO (USB CDC console,
# LoRa + BLE, no WiFi). Requires the MCUboot A/B build (SYSBUILD=1 / --sysbuild).
#
# 2026-08-26: written for Phase A.1 (docs/xiao-mcuboot.md). It is the rung
# that proves the slot layout and MCUboot's test/confirm/revert on the bench
# before a BLE transport exists; it stays useful afterwards as the cable path.
#
# Client side: `smpmgr --port <cdc> upload <zephyr.signed.bin>` (or the Go
# `mcumgr` CLI with --conntype serial). The console is also the LOG sink; the
# client filters by the frame prefix, but `log halt` first keeps a log burst
# from landing inside a frame on a chatty node.
CONFIG_MESHTASTIC_OTA=y

# Transport: SMP over the shell backend.
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_BASE64=y
# Return the shell to normal use if a client dies mid-frame instead of holding
# it hostage waiting for the rest of a packet the header promised.
CONFIG_MCUMGR_TRANSPORT_SHELL_INPUT_TIMEOUT=y

# MCUboot image manager backend for img_mgmt (slot1 write / test / confirm),
# and the `mcuboot` shell command built on the same bootutil client library:
# `mcuboot info` is the instrument for the A/B ladder — which image is in
# which slot, whether it is confirmed, what swap is pending — and `mcuboot
# confirm` / `request_upgrade` drive it without an SMP client attached.
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUBOOT_SHELL=y
# Erase slot1 as the upload streams in rather than all up front — 180 QSPI
# sectors take seconds, and up front that is one silent SMP timeout.
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Frame sizes. Every upload chunk is a round trip on a 115200-ish CDC link, so
# bigger frames are the whole throughput lever: ~1 KB frames put a ~520 KB image
# at ~550 round trips. NETBUF_SIZE sets the largest SMP packet (SHELL_MTU is gone in 4.5).
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1152
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
# The shell's RX ring is the ISR-to-thread buffer the frames arrive through.
# Its default is 256 with the SMP transport; this board has already shown what
# a full RX ring does (commands vanish, no error), and a 64-byte USB packet
# burst is not the same as a human typing.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
# A frame arrives as up to N base64 LINES of 127 bytes, each parked in one of
# these buffers until the SMP work queue reassembles them. The client's
# "line buffers" setting MUST equal this count (smpmgr --line-buffers 10):
# with the default of 2 a client sending 8-line frames had its first chunk
# accepted and every later one dropped, which presents as an upload that
# stalls at 0% and times out (measured 2026-08-26). 10 x 127 B lines carry a
# ~950-byte decoded frame, inside the 1024 MTU. Costs 10 x 127 B of RAM.
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=10
# Answer `os mcumgr_params` (buffer size and count) so a client can size its
# frames from the device's own numbers instead of a guess on its command line.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# img_mgmt writes flash on the SMP work queue; same bump overlay-ota.conf
# carries (measured 57-69% of 2048 there, before the QSPI driver was in the
# path).
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096

# ---- From overlay-ota-ble.conf, which every fleet class on this board listed (agents-ls39.2.4).

# ===== overlay-ota-ble =====
# --- Firmware update over SMP (mcumgr) on Bluetooth LE ---
# The same MESHTASTIC_OTA subsystem overlay-ota.conf runs over UDP and
# overlay-ota-shell.conf over the console, carried on the BLE link the board
# already has for the phone: Zephyr registers the SMP GATT service
# (8D53DC1D-1DB7-4CD3-868B-8A527460AA84) beside the Meshtastic service, and a
# client (smpmgr --ble, Nordic's nRF Connect Device Manager) writes the image
# into slot1 with no cable, no 1200-baud touch and no serial host. The
# Meshtastic phone app does NOT speak SMP — it drives Nordic legacy DFU on
# stock nRF nodes — so the phone path is Device Manager, not Meshtastic.
#
# 2026-08-26. Requires the MCUboot A/B
# build (--sysbuild); usually stacked with overlay-ota-shell.conf so the cable
# path stays available: -DEXTRA_CONF_FILE="overlay-ota-shell.conf;overlay-ota-ble.conf".
CONFIG_MESHTASTIC_OTA=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# SMP packets are bigger than one ATT write; reassemble them.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# Access control — a DECISION, not a default. Zephyr's default with BT_SMP on
# is RW_AUTHEN: encryption AND authentication, i.e. a MITM-protected pairing.
# This fleet pairs Just Works (screenless bench, no passkey), which yields
# security level 2 at most, so RW_AUTHEN would refuse every write with
# "insufficient authentication" and nothing would say why. RW_ENCRYPT would
# work from a phone (the Meshtastic app already pairs Just Works with these
# nodes) but from a Linux client it needs a BlueZ pairing agent before the
# first write. For the bench proof the service is OPEN, which is exactly the
# permission the Meshtastic service itself carries on this build (see
# MT_GATT_PERM_* in meshtastic_ble.c). What protects the node is MCUboot's
# signature check — and until SB_CONFIG_BOOT_SIGNATURE_KEY_FILE names a real
# key, that check accepts anything signed with MCUboot's public dev key.
# Step up to RW_ENCRYPT (and a real key) before a node leaves the bench.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y

# MCUboot image manager backend for img_mgmt (slot1 write / test / confirm).
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# `mcuboot info` / confirm / request_upgrade on the console, as in the shell
# overlay (harmless twice).
CONFIG_MCUBOOT_SHELL=y

# Throughput lever: the XIAO build ran a 65-byte L2CAP MTU (23-byte ATT
# payloads). The ESP32 unified profile carries 247/251; same numbers here so
# an SMP chunk is ~244 bytes of payload per ATT write instead of ~20. The
# controller side (CTLR_DATA_LENGTH_MAX) must grow with the host buffers or
# the data-length update negotiates back down.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# SMP frame buffers: the BT transport has no line framing, so the frame size
# is bounded by NETBUF_SIZE alone (the shell overlay's 1152 if stacked; else
# this). img_mgmt writes flash on the SMP work queue — same stack bump.
# 2304 (was 1152) because taskstat does not page: Zephyr sends EVERY thread in
# ONE response, so the buffer has to fit the whole table or the client gets
# MGMT_ERR.EMSGSIZE and nothing else. Bench-measured on rzr6 2026-08-31: 22
# threads fit in 1152 WITHOUT stack figures, and overflow it WITH them — so
# TASKSTAT_STACK_INFO and this size are a matched pair, and raising one without
# the other just moves the failure. Costs (2304-1152)*COUNT = 4608 B of RAM.
# Headroom, not luxury: a thread table grows with the image, and the unified V4
# build runs more threads than a kit.
# Side benefit: smpmgr sizes its frames from `os mcumgr_params`, so a bigger
# buffer means bigger upload chunks, not just bigger replies.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2304
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096

# Answer `os mcumgr_params` (buffer size + count) so a client sizes its frames
# from the device's own numbers instead of a conservative guess. Without it,
# smpmgr falls back to tiny frames and the BLE upload crawls — measured on the
# ESP32 R8: 2 KB/s without this vs the XIAO's 6 KB/s. One line, no RAM cost.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# The fleet's intent verbs over BLE (DECLARATIVE-FLEET.md §15, F4): `smpmgr --ble <node>
# shell "meshtastic fleet status"` runs the Zephyr shell over SMP, so a node with no
# console — every kit on the bench — still answers `just fleet status <node>`. The dummy
# backend is a second shell instance the SMP shell group feeds; its buffer bounds
# one command's reply (fleet status with a full depot is ~1.5 KB).
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=2048
CONFIG_MCUMGR_GRP_SHELL=y

# Counters over SMP, STRUCTURED — `smpmgr --ble <node> statistics list` and
# `... statistics group <name>`. The shell group above can already reach the same
# numbers, but only by scraping human-readable text out of `stats` (or out of
# `meshtastic cluster status` and friends), which breaks whenever a format
# changes and is too expensive to poll. This is the upstream-standard machine
# path, and smpmgr already speaks it — no bespoke tooling.
#
# CONFIG_STATS/STATS_NAMES are already on (prj.conf); this only EXPOSES what
# exists. Groups today are all diagnostics: mt_wdt + mt_radio_cad_agc
# (meshtastic_watchdog.c), mt_health, mt_supervisor. agents-sfjb tracks adding
# the mesh-side counters (cluster, router) that are still text-only.
#
# ⚠️ Stats are RAM counters, zeroed by any reset — this is ANTE-mortem telemetry
# (watch a node degrade before it dies), NOT a post-mortem record. The durable
# side is agents-l984 (breadcrumbs must move to flash).
CONFIG_MCUMGR_GRP_STAT=y

# Per-thread name / state / stack / runtime over SMP — `smpmgr --ble <node> os
# taskstat`. THREAD_MONITOR, THREAD_NAME and THREAD_RUNTIME_STATS are already on
# (prj.conf), so the data existed; it just could not leave the node without a
# console. This is the question actually asked when something stops feeding the
# watchdog (agents-qcp1: rzr3 went silent on both bearers and took its reason
# with it), and `kernel threads` over the shell group answers it only as text.
# depends on THREAD_MONITOR, which is =y.
CONFIG_MCUMGR_GRP_OS_TASKSTAT=y
# ...WITH stack figures, which is the whole point. Bench-checked on rzr6
# 2026-08-31: taskstat without this returns stksiz/stkuse as null for every
# thread, so you get priorities and runtimes but not the one number a post-mortem
# actually turns on — how close a thread came to overflowing. Not on by default
# despite the help text ("this is default when THREAD_STACK_INFO is selected"),
# and its dependency THREAD_STACK_INFO is already =y here, as is INIT_STACKS
# (which is what makes unused stack measurable rather than guessed).
CONFIG_MCUMGR_GRP_OS_TASKSTAT_STACK_INFO=y

# Let a client ASK what a node supports instead of probing and guessing. The
# fleet runs four image classes that deliberately differ (a listener has no
# cluster, only the courier has a depot), so "does this node speak group X" is a
# real question with a real answer.
CONFIG_MCUMGR_GRP_ENUM=y

# `os info` — kernel version, board, build date, structured. Fleet inventory
# without scraping `meshtastic version` output.
CONFIG_MCUMGR_GRP_OS_INFO=y

# NOT MCUMGR_GRP_OS_DATETIME, and not for want of trying: it `depends on RTC` AND
# on $(dt_alias_enabled,rtc), and no board here defines an `rtc` alias. The
# nRF52840's rtc0/1/2 are counter peripherals driving the kernel clock, not
# devices implementing Zephyr's RTC driver class. Enabling the symbol without
# adding such a device silently does nothing. Wiring the clock (meshtastic_clock)
# to an RTC device is its own piece of work — see the time arc.

# The target half of a node-to-node update (DECLARATIVE-FLEET.md §9): a courier
# delivers an image and leaves it UNCONFIRMED (it must not confirm on a peer's
# behalf), so the target confirms itself after a healthy window. Without this a
# courier-delivered image would always revert. 120 s default; the beat carries
# TESTBOOT until it clears.
CONFIG_MESHTASTIC_OTA_AUTOCONFIRM=y

# ---- From overlay-ota-ble-secure.conf, which every fleet class on this board listed (agents-ls39.2.4).

# ===== overlay-ota-ble-secure =====
# --- F7 P1: the SMP-over-BLE service demands an ENCRYPTED link ---
# Stack AFTER overlay-ota-ble.conf. That overlay leaves the service OPEN (a
# decision it states); this one steps it up to RW_ENCRYPT: every SMP write
# needs security level 2, i.e. a Just Works pairing, bonded. What that costs:
#  - the courier pairs before it talks (MESHTASTIC_SMP_CENTRAL_PAIR, default y
#    under RW_ENCRYPT): bt_conn_set_security(L2) on the adopted link, then the
#    usual MTU/discover/subscribe;
#  - bonds must SURVIVE a reboot on both sides, or the host's BlueZ refuses the
#    next connect on a key mismatch: BT_SETTINGS on;
#  - room for every bond: a kit bonds with its courier, the host and a phone; a
#    courier with two kits and the host. BT_MAX_PAIRED was 1;
#  - a Linux `smpmgr --ble` host needs a BlueZ pairing agent (bluetoothctl
#    `agent on` + `pair <addr>` once) before its first write.
# The peer beats ride the same encrypted link, harmlessly. This is the pipe;
# the payload is still MCUboot's signature check — meaningless until
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE names a real key (F7 P0).
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=n
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4
# A host that lost its bond (BlueZ `remove`, a reinstalled OS) must be able to
# pair again: Zephyr's default refuses an unauthenticated re-pair over an
# existing bond and DROPS THE LINK (bench 2026-08-28: a kit kept its bond for
# a BLE host after that host forgot it -> every connect died in pairing). Just Works
# authenticates nothing either way, so allowing the overwrite costs no
# security this fleet ever had; without it the only way back is a reflash.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y


# ---- From overlay-led-status.conf, which every fleet class on this board listed (agents-ls39.2.4).

# ===== overlay-led-status =====
# Bench LED: says whether this node is in use (idle: slow blink, red on a XIAO;
# in-use: green on a XIAO, off on a Heltec; locate: fast blink, blue). See
# Kconfig.led_status / meshtastic_led_status.h.
#
# The host sets the mode from the bench's claims (`meshtastic led mode`,
# tools/leds.sh); the node saves it.
#
# MESHTASTIC_LED_STATUS and MESHTASTIC_EXTNOTIFY both want sole ownership of
# led0 and don't arbitrate with each other, so this overlay turns extnotify
# off. Nothing in the current fleet recipes configures extnotify's alerting
# (ModuleConfig.external_notification.enabled defaults off), so this costs
# nothing in practice today.
CONFIG_MESHTASTIC_EXTNOTIFY=n
CONFIG_MESHTASTIC_LED_STATUS=y
