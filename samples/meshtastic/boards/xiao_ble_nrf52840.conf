# Seeed XIAO nRF52840 (PLAIN, no Sense) + Wio-SX1262 shield.
# ⚠ The kits' boards are the PLAIN variant even though their Seeed bootloader
# enumerates as "XIAO nRF52840 Sense" (2886:0045) — the USB string lies; trust
# the silkscreen. Building for /sense adds the Sense-only IMU/I2C/mic devices,
# which do not exist on this hardware.
# Otherwise identical to the Sense conf: — the ble variant, as board
# defaults: this board has no WiFi silicon, so BLE is its only phone transport,
# and it is the a4it.7 peer-link bench target. The ESP32 family reaches the
# same feature set via VARIANT=ble (overlay-nonet.conf); here it IS the
# baseline, so a plain
#   west build -b xiao_ble/nrf52840/sense main/samples/meshtastic -- -DSHIELD=wio_sx1262_xiao
# produces the peer-capable image (agents-zo3o.3, XIAO half).
# LFCLK from the internal RC oscillator, NOT the board-default external
# crystal. Found 2026-08-23 the hard way: on xiao-kit the 32 kHz crystal never
# starts, and Zephyr's clock driver waits for it FOREVER during pre-main boot
# — no USB, no console, no watchdog (the WDT itself ticks off LFCLK), a board
# that looks completely dead. Proven by differential: an RC-clocked beacon
# blinks and reboots itself; the identical XTAL build is a brick. Stock
# Meshtastic ran because the Arduino core doesn't insist on the crystal.
# RC + periodic calibration is fully supported for BLE (500 ppm class).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# NO MCUboot on this board — the resident bootloader is Seeed's Adafruit UF2
# fork, which jumps straight to the vector table at 0x27000. The sample's
# prj.conf sets CONFIG_BOOTLOADER_MCUBOOT=y for the ESP32 OTA story, and that
# reserves a 512-byte zero-filled signing header at the image start
# (ROM_START_OFFSET=0x200) — so the CPU loads SP=0/PC=0 and locks up before
# the first instruction: THE "dead XIAO" bug of 2026-08-23. Every full-sample
# image died this way while every minimal probe (no MCUboot config) booted.
CONFIG_BOOTLOADER_MCUBOOT=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_MESHTASTIC_BLE=y

# PKC (X25519 + AES-CCM) for DMs and remote admin (agents-xhli.3). The BT host
# already pulls mbedTLS/PSA with ECDH + SHA-256 on this target; this adds the
# X25519 curve, the ECC key-pair/public-key types, and CCM — the same set the
# ESP32 ble variant carries (overlay-nonet keeps it there; here it is board
# baseline like everything else).
CONFIG_MESHTASTIC_PKI=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ALG_CCM=y

# The node-to-node peer link (service + scanner + central + blepeer shell).
# THREE conn slots: phone + inbound peer + outbound peer. Two proved too few on
# the first 3-node bench (2026-08-24): with one link up, connectable
# advertising reserves the last conn object, so the central's own
# bt_conn_le_create() gets -ENOMEM and a chain topology (A -> B -> C) is
# impossible. The peer code build-asserts >= 2; RAM cost of the third is noise
# on 256 KB.
CONFIG_MESHTASTIC_BLE_PEER=y
CONFIG_BT_MAX_CONN=3

# GATT discovery (our central's, and the phone's against us) runs on the BT RX
# thread, whose 2048-byte default is known-tight — the ESP32 unified profile
# carries 6144 for the same reason. 4096 fits comfortably in 256 KB RAM.
CONFIG_BT_RX_STACK_SIZE=4096

# The bench surface: this board's only console is USB CDC, so the shell rides
# the serial backend (`meshtastic blepeer …`, `meshtastic dfu`). The ESP32
# family gets this from overlay-v4-unified.conf, which XIAO builds never see.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_MESHTASTIC_SHELL=y

# Software bootloader re-entry (`meshtastic dfu`, plus the 1200-baud touch so
# adafruit-nrfutil --touch works like on stock). This board has no reset
# button, only an RST pad — never make anyone tweeze it twice again.
CONFIG_MESHTASTIC_DFU_TRIGGER=y
CONFIG_REBOOT=y
CONFIG_UART_LINE_CTRL=y
# BRING-UP ONLY: any fatal error reboots into the bootloader instead of the
# app, and CONFIG_RESET_ON_FATAL_ERROR makes faults reset rather than halt —
# together they turn "crashed before USB, board looks dead" into "board is in
# DFU, reflash it". TURN MESHTASTIC_DFU_ON_FATAL OFF once this board is
# stable; a deployed node should reboot and retry.
CONFIG_MESHTASTIC_DFU_ON_FATAL=y
CONFIG_RESET_ON_FATAL_ERROR=y
# The WDT-based boot guard: ON for this board (operator consent 2026-08-23,
# revisiting the earlier no-watchdog stance after a day of RST-pad tapping —
# this board has no reset button, and a hang is otherwise unrecoverable
# without hands on the pads). Three consecutive boots that never reach the
# system workqueue self-eject into the bootloader; a one-off runtime stall
# (>15 s without a workqueue feed) costs a single reboot, never a DFU park.
# Revisit before deployment: an unattended node may prefer reboot-and-retry
# over parking in DFU. The general task watchdog stays off during bring-up.
CONFIG_MESHTASTIC_DFU_BOOT_GUARD=y
CONFIG_MESHTASTIC_WATCHDOG=n
