CONFIG_MESHTASTIC_NODE_LONG_NAME="Arduino GIGA R1"

# --- System heap: the upstream board sets no pool of its own (HEAP_MEM_POOL_SIZE
# defaults to 0, "no system heap available"), and the fatal handler and the diag loop
# reference the kernel's _system_heap directly for their heap statistics: the link
# fails without one. The same 4096 B as the T114 board conf and the ESP32 boards.
CONFIG_HEAP_MEM_POOL_SIZE=4096
