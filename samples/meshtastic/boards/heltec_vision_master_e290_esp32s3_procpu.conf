# Heltec Vision Master E290 (HT-VME290) — ESP32-S3R8 + bare SX1262 + 2.9" e-ink.
# Board target: heltec_vision_master_e290/esp32s3/procpu.
#
# Bare SX1262 (no FEM), so the SoC commands the radio output directly — the same
# +22 dBm ceiling as the V3, NOT the FEM-boosted V4 numbers. Set per region/antenna.
CONFIG_MESHTASTIC_TX_POWER=20

# No fuel-gauge IC (battery is a plain ADC divider gated by ADC_CTRL/GPIO46).

# No FEM and no GNSS on this board — no gpio-hogs, no board C init.

# Admin "shutdown" = deep sleep via sys_poweroff() (ESP32-S3 HAS_POWEROFF).
CONFIG_POWEROFF=y

# NOTE: the 2.9" e-ink panel (ssd16xx over MIPI-DBI, chosen zephyr,display) is
# NOT enabled here — the net sample is headless. To drive the display, add
# CONFIG_DISPLAY=y + CONFIG_MIPI_DBI=y + CONFIG_SSD16XX=y + CONFIG_SPI=y and the
# graphics stack. Left off until the panel is verified on hardware.
