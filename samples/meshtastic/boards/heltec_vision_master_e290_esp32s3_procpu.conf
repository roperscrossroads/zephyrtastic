# Heltec Vision Master E290 (HT-VME290) — ESP32-S3R8 + bare SX1262 + 2.9" e-ink.
# Board target: heltec_vision_master_e290/esp32s3/procpu.
#
# Bare SX1262 (no FEM), so the SoC commands the radio output directly — the same
# +22 dBm ceiling as the V3, NOT the FEM-boosted V4 numbers. Set per region/antenna.
CONFIG_MESHTASTIC_TX_POWER=20

# No fuel-gauge IC (battery is a plain ADC divider gated by ADC_CTRL/GPIO46).

# No FEM and no GNSS on this board — no gpio-hogs, no board C init.

# Admin "shutdown" = deep sleep via sys_poweroff() (ESP32-S3 HAS_POWEROFF).
CONFIG_POWEROFF=y

# The 2.9" e-ink panel is chosen as zephyr,display, so the screen UI (CFB over the
# ssd16xx MIPI-DBI driver) is built by the profile that enables MESHTASTIC_DISPLAY.
# The UI's defaults are an OLED's: redraw every second, blank after 30 s idle. On e-ink every
# redraw is a panel refresh (about a second, a visible flash, and wear), and "blanking" a
# bistable panel does nothing useful, so redraw at the slowest rate the Kconfig allows and
# never blank; a button press still redraws at once. Revisit once the panel is on the bench.
CONFIG_MESHTASTIC_DISPLAY_REFRESH_MS=10000
CONFIG_MESHTASTIC_DISPLAY_TIMEOUT_SECONDS=0

# Bring-up note (2026-10-06): the panel driver's failure paths log at DEBUG only, and the
# console is native USB, which nothing reads while the kernel initializes its devices. To see
# a driver's init on this board: CONFIG_DISPLAY_LOG_LEVEL_DBG=y (and MIPI_DBI), a
# CONFIG_LOG_BUFFER_SIZE of about 24 KB, then `kernel reboot warm` with the console held, so
# the USB-Serial/JTAG link survives the reset and the early lines reach the host.
