# Heltec Vision Master E290 (HT-VME290) — ESP32-S3R8 + bare SX1262 + 2.9" e-ink.
# Board target: heltec_vision_master_e290/esp32s3/procpu.
#
# Bare SX1262 (no FEM), so the SoC commands the radio output directly — the same
# +22 dBm ceiling as the V3, NOT the FEM-boosted V4 numbers. Set per region/antenna.
CONFIG_MESHTASTIC_TX_POWER=20

# No fuel-gauge IC (battery is a plain ADC divider gated by ADC_CTRL/GPIO46).

# No FEM and no GNSS on this board — no gpio-hogs, no board C init.

# Admin "shutdown" = deep sleep via sys_poweroff() (ESP32-S3 HAS_POWEROFF).
CONFIG_POWEROFF=y

# The 2.9" e-ink panel is chosen as zephyr,display, so the screen UI (CFB over the
# ssd16xx MIPI-DBI driver) is built by the profile that enables MESHTASTIC_DISPLAY.
# The UI's defaults are an OLED's: redraw every second, blank after 30 s idle. On e-ink every
# redraw is a panel refresh (about a second, a visible flash, and wear), and "blanking" a
# bistable panel does nothing useful, so redraw at the slowest rate the Kconfig allows and
# never blank; a button press still redraws at once. Revisit once the panel is on the bench.
CONFIG_MESHTASTIC_DISPLAY_REFRESH_MS=10000
CONFIG_MESHTASTIC_DISPLAY_TIMEOUT_SECONDS=0
# A frame reaches the panel only when it differs from the one on the glass (the display
# shim), and never within 30 s of the last refresh: the controller is rated for about a
# million refreshes, and a full refresh flashes. A change shows within 10 s, a run of changes
# at most every 30 s. (Seen before the shim: the same frame redrawn every 10 s, 2026-10-06.)
CONFIG_MESHTASTIC_DISPLAY_MIN_REFRESH_MS=30000

# Bring-up note (2026-10-06): the panel driver's failure paths log at DEBUG only, and the
# console is native USB, which nothing reads while the kernel initializes its devices. To see
# a driver's init on this board: CONFIG_DISPLAY_LOG_LEVEL_DBG=y (and MIPI_DBI), a
# CONFIG_LOG_BUFFER_SIZE of about 24 KB, then `kernel reboot warm` with the console held, so
# the USB-Serial/JTAG link survives the reset and the early lines reach the host.

# ---- From overlay-node-id-from-key.conf, which every fleet class on this board listed (agents-ls39.2.4).

# Derive the node id from the identity public key -- crc32(X25519 public key) -- as the
# reference firmware has done since 2.8 (CONFIG_MESHTASTIC_NODE_ID_FROM_KEY, Kconfig.pki).
#
# ⚠️ Adding this to an image for a node that is already deployed CHANGES THAT NODE'S ID, once,
# on its first boot. Its keys do not change, so the new id can be computed beforehand
# (crc32 of the public key), and every peer then holds the node under both ids until the old
# entry is forgotten. Read the option's help before rolling it out.
#
# Removing it again returns a node to its hardware-derived id: the id is derived at every
# boot, so a roll-back is a reflash.
CONFIG_MESHTASTIC_NODE_ID_FROM_KEY=y

# ---- From overlay-led-status.conf, which every fleet class on this board listed (agents-ls39.2.4).

# ===== overlay-led-status =====
# Bench LED: says whether this node is in use (idle: slow blink, red on a XIAO;
# in-use: green on a XIAO, off on a Heltec; locate: fast blink, blue). See
# Kconfig.led_status / meshtastic_led_status.h.
#
# The host sets the mode from the bench's claims (`meshtastic led mode`,
# tools/leds.sh); the node saves it.
#
# MESHTASTIC_LED_STATUS and MESHTASTIC_EXTNOTIFY both want sole ownership of
# led0 and don't arbitrate with each other, so this overlay turns extnotify
# off. Nothing in the current fleet recipes configures extnotify's alerting
# (ModuleConfig.external_notification.enabled defaults off), so this costs
# nothing in practice today.
CONFIG_MESHTASTIC_EXTNOTIFY=n
CONFIG_MESHTASTIC_LED_STATUS=y
