# Heltec Mesh Node T114 v2 (HT-n5262) — nRF52840 + bare SX1262 + 1.14" ST7789 TFT + L76K GNSS.
# Board target: heltec_t114_v2/nrf52840/uf2 (the upstream Zephyr board; this project adds
# no board directory of its own, only this conf and the .overlay beside it).
#
# The second nRF52840 target after the XIAO + Wio-SX1262 kit, and it inherits that board's
# MCU-side lessons wholesale (xiao_ble_nrf52840.conf tells each story at length; here only the
# ones that differ or need restating). What this board has that the XIAO does not: a reset
# button, a working 32 kHz crystal, a bare SX1262 with DIO2 as the TX/RX switch and a
# 1.8 V TCXO, a TFT, a GNSS receiver behind a switched rail, a 2 MB QSPI flash the upstream
# board file does not yet declare, and the Adafruit bootloader with SoftDevice v6's layout
# (application at 0x26000; the XIAO's v7 layout starts at 0x27000).

# --- Boot: the resident Adafruit UF2 bootloader jumps straight to the application vector
# table at 0x26000 (nordic/nrf52840_partition_uf2_sdv6.dtsi, selected by the /uf2 variant).
# The sample's prj.conf sets CONFIG_BOOTLOADER_MCUBOOT=y for the ESP32 OTA story, which
# reserves a 512-byte zero-filled signing header at the image start — the CPU then loads
# SP=0/PC=0 and locks up before the first instruction (the "dead XIAO" of 2026-08-23). This
# board has no MCUboot layout yet (the XIAO's mcuboot-xiao/ puts the second slot on QSPI;
# this board's QSPI flash is undeclared so far), so the image is the legacy single one the
# UF2 bootloader boots directly. `west build` emits zephyr.uf2 for the drive.
CONFIG_BOOTLOADER_MCUBOOT=n

# --- LFCLK: the board default (external 32 kHz crystal) stands. Upstream Meshtastic runs
# this board with USE_LFXO, so the crystal is known to start — unlike the XIAO kits, where it
# never does and the clock driver waits for it forever during pre-main boot (no USB, no
# console, a board that looks dead). If a T114 ever shows that symptom, the differential is
# boards/xiao-lfclk-rc.dtsi in this board's overlay (since Zephyr 4.5 the source is the lfclk
# node's k32src; the old CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC Kconfig is ignored, agents-xf7q).

# --- Radio: bare SX1262, no FEM. The SoC commands the radio output directly: the SX1262's
# own +22 dBm ceiling, not the FEM-boosted V4 numbers. DIO2 drives the antenna switch and
# DIO3 the TCXO (both in the upstream devicetree). Set per region/antenna.
CONFIG_MESHTASTIC_TX_POWER=20

# --- System heap: an upstream nRF board sets no pool of its own (HEAP_MEM_POOL_SIZE
# defaults to 0, "no system heap available"), and the fatal handler and the diag loop
# reference the kernel's _system_heap directly for their heap statistics — the link fails
# without one. The same 4096 B this project's ESP32 boards contribute, and the XIAO's shield
# Kconfig adds; this board has no shield, so it is stated here.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# --- Cortex-M diagnostics the XIAO shield's Kconfig.defconfig turns on for that board
# (tooling RF-PARITY-PLAN.md 8.16): kernel struct offsets for debugger/coredump thread
# plugins, register state at a fault, HCI errors as strings. (The coredump threads-metadata
# section the XIAO also sets has nothing to attach to while DEBUG_COREDUMP is off here; it
# comes with an MCUboot layout and its coredump partition.)
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_BT_HCI_ERR_TO_STR=y

# --- BLE: this board has no WiFi silicon, so BLE is its only phone transport — the ble
# variant as board baseline, exactly as on the XIAO.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_MESHTASTIC_BLE=y

# PKC (X25519 + AES-CCM) for DMs and remote admin. The BT host already pulls PSA with
# ECDH + SHA-256; this adds the Montgomery curve, the key types and CCM.
CONFIG_MESHTASTIC_PKI=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ALG_CCM=y

# Three connection slots: phone + inbound peer + outbound peer. Two proved too few on the
# first 3-node XIAO bench (a chain A -> B -> C is impossible when connectable advertising
# reserves the last conn object). The peer link itself is an overlay (overlay-ble-peer.conf),
# not baseline here: the first image is a plain node.
CONFIG_BT_MAX_CONN=3

# --- nRF52840 controller lessons from the XIAO bench (2026-08-26), same silicon, same
# controller, so carried as-is. Never let the peripheral request a connection-parameter
# update: a central's identical-interval grant desynchronised the link in 5 of 12 tries.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# Upstream's 6 s supervision timeout in the PPCP characteristic, for a central that honours
# it — a node that also services a LoRa radio and flash erases wants that slack.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
# GATT discovery runs on the BT RX thread; the 2048-byte default is known-tight.
CONFIG_BT_RX_STACK_SIZE=4096
# The cluster digest and PKC run on the system workqueue; 2048 overflowed on the XIAO the
# moment the first channel-encrypted digest fired.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- The bench surface: the only console is USB CDC (the board's cdc_acm_serial.dtsi
# makes it zephyr,console), so the shell rides the serial backend, with `log` and
# `settings` — the two commands that tell "the clear failed" from "a peer put it back".
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_MESHTASTIC_SHELL=y
CONFIG_LOG_CMDS=y
CONFIG_SETTINGS_SHELL=y

# --- Software bootloader re-entry (`meshtastic dfu`, and the 1200-baud touch so a UF2
# flash never needs the buttons): the Adafruit bootloader family honours both, as on the
# XIAO. This board does have a reset button, so the boot guard below is a convenience
# rather than the only way back — but it is proven on this MCU and the task watchdog is
# not, so the XIAO's split stands: guard on, task watchdog off (Kconfig.debug defaults).
CONFIG_MESHTASTIC_DFU_TRIGGER=y
CONFIG_REBOOT=y
CONFIG_UART_LINE_CTRL=y
# A fatal error reboots into the APP, not the bootloader (the XIAO's agents-xhli.16: a
# crash that parks the node in DFU defeats revert-on-bad-boot and unattended recovery).
CONFIG_MESHTASTIC_DFU_ON_FATAL=n
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_MESHTASTIC_DFU_BOOT_GUARD=y

# --- Cluster config sync, as the XIAO carries it (the module is baseline on every bench
# node; whether a class joins a cluster is the layout's business).
CONFIG_MESHTASTIC_CLUSTER=y
CONFIG_MESHTASTIC_CLUSTER_DIGEST_PERIOD_SEC=60

# --- Not in the first image, deliberately:
# - The 1.14" TFT (ST7789, RGB565). The screen UI is CFB over a MONO panel; CFB has no
#   RGB565 path, so MESHTASTIC_DISPLAY stays off and the panel's enable and backlight pins
#   (active-low TFT_EN P0.03, TFT_LED_EN P0.15) are left unasserted: the glass is dark and
#   draws nothing. A colour UI is its own project.
# - The L76K GNSS. The receiver sits behind Vext (P0.21, active-HIGH) and has its own
#   reset and wake pins; overlay-gnss.conf brings the module in once a board power hook
#   drives that rail (meshtastic_gnss_board_power is weak; see the .overlay).
# - The 2 MB QSPI flash (MX25R1635F) and with it the bulk NodeDB store and an MCUboot
#   second slot. The upstream board file declares no qspi node; that is a devicetree
#   addition for a later commit.
# - DEBUG_COREDUMP: the legacy layout has no coredump partition, and the logging backend
#   cannot run once the fatal handler has locked interrupts on a USB CDC console. Off by
#   Kconfig.debug default for this board, as for the XIAO.
