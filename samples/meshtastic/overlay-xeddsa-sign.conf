# Sign the packets this node originates (CONFIG_MESHTASTIC_XEDDSA_SIGN, Kconfig.xeddsa).
#
# Requires overlay-xeddsa.conf (signing depends on the verify option). What changes on the
# air: our broadcasts carry a 64-byte XEdDSA signature, so a peer can authenticate them
# instead of trusting the sender id. A packet whose signed form would not fit the frame goes
# out unsigned rather than not at all.
#
# ⚠️ NOT FOR THE XIAOs. ~38 KB more flash than verification alone -- the base-point table
# (30,720 B) and sc_muladd (6,548 B), neither of which verification links. A class-1 image
# has ~34 KB of slot left and the lockdown variant ~13 KB; the Heltecs have a 2 MB slot.
#
# ⚠️ AIRTIME: a signature is 66 bytes on the wire. On a slow preset that is a real fraction
# of a broadcast's time on air -- worth watching duty cycle if this ever runs on LongFast.
CONFIG_MESHTASTIC_XEDDSA_SIGN=y
