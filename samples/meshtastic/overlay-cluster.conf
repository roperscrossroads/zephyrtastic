# Cluster config sync (docs/CLUSTER-SYNC-M4.md, agents-xhli.4). Opt-in overlay
# for the ESP32 family (the XIAO board confs carry it as board baseline).
# Digest cadence pinned to the bench value while M4a measures real divergence;
# the shipping default stays the Kconfig 300 s.
CONFIG_MESHTASTIC_CLUSTER=y
CONFIG_MESHTASTIC_CLUSTER_DIGEST_PERIOD_SEC=60
