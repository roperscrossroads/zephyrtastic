# ===== overlay-ota-ble =====
# --- Firmware update over SMP (mcumgr) on Bluetooth LE ---
# The same MESHTASTIC_OTA subsystem overlay-ota.conf runs over UDP and
# overlay-ota-shell.conf over the console, carried on the BLE link the board
# already has for the phone: Zephyr registers the SMP GATT service
# (8D53DC1D-1DB7-4CD3-868B-8A527460AA84) beside the Meshtastic service, and a
# client (smpmgr --ble, Nordic's nRF Connect Device Manager) writes the image
# into slot1 with no cable, no 1200-baud touch and no serial host. The
# Meshtastic phone app does NOT speak SMP — it drives Nordic legacy DFU on
# stock nRF nodes — so the phone path is Device Manager, not Meshtastic.
#
# 2026-08-26. Requires the MCUboot A/B
# build (--sysbuild); usually stacked with overlay-ota-shell.conf so the cable
# path stays available: -DEXTRA_CONF_FILE="overlay-ota-shell.conf;overlay-ota-ble.conf".
CONFIG_MESHTASTIC_OTA=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# SMP packets are bigger than one ATT write; reassemble them.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# Access control — a DECISION, not a default. Zephyr's default with BT_SMP on
# is RW_AUTHEN: encryption AND authentication, i.e. a MITM-protected pairing.
# This fleet pairs Just Works (screenless bench, no passkey), which yields
# security level 2 at most, so RW_AUTHEN would refuse every write with
# "insufficient authentication" and nothing would say why. RW_ENCRYPT would
# work from a phone (the Meshtastic app already pairs Just Works with these
# nodes) but from a Linux client it needs a BlueZ pairing agent before the
# first write. For the bench proof the service is OPEN, which is exactly the
# permission the Meshtastic service itself carries on this build (see
# MT_GATT_PERM_* in meshtastic_ble.c). What protects the node is MCUboot's
# signature check — and until SB_CONFIG_BOOT_SIGNATURE_KEY_FILE names a real
# key, that check accepts anything signed with MCUboot's public dev key.
# Step up to RW_ENCRYPT (and a real key) before a node leaves the bench.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y

# MCUboot image manager backend for img_mgmt (slot1 write / test / confirm).
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# `mcuboot info` / confirm / request_upgrade on the console, as in the shell
# overlay (harmless twice).
CONFIG_MCUBOOT_SHELL=y

# Throughput lever: the XIAO build ran a 65-byte L2CAP MTU (23-byte ATT
# payloads). The ESP32 unified profile carries 247/251; same numbers here so
# an SMP chunk is ~244 bytes of payload per ATT write instead of ~20. The
# controller side (CTLR_DATA_LENGTH_MAX) must grow with the host buffers or
# the data-length update negotiates back down.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# SMP frame buffers: the BT transport has no line framing, so the frame size
# is bounded by NETBUF_SIZE alone (the shell overlay's 1152 if stacked; else
# this). img_mgmt writes flash on the SMP work queue — same stack bump.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1152
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096

# Answer `os mcumgr_params` (buffer size + count) so a client sizes its frames
# from the device's own numbers instead of a conservative guess. Without it,
# smpmgr falls back to tiny frames and the BLE upload crawls — measured on the
# ESP32 R8: 2 KB/s without this vs the XIAO's 6 KB/s. One line, no RAM cost.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# The fleet's intent verbs over BLE (DECLARATIVE-FLEET.md §15, F4): `smpmgr --ble <node>
# shell "meshtastic fleet status"` runs the Zephyr shell over SMP, so a node with no
# console — every kit on the bench — still answers `just fleet status <node>`. The dummy
# backend is a second shell instance the SMP shell group feeds; its buffer bounds
# one command's reply (fleet status with a full depot is ~1.5 KB).
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=2048
CONFIG_MCUMGR_GRP_SHELL=y

# The target half of a node-to-node update (DECLARATIVE-FLEET.md §9): a courier
# delivers an image and leaves it UNCONFIRMED (it must not confirm on a peer's
# behalf), so the target confirms itself after a healthy window. Without this a
# courier-delivered image would always revert. 120 s default; the beat carries
# TESTBOOT until it clears.
CONFIG_MESHTASTIC_OTA_AUTOCONFIRM=y
