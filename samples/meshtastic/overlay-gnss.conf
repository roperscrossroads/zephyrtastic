# ===== overlay-gnss =====
# Enable the L76K NMEA GNSS on uart1, with a stable modem-UART RX path. Appended by
# the justfile when GNSS=1 (default on for a profile build — the V4 bench boards have
# GPS wired). Layered after overlay-v4-unified.conf, so its CONFIG_GNSS=y overrides
# that profile's conservative default of =n (the public default stays off: a board
# with no GPS wired saves ~1.7 KB internal DRAM and never reads a floating UART).
#
# This file holds ONLY non-secret firmware config, so it is tracked. The real broker /
# syslog-collector / NTP identifiers stay in the gitignored overlay-net-local.conf.
CONFIG_GNSS=y
CONFIG_MESHTASTIC_GNSS=y

# --- Modem-UART RX stability (STABILITY-1, 2026-08-02) ---
# The L76K streams NMEA continuously (uart1, 9600 baud). The gnss-nmea-generic driver
# drains its 256 B ISR ring via modem_chat, which by default runs on the SHARED system
# workqueue (prio -1) — serialized behind net/WiFi/syslog work items. Under the busy
# unified image that drain is delayed past the ring's ~267 ms fill time and it overruns
# ~1/s ("modem_backend_uart_isr: Receive buffer overrun"). Each overrun logs a WRN that
# LOG_BACKEND_NET ships as a syslog-UDP packet; that flood was measured saturating WiFi
# to ~630 B/s and crash-looping both V4 bench nodes. Give the modem its OWN workqueue,
# one coop step above the system wq, so it drains the ring promptly. This is the fix.
CONFIG_MODEM_DEDICATED_WORKQUEUE=y
CONFIG_MODEM_DEDICATED_WORKQUEUE_PRIORITY=-2
CONFIG_MODEM_DEDICATED_WORKQUEUE_STACK_SIZE=2048

# Optional insurance (off by default): cap the modem modules' log at ERR so the
# per-overrun WRN can never be emitted — hence never shipped over syslog-UDP — even if
# a residual overrun slips past the workqueue fix. It hides ALL modem WRN/INF, so leave
# it off until the workqueue alone is confirmed to hold overruns at zero (build without
# it, then `log enable wrn modem_backend_uart_isr` and watch the count). Turn on only if
# a residual flood is actually observed.
# CONFIG_MODEM_MODULES_LOG_LEVEL_ERR=y
