# Sign the cluster entries this node authors (CONFIG_MESHTASTIC_CLUSTER_SIGN,
# Kconfig.cluster; agents-ooma.31).
#
# Requires overlay-xeddsa.conf (signing depends on the verifier) and
# overlay-cluster.conf. Meant for the node that AUTHORS fleet config -- the master --
# though any node may sign its own pins. Verification of signed entries needs no
# overlay beyond overlay-xeddsa.conf: every such build checks them.
#
# Independent of overlay-xeddsa-sign.conf (packet signing, agents-ooma.35). This one
# signs on a dedicated thread and has never been implicated in a stack overflow;
# measure it on hardware anyway, with `meshtastic threads` or the thread analyzer --
# the signing thread's stack is INTERNAL RAM (CONFIG_MESHTASTIC_XEDDSA_SIGN_STACK_SIZE).
#
# ⚠️ NOT FOR THE XIAOs: the signing primitive links ~38 KB of base-point table.
CONFIG_MESHTASTIC_CLUSTER_SIGN=y
