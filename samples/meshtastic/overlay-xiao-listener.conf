# Fleet image class 9: the listener on a XIAO nRF52840 + Wio-SX1262. Layer with
# overlay-scanner.conf and overlay-listener.conf, and WITHOUT overlay-ble-peer.conf
# (a listener dials nothing; that alone is 47.8 KB of flash) or the cluster
# overlays. Flashed over USB on ikkai, so no courier path is needed.
CONFIG_MESHTASTIC_FLEET_CLASS=9
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--custom-tlv 0x00A0 0x09"

# The XIAO board conf turns the peer link on for every XIAO image; a listener
# dials nothing and is never a courier target (it is flashed over USB).
CONFIG_MESHTASTIC_BLE_PEER=n

# No PSRAM: the ring lives in the nRF52840's 256 KB RAM. 1024 x 25 B = 25 KB.
# 2048 built at 97.7% static RAM, too close for the BT and system heaps.
# Drain it with scantap.py; on ikkai's hub that is cheap and frequent.
CONFIG_MESHTASTIC_SCANNER_RING_RECORDS=1024
