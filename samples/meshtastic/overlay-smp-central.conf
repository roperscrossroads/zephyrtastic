# ===== overlay-smp-central =====
# --- This node as an SMP (mcumgr) CLIENT over BLE: it manages a peer node ---
# The mirror of overlay-ota-ble.conf. That overlay makes a node an SMP *target*
# (the GATT service smpmgr --ble talks to); this one makes a node an SMP
# *client* that connects to such a target as a BLE central and runs the same
# upload / test / reset / confirm a laptop would — a node updating its
# neighbour with no host in the middle. Zephyr ships the client core
# (smp_client, img_mgmt_client, os_mgmt_client) but no BLE-central transport
# for it; src/meshtastic_smp_central.c is that transport. Shell: `smpc`.
#
# The image pushed is whatever is staged in THIS node's slot1 (uploaded there
# over any SMP path and never marked for test — MCUboot ignores an unmarked
# secondary slot), so an ESP32 with 5.9 MB of slot1 is a store-and-forward
# depot for nRF images. Usually stacked with overlay-ota-ble.conf so the
# courier is itself fed over BLE:
#   -DEXTRA_CONF_FILE="...;overlay-ota-ble.conf;overlay-smp-central.conf"
#
# 2026-08-26: the A.3 "node feeds its peer" spike (SMP-client route), built to
# compare against BT Mesh DFU for ESP32 -> nRF direct programming.
CONFIG_MESHTASTIC_SMP_CENTRAL=y

# Two connections: the node's own peripheral side (phone / smpmgr) plus the
# central link to the target. The ESP32 controller allows 3 (ESP32_BT_CTLR_LE_MAX_CONN).
CONFIG_BT_MAX_CONN=2

# Client timing. A command lives 5 s by default with a 500 ms retry tick; the
# image group's flash-operation timeout (15 s) covers the target's slot1
# erase when it is on slow QSPI. Four requests in flight is plenty for one
# link with one job.
CONFIG_SMP_CLIENT_CMD_MAX=4
CONFIG_SMP_CMD_DEFAULT_LIFE_TIME=5
CONFIG_MCUMGR_GRP_IMG_FLASH_OPERATION_TIMEOUT=15
