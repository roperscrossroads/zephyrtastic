# A fresh node keeps its transmitter off until someone turns it on.
#
# With nothing stored, a node boots on the build's defaults: LongFast, the public preset,
# at the region's full power, and it beacons within the first minute. On a bench that is a
# stranger's mesh hearing a test board at 22 dBm before anyone has typed a command
# (agents-pcs2.9: a XIAO flashed over stock did exactly that for about a minute).
#
# This seeds config.lora.tx_enabled = false, so the first boot is receive-only. Bring-up
# then sets the preset and the power and turns the transmitter on:
#
#     meshtastic lora preset <name>
#     meshtastic lora power <dBm>
#     meshtastic lora tx on
#
# Only a node with NO stored LoRa config is affected. A node that has ever had its preset,
# power or tx set keeps what is stored, across a reflash too.
CONFIG_MESHTASTIC_TX_ENABLED_DEFAULT=n
