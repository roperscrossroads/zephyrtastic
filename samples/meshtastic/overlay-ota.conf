# ===== overlay-ota =====
# --- OTA firmware update over SMP/UDP (mcumgr) ---
# Chained after the net chain (justfile OTA=1, the default). Requires the MCUboot
# A/B build (SYSBUILD=1) — the port gate MESHTASTIC_OTA `depends on
# BOOTLOADER_MCUBOOT`. net variant only — this overlay IS the UDP transport;
# a board without an IP stack uses overlay-ota-shell.conf instead.
#
# 2026-08-23: extracted from overlay-v4-unified.conf, where this had been baked in
# unconditionally — OTA=0 silently did nothing for a PROFILE build (the same
# already-baked-in failure mode nomqtt had until 2026-08-05). Costs ~12 KB of
# internal DRAM (~5.4 KB smp_udp .dram0.bss + ~6.2 KB smp noinit + img_mgmt
# state); OTA=0 reclaims it, which is what lets a CONFIG_BT=y unified image fit
# dram0_0_seg (agents-wu94.6). A board without OTA flashes over USB.
#
# MESHTASTIC_OTA selects the mcumgr/img_mgmt/os_mgmt/DFU pieces; the knobs below
# are the tuning/trims that keep it inside the net variant's tight DRAM budget.
CONFIG_MESHTASTIC_OTA=y

# Transport: SMP over UDP, IPv4 only (drops a whole listener thread + v6 buffers).
# MESHTASTIC_OTA stopped selecting a transport on 2026-08-26 (the XIAO carries
# the same subsystem over its serial console — overlay-ota-shell.conf), so the
# UDP transport is named here, where the WiFi assumption actually lives.
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV6=n
CONFIG_MCUMGR_TRANSPORT_UDP_PORT=1337

# MCUboot image manager backend for img_mgmt (slot1 write / test / confirm).
CONFIG_MCUBOOT_IMG_MANAGER=y

# DRAM trims (see plan budget). MTU/netbuf 1024 keeps upload chunks small;
# erase-progressively wipes slot1 as we stream rather than all up front.
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=2
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_MCUMGR_TRANSPORT_UDP_MTU=1024
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Stack bumps from the 2026-07-18 stability investigation (measured near the
# wall via `kernel thread stacks`, then doubled twice — see the investigation
# notes in overlay-v4-unified.conf, where these lived until the 2026-08-23
# extraction). Moved here with the rest of the block: with OTA=0 an assignment
# to a dep-unmet MCUMGR symbol is a fatal Kconfig warning.
# mcumgr smp: was 2048 (Zephyr default), measured 57-69% used
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
# smp_udp4: was 1024 (Zephyr default), measured 70% used
CONFIG_MCUMGR_TRANSPORT_UDP_STACK_SIZE=4096
