# ===== overlay-attachment-head =====
# A keyless radio head (ATTACHMENT-DESIGN S5, D1): one radio that forwards every
# frame it hears, undecoded, to its brain over the BLE peer link, and retunes when
# the brain says so. It has no identity on the air: no channel keys, no PKI, no
# NodeDB, no modules that would speak, no clock setter. The build's post-build
# step (cmake/keyless-assert.cmake) refuses an image in which any of that linked.
# Set the brain with `meshtastic attach brain <id>`, or bake it in:
#   CONFIG_MESHTASTIC_ATTACHMENT_HEAD_BRAIN_ID=0x<id>
# Needs the peer link (overlay-ble-peer.conf) to actually reach a brain.
CONFIG_MESHTASTIC_ATTACHMENT_HEAD=y
# A head's frames feed relay timing on the brain; the link's connection interval is
# the floor of their latency (ATTACHMENT-STATUS §2c). Ask for 15 ms once the frame
# channel is up (central-initiated; the courier and plain peers keep the default).
CONFIG_MESHTASTIC_BLE_PEER_FRAME_CONN_INTERVAL_MS=15
# The head's link identity is its hardware id; it never builds a frame.
CONFIG_MESHTASTIC_NODE_ID_HWINFO=y
CONFIG_MESHTASTIC_NODE_ID_FROM_KEY=n
# Everything that holds or uses a key, or speaks on the air, or sets the clock.
CONFIG_MESHTASTIC_PKI=n
CONFIG_MESHTASTIC_NODEDB=n
CONFIG_MESHTASTIC_KEYVERIFY=n
CONFIG_MESHTASTIC_XEDDSA=n
CONFIG_MESHTASTIC_CLUSTER=n
CONFIG_MESHTASTIC_POSITION=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_NODEINFO=n
CONFIG_MESHTASTIC_STATUSMESSAGE=n
CONFIG_MESHTASTIC_NEIGHBORINFO=n
CONFIG_MESHTASTIC_MESHBEACON=n
CONFIG_MESHTASTIC_TRAFFIC=n
CONFIG_MESHTASTIC_MESSAGE=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_AIRTIME=n
CONFIG_MESHTASTIC_ADMIN=n
CONFIG_MESHTASTIC_ADMIN_CLIENT=n
CONFIG_MESHTASTIC_RELAY=n
CONFIG_MESHTASTIC_RELAY_EAR=n
CONFIG_MESHTASTIC_SCANNER=n
CONFIG_MESHTASTIC_TRACEROUTE=n
CONFIG_MESHTASTIC_LOCKDOWN=n
CONFIG_MESHTASTIC_DISPLAY=n
CONFIG_MESHTASTIC_EXTNOTIFY=n
CONFIG_MESHTASTIC_SNTP=n
