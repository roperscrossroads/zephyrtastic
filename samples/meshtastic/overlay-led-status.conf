# ===== overlay-led-status =====
# Bench-visibility LED: solid while powered with no active BLE peer link,
# 1 Hz blink while at least one peer link (inbound or outbound) is up. See
# Kconfig.led_status / meshtastic_led_status.h.
#
# Requires CONFIG_MESHTASTIC_BLE_PEER (this overlay does not enable it —
# combine with overlay-ble-peer.conf on a board that doesn't already carry
# peer-link, e.g. a XIAO; the Heltec classes already have it via
# overlay-nonet.conf).
#
# MESHTASTIC_LED_STATUS and MESHTASTIC_EXTNOTIFY both want sole ownership of
# led0 and don't arbitrate with each other, so this overlay turns extnotify
# off. Nothing in the current fleet recipes configures extnotify's alerting
# (ModuleConfig.external_notification.enabled defaults off), so this costs
# nothing in practice today.
CONFIG_MESHTASTIC_EXTNOTIFY=n
CONFIG_MESHTASTIC_LED_STATUS=y
