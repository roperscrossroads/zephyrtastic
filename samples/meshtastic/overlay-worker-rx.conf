# ===== overlay-relay-rx-only worker =====
# The cross-preset relay's rx-only worker, worker-rx (agents-jbrq.12): forwards the broadcast text it
# hears on its preset, byte for byte, to the receiving half over the BLE peer
# link. Transmit is compiled out (MESHTASTIC_WORKER_RX_RX_ONLY, default y): an
# rx-only worker sits on a public channel it does not own. Set the receiving half with
# `meshtastic worker-rx peer <id>`, or bake it in:
#   CONFIG_MESHTASTIC_WORKER_RX_PEER=0x<id>
# Needs the peer link (overlay-ble-peer.conf, or a profile carrying it).
CONFIG_MESHTASTIC_WORKER_RX=y
# An rx-only worker only listens: nothing to announce.
CONFIG_MESHTASTIC_NODEINFO_AUTO_SEND=n
CONFIG_MESHTASTIC_DEVICE_METRICS_AUTO_SEND=n
