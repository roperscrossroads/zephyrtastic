# ===== overlay-web-serial =====
# The Meshtastic PhoneAPI over USB, for Web Serial (the web client's "Serial"
# connection) and the Python CLI, on boards whose only USB serial is the
# console. Needs phone-cdc.overlay (EXTRA_DTC_OVERLAY_FILE), which adds a
# second CDC-ACM port and points zephyr,meshtastic-uart at it — the console
# stays on the first, so the shell and the StreamAPI never share a port.
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_SERIAL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_MESHTASTIC_SAMPLE_USB_PHONE_CDC=y
