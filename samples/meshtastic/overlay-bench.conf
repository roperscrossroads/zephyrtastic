# A test bench: a handful of boards on one desk, low power, a private channel. Settings
# that suit that and would not suit a public mesh. Every bench class image carries it.
#
# Answer a peer's NodeInfo request again after an hour, not upstream's 12 h
# (USERPREFS_NODEINFO_REPLY_SUPPRESS_SECS). Upstream protects a busy public mesh from
# nodes that ask too often. On a bench, boards are reflashed and rebooted all day; with
# 12 h, a board that comes back and asks is not answered by anyone it asked in the last
# 12 h, and it learns their names only from their NodeInfo broadcasts, every 3 h.
CONFIG_MESHTASTIC_NODEINFO_REPLY_SUPPRESS_SEC=3600
