# Stage 2 (netserial) reconcile — BLOCKED by a Zephyr Kconfig dependency loop.
# (Tracked 2026-08-23; was the gitignored overlay-serial-local.conf, hidden only
# because its name matched the *-local.conf secrets pattern — it contains no
# secrets, just parked config + the blocker's documentation.)
#
# Intent: layer serial PhoneAPI on uart0 over the net chain; console/shell/logs
# move to telnet. But enabling MESHTASTIC_SERIAL together with the WiFi credential
# store (NVS -> FLASH_MAP -> FLASH_AREA_CHECK_INTEGRITY, which `select PSA_CRYPTO`)
# closes a kconfiglib select-cycle through the crypto/entropy/I2C/RESET driver
# graph. Verified: the loop persists with admin off, with the console re-enabled,
# and cannot be pinned away (kconfiglib analyses `select` edges structurally, not
# by value). Root bridge is Zephyr flash_map/Kconfig `FLASH_AREA_CHECK_INTEGRITY
# select PSA_CRYPTO`; MESHTASTIC already selects PSA_CRYPTO so it is redundant here.
#
# Not usable until either (a) TCP:4403 replaces serial as the config transport
# (TCP does not pull the uart/serial/reset graph, so no loop), or (b) the Zephyr
# tree is patched. See PORT-LOG-01.md ("Serial-over-net Kconfig loop").
#
# Config that WOULD be needed (kept for when the loop is resolved):
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_EARLY_CONSOLE=n
