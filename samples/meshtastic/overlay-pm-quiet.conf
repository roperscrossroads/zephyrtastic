# overlay-pm-quiet.conf — a QUIET rig for measuring light sleep.
#
# Layer on top of the unified profile:
#   ... -DEXTRA_CONF_FILE="overlay-v4-unified.conf;overlay-pm-quiet.conf"
# or via the justfile:  BOARD_TAG=heltec-v4 PM=1 PMQUIET=1 MQTT=0 just dist
#
# WHY THIS EXISTS
# ---------------
# Every network-based way of observing light sleep perturbs it. A telnet `stats list` is
# WiFi traffic; WiFi traffic makes the esp_pm "wifi" lock engage and wakes the SoC. Measured
# on hardware 2026-07-23, that lock is held only 7-16% of wall time — yet every `cpu
# available` query returned lock=Y, because the query itself created the lock. The residency
# counters read over the network therefore measure the measurement.
#
# This overlay removes the periodic network noise and gives the console back, so the node can
# be driven and read over USB/serial while the radio side stays real.
#
# Pair with `meshtastic netpause <secs>` (shell) to take the network fully down for a
# bounded window; residency counters are cumulative, so read them afterwards.

# --- Remote syslog OFF. The netlog config ships logs as RFC5424/UDP, so EVERY log line is
#     a network transmit that wakes WiFi — the worst possible thing under a sleep experiment.
CONFIG_LOG_BACKEND_NET=n

# --- Console logging back ON. The netlog config turns the UART backend off (logs go to the
#     collector instead). That is why the USB console appeared "dead" during PM bring-up: it
#     had a shell but no log output. Restore it so the serial console is usable standalone.
CONFIG_LOG_BACKEND_UART=y

# --- No network shell. Prevents an idle telnet session from silently holding the node awake
#     (and from tempting anyone into measuring over the network again). Shell stays on serial.
CONFIG_SHELL_BACKEND_TELNET=n

# --- No periodic wall-clock sync. SNTP is a timer + a UDP round trip.
CONFIG_MESHTASTIC_SNTP=n

# --- No MQTT bridge: broker keepalive is a periodic network wake. (Equivalent to MQTT=0;
#     set here too so this overlay is self-contained.)
CONFIG_MESHTASTIC_MQTT=n

# --- Do NOT bring WiFi up at boot. This is the point of the rig: a genuinely quiet node.
#     NOTE: with WiFi down there is no OTA — flash this image over USB serial
#     (`BOARD_TAG=heltec-v4 PM=1 PMQUIET=1 MQTT=0 just flash`). Bring WiFi up by hand with
#     `wifi connect ...` if you want to A/B the noisy case on the same image.
CONFIG_MESHTASTIC_WIFI_AUTOCONNECT=n
