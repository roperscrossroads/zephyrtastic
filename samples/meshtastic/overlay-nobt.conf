# ===== overlay-nobt ===== (the "net" variant delta)
# Drop Bluetooth from the unified profile: this node lives on WiFi, so the BLE
# stack is dead weight — a ~25.6 KB kernel-heap reservation
# (HEAP_MEM_POOL_ADD_SIZE_ESP_BT) plus the BLE thread stacks and HCI/ACL/ATT
# net-buf pools (~20 KB) = ~45 KB of internal SRAM.
#
# 2026-08-23: promoted from the gitignored overlay-net-local.conf, where this
# lived as a "local experiment" since 2026-08-04. A feature-set decision hiding
# in the secrets overlay is how the BT half of the unified image rotted into a
# dram0_0_seg overflow with nobody noticing (agents-wu94.6): every routine build
# silently carried this block. The local overlay now holds identifiers only;
# this file is the tracked, named form — appended by the justfile for
# VARIANT=net (the default for a PROFILE=v4-unified build, matching what the
# bench nodes actually run).
#
# CAVEAT: no BLE means no phone-app provisioning; bootstrap WiFi via the serial
# shell or preloaded NVS credentials.
#
# CONFIG_BT=n forces MESHTASTIC_BLE=n (it `depends on BT`), so meshtastic_ble.c
# compiles out; both are set explicitly so this file states the whole intent.
CONFIG_BT=n
CONFIG_MESHTASTIC_BLE=n
