# Read VBAT via the vbatt divider (Kconfig.battery), on Heltec V4/V4-R8 only --
# the divider is board-level DT (heltec_wifi_lora32_v4-common.dtsi, shared by both
# revisions), so this overlay is meaningless on any board without that node. Do not
# add it to the XIAO (class 1) classes.
#
# CONFIG_MESHTASTIC_BATTERY_CUTOFF defaults to y and pulls in CONFIG_POWEROFF, but a
# node with nothing plugged into the divider reads well below
# CONFIG_MESHTASTIC_BATTERY_CUTOFF_MV's no-battery floor, so meshtastic_battery_present()
# is false and the cutoff state machine never counts a sample (see
# main/tests/battery_cutoff). It is safe to build this into every fleet member even
# before a real cell is on the bench -- the trip path stays cold until one is.
CONFIG_MESHTASTIC_BATTERY=y
