# overlay-pm-off.conf — build a PM-free (no light-sleep) image.
#
# Layer LAST, on top of the unified profile, so its CONFIG_PM=n wins over the
# profile's CONFIG_PM=y:
#   ... -DEXTRA_CONF_FILE="overlay-v4-unified.conf;overlay-pm-off.conf"
# or via the justfile:  PROFILE=v4-unified PM=0 BOARD_TAG=heltec-v4 just dist
#
# WHY THIS EXISTS
# ---------------
# The shipping profile turns the ESP32-S3 PM subsystem on (CONFIG_PM=y), which lets
# the idle thread enter PM_STATE_STANDBY (esp_light_sleep_start). This overlay builds
# the opposite baseline: the PM subsystem off entirely, so the light-sleep governor
# (src/meshtastic_power.c) compiles to no-ops and the SoC never powers the CPU domain
# down. Only the ordinary tickless idle (the Xtensa WAITI, which halts the core until
# the next interrupt) remains — that is unconditional and needs no PM.
#
# It is an OBSERVABILITY / A-B lever, not a power change. On a radio-up node the
# esp-idf WiFi/BLE controller already pins STANDBY regardless of CONFIG_PM (the
# `meshtastic power` console shows "STANDBY lock held by esp-idf radio controller,
# NOT the governor", and the light-sleep counter reads 0), so such a node is not
# saving CPU-domain power under CONFIG_PM in the first place. This image removes the
# whole PM machinery so you can prove a behaviour is or is not implicated in light
# sleep, with a clean image rather than a runtime hold.
#
# For a per-SESSION pin-awake without rebuilding, prefer the runtime hold instead:
#   meshtastic pm off   (volatile; cleared on reboot; see cmd_pm in meshtastic_shell.c)
# This overlay is for when you want a genuinely PM-free binary.

# --- Turn the PM subsystem off. The board DT wakeup-source declarations
#     (rtc_timer / gpio / lora) go inert without it; nothing enters light sleep.
CONFIG_PM=n

# --- Symbols that depend on PM would otherwise be assigned y by the profile with
#     their dependency now unmet (a Kconfig warning). Clear them so the config is
#     clean. PM_STATS is the residency-stats collector; POWER_SAVE_DEFAULT is the
#     governor's compiled is_power_saving fallback (moot with the governor gone).
CONFIG_PM_STATS=n
CONFIG_MESHTASTIC_POWER_SAVE_DEFAULT=n
