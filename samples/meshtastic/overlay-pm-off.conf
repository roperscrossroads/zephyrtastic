# overlay-pm-off.conf — build a PM-free (no light-sleep) image.
#
# 2026-08-23: the shipping profile (overlay-v4-unified.conf) now defaults CONFIG_PM=n
# itself — see the note at that file's "===== overlay-pm =====" header (battery-related
# debugging in progress; a PM-free baseline was the owner's explicit call). This overlay
# is therefore REDUNDANT against the current default and mostly exists now as (a) an
# explicit, self-documenting way to ask for the PM-off config by name rather than relying
# on knowing the profile's current default, and (b) a safety net if the profile's default
# is ever flipped back to y without this file being reconsidered. See
# overlay-pm-on.conf for the counterpart that restores CONFIG_PM=y once the profile
# defaults off, and docs/AUG-23.md for the fuller story.
#
# Layer LAST, after the unified profile, so its CONFIG_PM=n wins over whatever the
# profile itself currently defaults to:
#   ... -DEXTRA_CONF_FILE="overlay-v4-unified.conf;overlay-pm-off.conf"
# or via the justfile:  PROFILE=v4-unified PM=0 BOARD_TAG=heltec-v4 just dist
#
# WHY THIS EXISTS
# ---------------
# CONFIG_PM=y lets the idle thread enter PM_STATE_STANDBY (esp_light_sleep_start). This
# overlay builds the opposite baseline: the PM subsystem off entirely, so the light-sleep
# governor (src/meshtastic_power.c) compiles to no-ops and the SoC never powers the CPU
# domain down. Only the ordinary tickless idle (the Xtensa WAITI, which halts the core
# until the next interrupt) remains — that is unconditional and needs no PM.
#
# It is an OBSERVABILITY / A-B lever, not a power change. On a radio-up node the
# esp-idf WiFi/BLE controller already pins STANDBY regardless of CONFIG_PM (the
# `meshtastic power` console shows "STANDBY lock held by esp-idf radio controller,
# NOT the governor", and the light-sleep counter reads 0), so such a node is not
# saving CPU-domain power under CONFIG_PM in the first place. This image removes the
# whole PM machinery so you can prove a behaviour is or is not implicated in light
# sleep, with a clean image rather than a runtime hold.
#
# For a per-SESSION pin-awake without rebuilding, prefer the runtime hold instead:
#   meshtastic pm off   (volatile; cleared on reboot; see cmd_pm in meshtastic_shell.c)
# This overlay is for when you want a genuinely PM-free binary.

# --- Turn the PM subsystem off. The board DT wakeup-source declarations
#     (rtc_timer / gpio / lora) go inert without it; nothing enters light sleep.
CONFIG_PM=n

# --- Symbols that depend on PM would otherwise be assigned y by the profile with
#     their dependency now unmet (a Kconfig warning). Clear them so the config is
#     clean. PM_STATS is the residency-stats collector; POWER_SAVE_DEFAULT is the
#     governor's compiled is_power_saving fallback (moot with the governor gone).
CONFIG_PM_STATS=n
CONFIG_MESHTASTIC_POWER_SAVE_DEFAULT=n

# --- PM_CPU_SHELL does NOT actually depend on CONFIG_PM in zephyr/subsys/pm/Kconfig
#     (only `depends on SHELL`) -- a real upstream gap. The profile turns it on
#     unconditionally (overlay-v4-unified.conf) for the PM=1 image's CPU-state shell;
#     left enabled here, zephyr/subsys/pm/pm_cpu_shell.c fails to build because it
#     references CONFIG_PM_LOG_LEVEL / pm_state_to_str / pm_policy_state_is_available /
#     pm_state_from_str, all of which are only declared under CONFIG_PM=y elsewhere in
#     the PM subsystem. Found 2026-08-09 building the first-ever PM=0 image.
CONFIG_PM_CPU_SHELL=n
