# native_sim: the gateway's Sparkplug Edge Node against a broker on the host, through the host's
# own sockets (NSOS: no TAP, no setup), plus `simradio` so the sim board hears made-up peers.
# Use with overlay-sparkplug.conf and rxrbench's sim board config (sim.conf, sim.overlay).
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_SETTINGS=y
CONFIG_MESHTASTIC_SIM_RADIO_SHELL=y
# a short window so a silent peer's DDEATH is seen in a demo
CONFIG_MESHTASTIC_SPARKPLUG_DEATH_SEC=120
CONFIG_MESHTASTIC_SPARKPLUG_INTERVAL_SEC=5
