# Fleet image class 8: the listener on a Heltec V4-R8. Layer with
# overlay-scanner.conf and overlay-listener.conf. A class of its own because a
# V4 image and an R8 image must never share one (see overlay-v4r8-member.conf).
CONFIG_MESHTASTIC_FLEET_CLASS=8
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--custom-tlv 0x00A0 0x08"

# GNSS stays on as the clock source (a listener's timestamps are its product);
# it just never broadcasts what it finds.
CONFIG_MESHTASTIC_GNSS_AUTO_SEND=n

# 100000 records x 25 B = 2.5 MB of the R8's 8 MB PSRAM; the Kconfig help has
# the measured ceiling for this profile (100000, ~1.4 MB spare).
CONFIG_MESHTASTIC_SCANNER_RING_RECORDS=100000
