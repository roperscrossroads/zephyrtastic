# Fleet image class 4 — a healthy Heltec V4: transmits, participates in the mesh
# and the cluster, and carries the RX-only survey so any of them can be put into
# listener mode at runtime.
#
# WHY THIS IS A DIFFERENT CLASS FROM 3, ON IDENTICAL HARDWARE.
# Both are hw_model 110 (HELTEC_V4). Class 3 (overlay-notx.conf) is the
# transmit-disabled build for rxru, whose LoRa antenna connector is broken —
# transmitting into it is what we are preventing. hw_model cannot tell the two
# apart, so the CLASS is the only thing standing between rxru and an image that
# would transmit. That is precisely why class != hw_model (DECLARATIVE-FLEET.md
# §5.2), and why these two numbers must never be merged: a courier offers a node
# only images of the node's OWN class, and the class rides in the signed image
# (protected TLV 0x00A0) rather than in a bench convention.
CONFIG_MESHTASTIC_FLEET_CLASS=4
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--custom-tlv 0x00A0 0x04"

# NOTE: the survey is deliberately NOT enabled here. It used to be, so that any
# healthy V4 could be pressed into listening — but that duplicated the existing
# one-line overlay-scanner.conf and spent 442 KB of every participant's PSRAM on
# a ring it never fills. Composition instead of duplication: a build that wants
# the survey adds overlay-scanner.conf, and the listener role does exactly that
# (overlay-v4-listener.conf).

# Receive-only until someone configures this node (agents-xhli.21).
#
# Flashing erases NVS, so a fresh board takes the built-in defaults: LongFast --
# the PUBLIC mesh -- with TX on at the region's full power. On 2026-08-28 rzr2
# did exactly that and had broadcast a NodeInfo onto public LongFast within 33 s
# of boot, before any operator command could land. The existing first-boot guard
# does not cover this: CONFIG_MESHTASTIC_DEFAULT_REBROADCAST_MODE stops a
# never-configured node RELAYING other people's traffic, but it still transmits
# its OWN, deliberately, so that it stays discoverable.
#
# On this bench "discoverable over the air" is worth nothing -- every node is
# reachable by USB console or BLE -- and beaconing onto a public mesh we are
# supposed to treat as read-only territory (CLAUDE.md section 7) costs
# something. So the bench build boots mute and the operator turns TX on with
# `meshtastic lora tx on` once the preset and channels are right.
#
# NOTE this is a BENCH default, not a shipping one: a field node that boots
# unable to transmit is also unable to be found. Do not lift this into a
# non-bench profile without answering that.
CONFIG_MESHTASTIC_TX_ENABLED_DEFAULT=n
