# PROFILE v4-unified: Heltec V4 — BLE + WiFi/net PhoneAPI in ONE image (runtime
# transport toggle) + OTA + netlog + display + PM. Local infra IPs via the
# gitignored overlay-net-local.conf.
# The single shipping profile. The per-transport profiles (v4-net / v4-ble /
# v3-net / v4-netserial) were removed in favour of it; this file is now
# hand-maintained (no generator). The "# ===== overlay-X =====" dividers below
# mark which upstream fragment each config block originated from.

# ===== overlay-shell =====
CONFIG_SHELL=y
CONFIG_MESHTASTIC_SHELL=y

CONFIG_LOG_CMDS=y
CONFIG_SETTINGS_SHELL=y

# `hwinfo reset_cause` on demand — live cross-check for the NETLOG boot-time
# reset-cause line (main.c), reachable over telnet without waiting for a reboot.
CONFIG_HWINFO_SHELL=y

# Stack-overflow diagnostics (2026-07-18, stability investigation): STACK_SENTINEL turns a
# stack overflow into a clean, detected fault (visible via our reset-cause diagnostic as
# PANIC) instead of silent corruption of whatever's adjacent in DRAM — plausible unifying
# mechanism for the wedge given ~20 fixed-size thread stacks sized by guesswork, never
# measured. STACK_USAGE lets `kernel stacks` report real per-thread high-water-mark over
# telnet, so any future stack-size trims are evidence-based rather than more guessing.
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_USAGE=y

# GNSS shell commands require GNSS enabled (CONFIG_MESHTASTIC_GNSS) as well.

# Shell backend thread — doubled from 2048 (was 84% under load, incl. printing the thread table).
CONFIG_SHELL_STACK_SIZE=4096

# ===== overlay-wifi-shell =====
CONFIG_EARLY_CONSOLE=y

CONFIG_NETWORKING=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_DHCPV4=y

CONFIG_NET_IPV4=y
# CONFIG_NET_IPV6=n now lives inline in this net profile (the IP-version policy's home);
# this overlay is always chained together with it in the net variant.

CONFIG_NET_TCP=y

CONFIG_NET_LOG=y
CONFIG_INIT_STACKS=y

CONFIG_NET_SHELL=y

CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PERIODIC_OUTPUT=n

CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_NET_L2_WIFI_SHELL=y
# printing of scan results puts pressure on queues in new locking
# design in net_mgmt. So, use a higher timeout for a crowded
# environment.
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# ===== overlay-mqtt =====
# MQTT gateway overlay for boards with IPv4 networking (Wi-Fi, Ethernet, etc.)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_NET_MGMT_EVENT=y

CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=n

CONFIG_MESHTASTIC_MQTT=y
CONFIG_MESHTASTIC_MQTT_UPLINK_ENABLED=y
CONFIG_MESHTASTIC_MQTT_DOWNLINK_ENABLED=y
CONFIG_MESHTASTIC_MQTT_ENCRYPTION_ENABLED=y
CONFIG_MESHTASTIC_MQTT_ROOT="msh/EU_868"

CONFIG_MESHTASTIC_MQTT_THREAD_STACK_SIZE=12288
CONFIG_MESHTASTIC_MQTT_THREAD_PRIORITY=10

# Offline publish queue: 8 slots (was default 32). Each slot is ~1.15 KB
# (topic[128]+payload[TX_BUFFER]); 8 keeps the burst backlog small in RAM.
CONFIG_MESHTASTIC_MQTT_PUBLISH_QUEUE_SIZE=8

# LoRa async RX/TX completion is handled through the system workqueue. Keep
# enough stack headroom in Wi-Fi/MQTT builds so SX126x DIO1 work can complete
# reliably while the network stack is active.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# MQTT runs over TCP; each segment can be ~1280 bytes. The Wi-Fi shell overlay
# defaults (10 pkt / 20 buf) are too small and cause TCP retransmit ENOBUFS.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# Public-map publish is off on this image (it needs GNSS, disabled — see overlay-gnss below).
CONFIG_MESHTASTIC_MQTT_MAP_REPORT=n

# ===== overlay-net =====
# Generic NET-variant feature overlay — for build-test / CI and as the public,
# upstreamable base. Consolidates the following (all now inline):
#   the shell, WiFi-shell, and MQTT config.
#
# Enables the full WiFi/Net feature set — telnet shell-over-IP (port 23),
# MQTT-over-TLS (peer verification OFF: encrypted but broker NOT authenticated,
# MITM-able), WiFi boot auto-connect from stored NVS credentials, and the
# TCP:4403 PhoneAPI transport (lights up the AdminMessage config-write engine).
#
# Deliberately carries NO site-specific values: no broker host, no TLS hostname,
# no WiFi SSID/PSK. Those are runtime NVS / private-input build config (injected
# from a secret or set on-device), never baked into a published binary.

# --- IPv4-only. This node talks IPv4 exclusively (MQTT broker, syslog collector,
#     PhoneAPI, SNTP, DHCPv4). Zephyr defaults NET_IPV6=y, which would compile in
#     the IPv6 L3 stack plus its ND/RA/DAD/MLD periodic + multicast traffic — pure
#     overhead here, and extra wakeups working against light sleep. This is the
#     IP-version policy's single home (previously in the WiFi-shell overlay) so
#     it can't regress if the overlay chain changes. ---
CONFIG_NET_IPV6=n

# --- Shell over IP: telnet backend, port 23 ---
CONFIG_SHELL_BACKEND_TELNET=y

# --- Meshtastic MQTT bridge: US region (broker host/port left to Kconfig
#     defaults; supplied at runtime / via private build input, not baked in) ---
CONFIG_MESHTASTIC_MQTT_ROOT="msh/US"

# --- No public-map report (it needs GNSS, disabled below in overlay-gnss) ---
CONFIG_MESHTASTIC_MQTT_MAP_REPORT=n

# --- Static public DNS (generic; some networks don't hand out DHCP option 6) ---
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

# --- MQTT over TLS. Peer verification OFF (see NO_VERIFY below): encrypted but
#     the broker cert is not authenticated. The PSA_WANT_* block is the
#     scaffolding to turn full ECDSA verification back on once the chain-parse
#     issue is resolved (pin the ECDSA intermediate). ---
CONFIG_MESHTASTIC_MQTT_TLS=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MESHTASTIC_MQTT_TLS_NO_VERIFY=y
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_ZVFS_POLL_MAX=8
# Connection handlers. The net variant's steady-state services consume eight of
# these — DHCP, SNTP, netlog, SMP/OTA, the MQTT client, the telnet listener, the
# PhoneAPI listener, and one more ephemeral UDP socket — so a value of 8 left
# ZERO headroom. An inbound TCP connection needs a *new* handler for the accepted
# socket, so accept() failed with:
#
#   <err> net_conn: Not enough connection contexts. Consider increasing CONFIG_NET_MAX_CONN.
#   <err> net_tcp: Cannot allocate a new TCP connection
#
# and the stack RST'd, which presents to the client as "connection refused" from
# a port that `net conn` shows in LISTEN. It appeared to work only while one of
# those services happened to be down, which made it look intermittent.
#
# 16 leaves room for both single-client listeners plus transient sockets.
CONFIG_NET_MAX_CONN=16

# Socket-service dispatch thread (poll()/socket-service offload). Default 1200 measured 88%
# used on V3 (`kernel thread stacks`) — uncomfortably close to overflow. Grow to 2048 for
# headroom. Grow-only, unrelated to the LoRa/radio path.
#
# 2026-08-05: grown again, 2048 -> 3072. Still measured at a deterministic 1460/2048 = 71%
# at idle on all three V4-family bench nodes during the GNSS-overrun investigation — same
# "uncomfortably tight, not actually overflowing yet" shape as the V3 finding above. Bumped
# alongside CONFIG_LOG_PROCESS_THREAD_STACK_SIZE for the same reason (see that comment).
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=3072

# Eventfd headroom for the transports' wake mechanism. MESHTASTIC_TCP/MQTT each
# `select ZVFS_EVENTFD` and each allocate ONE eventfd to wake their blocking poll()
# cross-thread instead of a fixed poll tick — that is what lets the SoC idle between
# real events. The Kconfig default of 1 is NOT enough: the socket-service already
# reserves one (ZVFS_EVENTFD_ADD_SIZE_SOCKETS_SERVICE=1), leaving none for TCP or MQTT,
# so BOTH silently degrade to bounded polling:
#   <wrn> meshtastic: TCP wake eventfd unavailable (-1); using bounded poll
#   <wrn> meshtastic_mqtt: MQTT wake eventfd unavailable (-1); using bounded poll
# That fallback is functionally correct but restores the ~10 Hz / ~5 Hz wakeups, quietly
# defeating the entire socket-wake change. 4 = socket-service + TCP + MQTT + one spare.
# (Found on V4 hardware 2026-07-23; the note previously here wrongly said "no overlay
# entry needed".)
CONFIG_ZVFS_EVENTFD_MAX=4

# --- Automatic WiFi at boot from stored NVS credentials. The PSK never enters
#     the firmware image; provision once on-device with `wifi cred add`. ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_WIFI_CREDENTIALS_SHELL=y
CONFIG_MESHTASTIC_WIFI_AUTOCONNECT=y

# --- App/CLI over IP: Meshtastic PhoneAPI over TCP:4403 (StreamAPI framing). ---
CONFIG_MESHTASTIC_TCP=y
CONFIG_NET_TCP_KEEPALIVE=y

# --- Wall-clock via SNTP (no GNSS/RTC on this board). Seeds meshtastic_clock on
#     every IPv4 lease. Default server pool.ntp.org needs working DNS; override
#     MESHTASTIC_SNTP_SERVER to a numeric IP on DNS-blocked networks. ---
CONFIG_MESHTASTIC_SNTP=y

# --- PKC (X25519 + AES-CCM) for direct messages. Reuses the PSA ECC/AES/SHA
#     already pulled in by the TLS block above; adds CCM. ---
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_MESHTASTIC_PKI=y

# --- AES tables in ROM, not RAM. mbedTLS otherwise GENERATES the ~8 KB AES
#     forward/reverse T-tables (FT0-3/RT0-3) into .dram0.bss at boot; this ships
#     them as `const` in flash instead. Pure win here: flash is ~6% full while
#     internal DRAM runs ~95-96%, and precomputed tables skip the boot-time
#     aes_gen_tables() work. Frees ~8 KB internal DRAM on BOTH V3 and V4. ---
CONFIG_MBEDTLS_AES_ROM_TABLES=y

# --- NodeDB: with the full-lean ~100 B/entry record, a bigger hot store is
#     cheap. 64 keeps net-variant DRAM at the pre-slim ceiling (~92%) while
#     holding ~4x the mesh. ---
CONFIG_MESHTASTIC_NODEDB_MAX_NODES=128
CONFIG_MESHTASTIC_NODEDB_WARM_KEYS=512

# ===== overlay-ota ===== (EXTRACTED 2026-08-23)
# The OTA-over-SMP/UDP block that used to be baked in here unconditionally now
# lives in overlay-ota.conf, appended by the justfile when OTA=1 (the default) —
# the behaviour the OTA knob always documented but never had. Extracted so OTA=0
# actually subtracts it: ~12 KB internal DRAM (~5.4 KB smp_udp .bss + ~6.2 KB smp
# noinit + img_mgmt state), the margin that lets a CONFIG_BT=y image link at all
# (agents-wu94.6). Same treatment nomqtt got on 2026-08-05.

# ===== overlay-netlog =====
# Net-syslog delta — ship the Zephyr LOG stream off-box as RFC5424 syslog over UDP
# to an INTERNAL collector. Opt-in: appended LAST (after the net config, and
# after the OTA config when OTA=1) by the justfile when NETLOG=1.
#
# SAFETY (LAW): the collector MUST be an internal-only endpoint — NEVER the public
# MQTT broker. These logs carry node ids, wifi/DHCP state, positions. RFC5424 carries
# native severity (DEBUG/INFO/WARN/ERROR), so a collector (rsyslog/Vector) can split
# by severity/host without any custom per-topic scheme on the node.

CONFIG_LOG_BACKEND_NET=y
# <collector-ip>:<port> — the RFC5737 TEST-NET placeholder below is not a real host.
# Set your own internal collector here, or override CONFIG_LOG_BACKEND_NET_SERVER in a
# local, gitignored file (e.g. prj-local.conf / *-local.conf); the Kconfig string is
# compile-time, so a change needs a rebuild.
CONFIG_LOG_BACKEND_NET_SERVER="192.0.2.1:514"
CONFIG_LOG_BACKEND_NET_MAX_BUF_SIZE=512
# 2026-08-11: netlog no longer starts itself. The remote syslog has been the
# single most problematic diagnostic path in this project: it caused the
# net_pkt-exhaustion outage (a DEBUG flood starving the TX pool until
# PhoneAPI/telnet/SNTP died while ping survived), it loses ~85% of its own
# output under load (the heap-trace test), it no-ops entirely in panic mode
# exactly when output matters, and it depends on WiFi -- the subsystem currently
# under suspicion for the all-three-nodes stall. Every one of those is a case of
# the observer perturbing or abandoning the thing it observes.
#
# The RTC log ring (CONFIG_MESHTASTIC_LOGRING) now keeps the last 4 KB locally,
# survives a warm reset, keeps writing in panic mode, and captures modules the
# netlog filter throttles away -- so the local record is strictly better than
# what netlog gave us for the failure cases we actually care about.
#
# The backend stays COMPILED so this is reversible at runtime without a reflash
# (`meshtastic netlog on`, see meshtastic_shell.c). Turning autostart off is
# also the documented way to avoid the logging thread blocking when no route to
# the collector exists -- see the Kconfig help.
CONFIG_LOG_BACKEND_NET_AUTOSTART=n

# 2026-07-18 (stability investigation): measured via `kernel thread stacks` over telnet —
# the log-processing thread (drains the log queue, formats + dispatches to every backend
# incl. this one) was sitting at 1152/1152 = 100% used, ZERO bytes unused, on a live node.
# Under bursty mesh traffic (this backend ships a UDP packet for nearly every log line)
# that's one bad burst from a real overflow — and without STACK_SENTINEL that's silent
# DRAM corruption, not a clean fault. Bumped with real headroom, not a token nudge.
#
# 2026-08-05: bumped again, 2048 -> 3072. Even with STACK_SENTINEL now on (catches an
# overflow on the next context-switch check, but isn't a hardware MPU guard — a fast/severe
# overflow can still corrupt memory before the check fires), this thread was STILL the
# tightest-margin one on the whole bench during the GNSS-overrun investigation: a
# deterministic 1524/2048 = 74% at idle, identical across all three nodes, unmoved by
# hours of soak. A burst of overrun WRN lines (the bug fixed alongside this, see
# CONFIG_MODEM_MODULES_LOG_LEVEL_ERR in overlay-gnss.conf) is exactly the kind of load that
# pushes this thread hardest, since every dropped-log-level line is one this thread no
# longer has to format+dispatch. 3072 puts it at ~50%, in line with the other
# comfortable-margin threads (meshtastic 46%, sysworkq 45%) instead of an outlier.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=3072
# Richer RFC5424 structured-data (uptime/seq) so the collector can order/dedupe.
CONFIG_LOG_BACKEND_NET_RFC5424_STRUCTURED_DATA=y

# The backend needs one more UDP net context/socket on top of MQTT-TLS + telnet:23 +
# SMP/UDP:1337 + DHCP + DNS. Bump the ceiling so we don't starve an existing socket.
CONFIG_NET_MAX_CONTEXTS=12
# net_conn tracks BOTH TCP+UDP conn-match entries; base net set 8. The syslog UDP
# socket on top of MQTT-TLS+telnet+SMP+DHCP+DNS exhausted it -> net_conn_register -2
# -> PhoneAPI:4403 accept() refused (SMP+syslog kept working). Bump to clear it.
CONFIG_NET_MAX_CONN=16

# Tame the flood live from the shell: `log backend log_backend_net enable <level>
# <module...>` (level: err/wrn/inf/dbg), e.g. `log backend log_backend_net enable
# wrn sx126x`. `log backend log_backend_net status` shows the current per-module
# filter for that backend. Also the prerequisite for meshtastic_netlog_filter.c's
# boot-time restriction of noisy modules (CONFIG_MESHTASTIC_NETLOG_FILTER) -- that
# now does most of this by default; the shell command is for ad-hoc adjustment on
# top, e.g. temporarily raising one module back up while chasing a specific bug.
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_NETWORKING=y

# 2026-08-01: default the two firehose modules to INF. prj.conf compiles both at
# DBG, and LOG_BACKEND_NET ships a UDP packet for nearly every line — the DBG
# stream (every sx126x IRQ via LORA, plus router/airtime/powermon via MESHTASTIC)
# saturated the net_pkt/net_buf TX pool over UDP and starved SNTP + TCP (ping-OK /
# TCP-dead; confirmed by disabling the backend live -> TCP recovered). INF here
# keeps the default quiet on a netlog-enabled build. Re-enable DBG for deep serial
# tracing by rebuilding with the *_LOG_LEVEL_DBG choice.
CONFIG_MESHTASTIC_LOG_LEVEL_INF=y
CONFIG_LORA_LOG_LEVEL_INF=y

# 2026-07-18 (stability investigation, cont.): three more thread stacks measured close to
# the wall via `kernel thread stacks` — not yet at zero like the logging thread above, but
# high enough that we don't want to keep firefighting them one crash at a time. Doubled
# each (operator call: stop reacting to overflows one at a time, buy real headroom now).
# Not netlog-specific — co-located here since this is where the other measured stack fix
# lives. Costs ~7 KB combined; both boards had room for it.
# meshtastic_tcp: was 4096 (Kconfig default), measured 86% used
# (The mcumgr smp/smp_udp4 stack bumps from the same investigation moved to
# overlay-ota.conf with the rest of the OTA block, 2026-08-23 — with OTA=0 an
# assignment to a dep-unmet MCUMGR symbol is a fatal Kconfig warning.)
#
# 2026-07-18 (stability investigation, round 2): live check on both boards found V4's
# confirmed image (addce256) hadn't actually picked up the round-1 doubling above for
# meshtastic_tcp/smp_udp4 (still running the pre-fix sizes — a stale-build gap, not a
# config bug; V3's confirmed image did have it). Rather than just redeploy round 1,
# doubled again from the round-1 (already-doubled) values, plus meshtastic_mqtt
# (the MQTT config) and meshtastic_telemetry (hardcoded in meshtastic_metrics.c),
# per an operator-specified >=70%-usage rule applied to the live V3+V4 readings.
# Bumped back to the pre-tuning 16384 (2026-08-04): this StreamAPI serve-thread stack is
# heap-allocated at WiFi bring-up (TCP_DYNAMIC_STACK), so the extra 2 KB is paid only when
# WiFi is the active transport, not from static internal SRAM — cheap robustness.
CONFIG_MESHTASTIC_TCP_THREAD_STACK_SIZE=16384

# ===== overlay-mqtt-plain =====
# Plaintext-MQTT delta — drop the mbedTLS SSL/TLS data path to reclaim DRAM, KEEP the
# PSA crypto primitives that Meshtastic PKC needs (X25519 + AES-CCM + SHA-256). Opt-in:
# chained LAST by the justfile when MQTTPLAIN=1, so it overrides this net profile's
# TLS block. MQTT then talks plaintext to broker :1883.
#
# ⚠ A TLS-only public broker (e.g. mqtt.example.org) will have :1883 closed — a plaintext
# node will NOT bridge to it. Point at an internal/plaintext broker, or this is
# DRAM-measurement only.
#
# Point at your plaintext broker by raw IP (the RFC5737 placeholder below is not a real
# host). Anonymous by default — no auth required; username/password stay at their (unused)
# Kconfig defaults. Use a raw IP, not a DNS name: the node's DNS is hardcoded to public
# 8.8.8.8 (this net profile) and can't resolve an internal-only hostname (a name there
# fails live with `MQTT broker resolve failed (-4 EAI_FAIL)`). Override it in a local,
# gitignored file (prj-local.conf / *-local.conf) with your real broker.
CONFIG_MESHTASTIC_MQTT_BROKER_HOST="192.0.2.10"

CONFIG_MESHTASTIC_MQTT_BROKER_PORT=1883
CONFIG_MESHTASTIC_MQTT_TLS=n
CONFIG_MESHTASTIC_MQTT_TLS_NO_VERIFY=n
CONFIG_MQTT_LIB_TLS=n
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_TLS_CREDENTIALS=n

# --- drop the mbedTLS SSL/X509 layer (TLS-only; PKC uses PSA crypto, not SSL) ---
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=n
CONFIG_MBEDTLS_X509_CRT_PARSE_C=n
CONFIG_MBEDTLS_PEM_PARSE_C=n
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=n

# --- TLS-cert crypto that PKC does NOT use (PKC = X25519 + AES-CCM + SHA-256 only) ---
CONFIG_PSA_WANT_ALG_ECDSA=n
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=n
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=n
CONFIG_PSA_WANT_ALG_GCM=n
CONFIG_PSA_WANT_ALG_SHA_384=n
CONFIG_PSA_WANT_ECC_SECP_R1_256=n
CONFIG_PSA_WANT_ECC_SECP_R1_384=n
CONFIG_PSA_WANT_ALG_TLS12_PRF=n

# ===== overlay-psram =====
# PSRAM enable. Opt-in: PSRAM=1 (V4 family ONLY — V3/S3FN8 has no PSRAM).
# ESP_SPIRAM is auto-off in MCUboot (`default n if MCUBOOT`), so the bootloader
# never touches it; the app initialises PSRAM itself.
#
# This overlay is shared by BOTH V4 targets, which carry DIFFERENT PSRAM parts:
#   heltec_wifi_lora32_v4     -> ESP32-S3R2, 2 MB QUAD  @ 40M
#   heltec_wifi_lora32_v4_r8  -> ESP32-S3R8, 8 MB OCTAL @ 80M
# so mode/type/speed MUST NOT be pinned here. They now live in each board's
# Kconfig.defconfig, where the board that owns the part owns its settings.
#
# 2026-08-03 — this line used to be followed by an unconditional
# CONFIG_SPIRAM_MODE_QUAD=y. On the R8 that produced a build configured to drive
# an OCTAL part in QUAD mode, and nothing caught it: ESP_SPIRAM_SIZE is derived
# from the psram0 DT node so it was correctly 8 MB, and SPIRAM_TYPE has a
# `depends on (ESP_SPIRAM_SIZE = ...)` cross-check so it correctly resolved to
# ESPPSRAM64 — but SPIRAM_MODE has no such guard against the devicetree, so the
# wrong mode passed straight through to a clean, linkable, bootable-looking
# image. Board-level defaults are the fix; do not re-pin these here.
CONFIG_ESP_SPIRAM=y

# --- 2026-07-17: WiFi-heap-to-PSRAM routing — TWO BENCH-VERIFIED FAILURES ---
# This overlay only initializes PSRAM; it does NOT route any allocator into it, so
# WiFi (the dominant dynamic consumer on this net build) still draws from internal
# DRAM exactly as before PSRAM existed — confirmed by reading esp_heap_adapter.h and
# by dram0_0_seg barely moving in the build report. That's real and still true. BUT:
# do not "fix" it by adding these Kconfigs without further investigation — both
# combinations tried below broke WiFi entirely on hardware (esp_wifi_init() fails at
# boot with "Not enough memory to initialize Wi-Fi (0x3001)", net_if never ready;
# LoRa mesh + the rest of the app kept running fine — it's WiFi-specific, not a
# general crash). Both times MCUboot's swap-using-move safety net correctly reverted
# the unconfirmed image on next reset (tools/ota.sh dry-run behavior working exactly
# as designed).
#
#   Attempt 1: CONFIG_ESP_WIFI_HEAP_SPIRAM=y (redirects EVERY
#   esp_wifi_malloc_func/os_wpa_malloc_func call to shared_multi_heap_aligned_alloc,
#   per esp_heap_adapter.h) + CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y + STATIC_TX_BUFFER.
#   FAILED. Ruled out an init-order race: esp_psram_smh_init() runs unconditionally in
#   __esp_platform_app_start(), BEFORE z_prep_c() boots the kernel — PSRAM/shared_
#   multi_heap is registered long before any driver init runs, and no "Failed to
#   initialize PSRAM shared multi heap" was logged. Suspected: some of esp_wifi_init()'s
#   internal allocations need DMA-capable/internal RAM the WiFi hardware can't source
#   from the external SMH region (a known ESP-IDF-family constraint).
#
#   Attempt 2: dropped ESP_WIFI_HEAP_SPIRAM, kept CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
#   (a LINK-TIME relocation — see the #ifdef CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM
#   sections in soc/espressif/esp32s3/default.ld, NOT a runtime allocator) + STATIC_TX_
#   BUFFER. IDENTICAL failure. This exonerates ESP_WIFI_HEAP_SPIRAM as the sole cause —
#   the culprit is NET_ALLOC_SPIRAM and/or STATIC_TX_BUFFER (untested in isolation from
#   each other). One plausible read: switching Dynamic->Static TX buffers alone raises
#   esp_wifi_init()'s upfront allocation demand (16 buffers pre-allocated at init vs
#   on-demand), and on this tight-DRAM board that alone may be enough to blow the WiFi
#   heap pool — independent of where NET_ALLOC_SPIRAM's linker relocation points.
#
# Next step for whoever picks this up: bisect the two Kconfigs independently (each
# alone, neither combined with the other) before touching WiFi's SPIRAM knobs again.
# If that doesn't pan out, the safer path is app-level: route nodedb/packet-pool
# allocations to PSRAM explicitly (ESP_SPIRAM_BSS_RELOC_LIBS_AND_OBJS or
# shared_multi_heap_alloc(SMH_REG_ATTR_EXTERNAL, ...) in meshtastic-zephyr code)
# instead of touching the WiFi driver's own memory model at all.

# --- 2026-07-17: app-level relocation (the safer path from the note above) — LANDED ---
# meshtastic_nodedb.c alone is 33.5 KB of internal DRAM (ram_report: nodedb_entries 12800 B
# + warm_keys [nodedb's cached public-key store] 20480 B, both .dram0.bss) — pure application
# data, no DMA/hardware exposure, no WiFi/net-buffer entanglement. This is exactly what
# upstream Meshtastic already does (nodedb -> PSRAM on BOARD_HAS_PSRAM). Does NOT touch
# esp_wifi_init() or any driver allocator, so it doesn't hit the WiFi failure mode above.
#
# Tried CONFIG_ESP_SPIRAM_BSS_RELOC_LIBS_AND_OBJS first (both "meshtastic_nodedb.c.obj" and
# "libmeshtastic.a:meshtastic_nodedb.c.obj") — verified via nm on the built ELF that NEITHER
# actually relocated anything (addresses unchanged, dram0_0_seg unchanged). Root cause: the
# CMakeLists.txt template hard-codes "*${obj}:(.bss .bss.*)" — GNU ld archive-wildcard syntax,
# which only matches an entire .a archive's members (see the real working example in
# samples/net/openthread/border_router/overlay-ot-rcp-host-wifi-esp.conf: whole libopenthread
# archive names). It does NOT support picking one .o out of a shared archive. The whole
# libmeshtastic.a is ~111 KB — nearly all of .dram0.bss, including meshtastic_radio.c
# (SPI/DMA-adjacent, the LoRa radio driver glue) and meshtastic_tcp.c (net-buffer-adjacent,
# the PhoneAPI TCP server) — the same risk categories that broke WiFi twice already. Too broad.
#
# Landed instead: EXT_RAM_BSS_ATTR (modules/hal/espressif/.../esp_attr.h) applied directly to
# the two declarations in src/meshtastic_nodedb.c. It's a per-variable GCC section attribute
# (`.ext_ram.bss`, matched unconditionally by default.ld's `*(.ext_ram.bss*)`) gated on
# CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY (already on by default once ESP_SPIRAM=y) — no
# archive-matching footgun, and it expands to nothing on V3 (no PSRAM), so the same source is
# safe on both boards. Verified via nm: both symbols moved into the ext_ram address range.

# --- 2026-07-20: two more app-level relocations + AES tables to flash ---
# Same EXT_RAM_BSS_ATTR technique extended to two more app-owned, CPU-only structs, moving
# the guarded macro into a shared header src/meshtastic_ext_ram.h (nodedb.c/mqtt.c/
# config_store.c all include it now):
#   - mqtt_ctx (~11.8 KB, src/meshtastic_mqtt.c) — MQTT client context: rx/tx buffers +
#     publish queue. CPU-only; the socket layer memcpys between these and the (internal,
#     DMA) net_buf pool, so nothing DMAs from PSRAM. Its embedded k_mutex is fine — mutexes
#     are thread-context only, never touched from an ISR (the flash-write cache-disable
#     window that makes PSRAM unreadable only bites ISR/flash-adjacent data).
#   - store (~9.2 KB, src/meshtastic_config_store.c) — the config record store. Safe despite
#     being NVS-backed because each record is pb_encoded into a LOCAL internal-RAM buffer
#     before the flash write; the flash write never reads the PSRAM struct directly.
#
# GOTCHA (cost one build cycle): EXT_RAM_BSS_ATTR must sit AFTER the declarator for a variable
# with an ANONYMOUS struct type — `} var ATTR;`. Placed after the struct's closing brace
# (`} ATTR var;`) it binds to the TYPE, is silently ignored (no warning), and the var stays in
# internal DRAM. The nodedb arrays use named types so `static ATTR struct T x[]` was fine.
# Always confirm with `nm zephyr.elf | grep <sym>` → 0x3c0.….
#
# Result (V4 net-ota-ui, display+MQTT): dram0_0_seg 96.62% -> 88.80%. mqtt_ctx+store = ~21 KB
# to PSRAM; the AES ROM-tables switch (CONFIG_MBEDTLS_AES_ROM_TABLES=y, in the net profile) moved
# a further ~8.75 KB of AES T-tables from .dram0.bss to flash — that one helps V3 too
# (95.46% -> 93.16%), since V3 has no PSRAM to relocate into.

# ===== overlay-gnss =====
# GNSS OFF by default on this image — the conservative public default (a board with no
# GPS wired saves ~1.7 KB internal DRAM and never reads a floating UART). Enable it with
# the justfile's GNSS=1 knob, which layers the TRACKED overlay-gnss.conf after this file
# (CONFIG_GNSS=y + the dedicated modem-UART RX workqueue, STABILITY-1). A profile build
# defaults GNSS=1 (the V4 bench boards have GPS wired).
CONFIG_GNSS=n
CONFIG_MESHTASTIC_GNSS=n

# ===== overlay-display =====
# On-device CFB screen UI (prototype). Target: Heltec WiFi LoRa 32 V4, whose
# board devicetree already wires a 128x64 SSD1306 OLED as chosen zephyr,display.
#
#   west build -b heltec_wifi_lora32_v4/esp32s3/procpu samples/meshtastic \
#       -- -DEXTRA_CONF_FILE=overlay-v4-unified.conf
#
# MESHTASTIC_DISPLAY `select`s DISPLAY + CHARACTER_FRAMEBUFFER; the SSD1306
# driver auto-enables from the DT node. The lines below are redundant with those
# selects but spelled out so the display stack is obvious at a glance.
CONFIG_MESHTASTIC_DISPLAY=y

CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# Drop Zephyr's default CFB font set (10x16/15x24/20x32 = ~13.5 KB of flash rodata).
# The port ships its own 6x9 font (cfb_font_0609.c, FONT_ENTRY_DEFINE(font0609)), and
# meshtastic_display.c:pick_smallest_font() always selects the smallest font that fits
# the 128x64 panel -- i.e. the 6x9 -- so the defaults are linked but never selected.
# Disabling them is a pure flash saving with zero on-screen change; font0609 remains.
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n

# Button navigation: MESHTASTIC_DISPLAY_BUTTON `select`s INPUT; the gpio-keys
# driver auto-enables from the board's sw0 node. Spelled out for clarity.
CONFIG_INPUT=y

# The node-list page reads names/SNR/hops from these (both default y already).
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_MESHTASTIC_NODEINFO=y

# --- CFB display heap on a WiFi (net) build — the "scrambled screen" fix -------------
# CFB allocates its framebuffer with k_malloc() from the kernel heap. On a *net* build
# the ESP32 WiFi adapter also draws from that same kernel heap (the ESP_WIFI_HEAP_SYSTEM
# default) and reserves ~50 KB of it; the TLS/net consumers take the rest, so by the
# time the display inits (late — DISPLAY_INIT_PRIORITY 85) the 1 KB framebuffer alloc
# returns NULL, cfb_framebuffer_init() fails, the UI thread never starts, and the panel
# is left showing power-on garbage (the "scramble"). A BLE build is unaffected: the BT
# stack funds a much larger kernel heap, so CFB's alloc succeeds there.
#
# Fix (no feature loss): route the WiFi heap to PSRAM — the V4/R8 have 2 MB sitting at
# ~6% — so WiFi stops competing for the kernel heap AND frees internal DRAM; also give
# the kernel heap a GENEROUS floor. The floor must be generous, not just >1 KB: the
# framebuffer alloc RACES the WiFi/DHCP path for the kernel heap, and WiFi's timing
# varies boot-to-boot — with a tight margin CFB wins some boots and loses others (the
# panel then shows boot garbage). ESP_WIFI still reserves ~25 KB of kernel heap even
# with its adapter heap in PSRAM, so a 48 KB pool leaves ~20 KB always free for CFB,
# which wins the race every boot. `ESP_WIFI_HEAP_SPIRAM` depends on ESP_SPIRAM (present
# on the V4 display board); both are inert on a BLE build (no WiFi) / non-PSRAM board.
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_HEAP_MEM_POOL_SIZE=49152

# ===== overlay-pm — ESP32-S3 light sleep =====
# 2026-08-23: DEFAULTED OFF (CONFIG_PM=n below) while battery-related issues are being
# tracked down separately (see docs/KNOWN-ISSUES.md's "V4 burns ~3 mA continuously on
# ADC_CTRL" and the uncommitted battery-adc-v2 worktree) — the intent is a clean,
# PM-free baseline so UI/BLE/WiFi/LoRa behaviour can't be muddied by a light-sleep
# interaction while that work is in progress. This is the OWNER'S CURRENT CALL, not a
# discovered bug in the governor itself; see main/docs/light-sleep-governor.md and
# docs/AUG-23.md for the mechanism this turns off. Re-enable by flipping the four
# symbols below back (or delete them — the block's own defaults already point the
# right way) once battery work is done. This mirrors samples/meshtastic/
# overlay-pm-off.conf's own proven symbol set exactly (that overlay now only exists as
# an explicit, documented alternative for someone who wants the OFF profile spelled
# out separately; it is not layered here — this file's own defaults now match it).
#
# These PM settings were the standalone overlay-pm.conf until the samples were
# flattened into per-profile files (14ff7f1); they now live inline in this profile.
# The board DT (heltec_wifi_lora32_v4-common.dtsi) declares the HARDWARE capability:
# rtc_timer enabled + wakeup-source, and wakeup-source on gpio0 / lora0 — inert until
# CONFIG_PM (below) turns the PM subsystem on.
#
# What this buys, and what it does not
# ------------------------------------
# CONFIG_PM makes the idle thread enter PM_STATE_STANDBY (-> esp_light_sleep_start)
# when the next timeout is far enough out. On the S3 that powers down the CPU domain
# (ESP32_PM_POWER_DOWN_CPU_IN_LIGHT_SLEEP, default y — the vendor quotes ~650 uA saved)
# while RAM, peripherals and the radio stay powered. Deep sleep is NOT reached this way;
# it stays reserved for sys_poweroff() (admin shutdown).
#
# The idle window is capped by the shortest pending timeout. The net variant used to
# wake ~10 Hz (TCP poll), ~5 Hz (MQTT) and ~1 Hz (radio re-arm + airtime); all four are
# now event-driven (eventfd-woken transport polls, the RX armed-idle backstop, and lazy
# airtime expiry). NOTE the eventfd path needs fd headroom — see CONFIG_ZVFS_EVENTFD_MAX
# in this net profile; with the default of 1 both transports silently fall back to
# bounded polling and none of that wakeup work takes effect (found on hardware
# 2026-07-23). Verify PM is WIRED (`cpu states` lists standby, `cpu available` shows
# avail=Y) before trusting any current measurement. See LOW-POWER.md /
# ZEPHYR-POWER-PRIMER.md in ~/lab/meshprojects.

# See the 2026-08-23 note above the ===== overlay-pm ===== header: OFF is the current
# default. The rest of this block's settings/comments describe the ON behaviour for
# when this is flipped back.
CONFIG_PM=n

# The rtc_timer node (enabled in the board DT) is a counter device; its driver only
# builds with CONFIG_COUNTER. Without it, pm_state_set() logs "Sleep skipped. Make
# sure RTC counter driver is enabled." and never sleeps.
CONFIG_COUNTER=y

# Enables the per-device PM interface. Kept because it makes the vext_ctrl GPIO
# power-domain a real device rather than an init-time-on-forever stub (a prerequisite
# for ever gating the OLED — not done automatically).
#
# 2026-08-10: adc_ctrl used to be a second power-domain-gpio node here and is gone --
# "init-time-on-forever" turned out to be exactly what it did, and it cost ~3 mA on a
# rev-4.2 V4 for a divider no code on this branch reads. The battery gate is now the
# vbatt node's own `power-gpios` property, which nothing drives until something samples
# the divider. See the comment in heltec_wifi_lora32_v4-common.dtsi.
CONFIG_PM_DEVICE=y

# Do NOT let the PM subsystem blanket-suspend devices on every light-sleep entry.
#
# CORRECTION (verified on V4 hardware 2026-07-23): an earlier comment here claimed
# "PM_DEVICE_SYSTEM_MANAGED only auto-suspends devices for a state that carries
# `zephyr,pm-device-disabled`". That is BACKWARDS. Per the binding, the property means
# "when set, the PM subsystem will NOT suspend devices before entering this state", and
# pm.c does:
#     if ((state != PM_STATE_RUNTIME_IDLE) && !pm_device_disabled) { pm_suspend_devices(); }
# The S3's light_sleep state does NOT carry the property, so SYSTEM_MANAGED suspends
# EVERY device on EVERY sleep entry — including the power-domain-gpio ones, whose
# pm_action cannot run in that context:
#     <err> power_domain_gpio: Blocking actions cannot run in this context
# and because pm_suspend_devices() then FAILS, pm.c aborts the sleep outright, so the
# SoC never light-sleeps and residency stays zero.
#
# ESP32-S3 light sleep keeps RAM, peripherals and the radio powered, so there is
# nothing to suspend — turning the blanket suspend off is correct, not a workaround.
# (Equivalent alternative: add `zephyr,pm-device-disabled` to the light_sleep state via
# a DT overlay. This Kconfig is the smaller, more obvious lever.)
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n

# Pin the power-domain PM integration OFF. BOARD-INDEPENDENT — verified on V4 hardware
# 2026-07-23. CONFIG_PM_DEVICE defaults PM_DEVICE_POWER_DOMAIN=y, which promotes the
# vext_ctrl power-domain-gpio node to a system-managed PM device. The PM path
# then tries to suspend it from a non-blocking context and the driver floods
#   <err> power_domain_gpio: Blocking actions cannot run in this context
# on every sleep attempt (and the V4 wedged hard enough to need a physical BOOT+RST).
# BOTH boards carry a power-domain-gpio node (vext_ctrl; the V4 also had adc_ctrl until
# 2026-08-10, see CONFIG_PM_DEVICE above) — so this is
# NOT V3-specific; it previously lived only in the V3-only PM overlay and V4 hit the
# identical fault. POWER_DOMAIN_GPIO still builds (it depends on
# `PM_DEVICE || !PM_DEVICE_POWER_DOMAIN`), the domains stay forced-on exactly as in the
# known-good non-PM baseline, and CPU light sleep is unaffected.
CONFIG_PM_DEVICE_POWER_DOMAIN=n

# MESHTASTIC_POWER_SAVE_DEFAULT `depends on PM` (src/Kconfig.power) — with CONFIG_PM=n
# above it must be n too, or Kconfig's warnings-as-errors build stage refuses the
# config outright ("assigned y but got n, unsatisfied dependency: PM"). Its own
# Kconfig default is already n, so this is just spelling that out rather than relying
# on it. When CONFIG_PM is flipped back on, restore this to y so a PM build actually
# enters light sleep out of the box (otherwise PowerConfig.is_power_saving defaults
# false and the power policy holds a pm_policy lock blocking STANDBY — see
# meshtastic_power.c). The phone's stored is_power_saving still overrides this on the
# next boot either way.
CONFIG_MESHTASTIC_POWER_SAVE_DEFAULT=n

# --- Observability: prove it actually sleeps (reachable over telnet via tools/tsh.py) ---
# The shell itself comes from the base shell config (already in the net build). These add
# the PM-specific commands and residency stats, WHEN CONFIG_PM=y:
#   cpu states     — list DT power states + residency/latency
#   cpu available  — per state: avail=Y/N lock=Y/N  (why it will/won't sleep)
#   cpu idle 5000  — sleep 5 s so PM runs
#   stats list     — pm_cpu_000_state_* : state_total_cycles is the residency proof
CONFIG_STATS=y
# PM_STATS is inside PM's `if PM` Kconfig block (subsys/pm/Kconfig), so it inherits an
# implicit `depends on PM` even though STATS is its only explicit one — must be n
# alongside CONFIG_PM=n above or the Kconfig warnings-as-errors stage refuses the build.
CONFIG_PM_STATS=n
# STATS alone only collects; the `stats` shell command lives behind STATS_SHELL. Without
# it `stats list` is "command not found" and the residency proof above is unreachable
# (found on hardware 2026-07-23). STATS_SHELL itself has nothing to do with PM — used by
# the watchdog channel-feed counters and the CAD/AGC radio counters too — left on.
CONFIG_STATS_SHELL=y
# PM_CPU_SHELL is a real upstream gap: it does NOT depend on CONFIG_PM in
# zephyr/subsys/pm/Kconfig (only `depends on SHELL`), so Kconfig's own dependency
# checker would happily leave it y — but zephyr/subsys/pm/pm_cpu_shell.c references
# CONFIG_PM_LOG_LEVEL/pm_state_to_str/pm_policy_state_is_available/pm_state_from_str,
# which are only declared under CONFIG_PM=y elsewhere in the subsystem, so it fails to
# *compile* (not just a Kconfig warning) if left on here. Found 2026-08-09 building the
# first-ever PM=0 image (see samples/meshtastic/overlay-pm-off.conf).
CONFIG_PM_CPU_SHELL=n
# PM_DEVICE_SHELL depends on PM_DEVICE (unconditional, unrelated to CONFIG_PM — see the
# comment above CONFIG_PM_DEVICE below), so this is unaffected either way and stays on.
CONFIG_PM_DEVICE_SHELL=y
CONFIG_DEVICE_SHELL=y

# PowerMon: the port's own PM activity monitor. Adds the `powermon` shell command
# (state bitmask + light-sleep entry count) and the sleep-entry counter the on-device
# UI's PM page reads — a rising count is proof the SoC light-sleeps, visible on the OLED
# even when the USB console is dead (it dies in light sleep). Cheap: one atomic word + a
# PM notifier; the setters are no-ops when this is off.
CONFIG_MESHTASTIC_POWERMON=y

# ===== interactive serial shell: KEPT ON (footprint trim reverted 2026-08-04) =====
# An earlier trim dropped SHELL_BACKEND_SERIAL to reclaim ~7 KB internal SRAM. The R8
# bring-up showed why that was the wrong tradeoff: a fresh node comes up in BLE mode with
# no network, so telnet is unreachable, and without the serial shell there is NO way to
# type `meshtastic transport wifi` to bootstrap it onto the LAN — you're forced through
# the phone app. On a bench image, console access is worth the ~7 KB. Serial shell + all
# its sub-shells (kernel/stats/pm/device/devmem) are back on (defaults); the shell owns
# the UART log backend as before, so LOG_BACKEND_UART is no longer set here.
CONFIG_SHELL_BACKEND_SERIAL=y
# The GNSS modem UART backend (MODEM_BACKEND_UART) depends on UART_INTERRUPT_DRIVEN. The
# serial shell selects it too, but state it explicitly so the GNSS dependency can never
# vanish incidentally if the shell config changes again.
CONFIG_UART_INTERRUPT_DRIVEN=y

# NOTE for V3 (do NOT add here): V3 has no PSRAM, so it can also power down the flash
# rail in light sleep — CONFIG_ESP32_SLEEP_POWER_DOWN_FLASH=y. That symbol
# `depends on !ESP_SPIRAM`, so it is unavailable on V4/R8 and must NOT be set for this
# board. It belongs in a V3-specific overlay only.

# 2026-08-05: the "===== overlay-nomqtt =====" block that used to live here (unconditionally
# disabling MQTT) moved to its own file, overlay-nomqtt.conf, layered conditionally by the
# justfile's MQTT=0 knob. It was baked into this file unconditionally — a real bug: the
# justfile's own comments described MQTT=/MQTTPLAIN= as toggling separate overlay-nomqtt.conf
# / overlay-mqtt-plain.conf files, but only overlay-nomqtt.conf existed as documentation-in-a-
# comment, not an actual file wired into the build; MQTT=1 silently did nothing for this
# profile (found 2026-08-05 during Phase-5 MQTT interop testing — see
# docs/parity/INTEROP-TEST-MATRIX.md, MQTT-1). MQTT=0 stays the PROFILE default (see the
# justfile's `mqtt :=` variable), so default behaviour is unchanged; MQTT=1 now actually works.

# ============================================================================
# ===== unified add-on: BLE stack ===========================================
# Feasibility experiment (2026-07-26): both BT and WiFi/net compiled into one
# image so the phone transport can be chosen at runtime. Tests the two gates:
#   (a) mbedTLS/PSA ECC-curve config coexistence (BT_SMP P-256 + net PSA crypto)
#   (b) combined internal-DRAM budget (WiFi buffers can't relocate to PSRAM)
# ============================================================================
CONFIG_MESHTASTIC_THREAD_STACK_SIZE=8192
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="Zephyr Meshtastic"
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# --- BLE connection stability (measured on the R8 over BLE OTA, 2026-08-26) ---
# Do NOT let the peripheral request a connection-parameter update. Zephyr asks
# the central ~5 s after connect; on this controller that update destabilises a
# busy link and the central drops it (SMPTransportDisconnected ~10 s into an
# SMP upload). It only bit once the mcumgr-params speedup pushed bigger frames
# — a slow (small-frame) upload survived by luck. Same fix the XIAO board conf
# carries (BT_GAP_AUTO_UPDATE_CONN_PARAMS=n); prefer central-initiated updates.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# Advertise upstream's 6 s supervision timeout (NimbleBluetooth.cpp "6 s = 600")
# instead of Zephyr's 420 ms, for a central that honours PPCP.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_MESHTASTIC_BLE=y
CONFIG_MESHTASTIC_BLE_PAIRING=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SECURITY_ERR_TO_STR=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_RX_STACK_SIZE=6144
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=2048
CONFIG_BT_LONG_WQ_STACK_SIZE=2048

# ============================================================================
# ===== unified DRAM slimming: fit BLE + WiFi/net in internal DRAM ===========
# The combined BT-host + WiFi/net static footprint overran dram0_0_seg by
# 10,704 B (measured 2026-07-26). The net side inherited MQTT-over-TLS buffer
# sizing it does not need here: MQTT is off, OTA is mcumgr/UDP, and the phone
# link is telnet or BLE — there is NO TLS data path in this image. Dropping the
# TLS socket layer and right-sizing net buffers reclaims the overrun. These are
# the proven overlay-uitest.conf values (WiFi + telnet + OTA + CFB display all
# verified working). conn/context are kept at the netlog-required 16/12 above — an
# earlier "small conn/context trim for headroom" to 12/10 here silently undid that
# bump and reintroduced net_conn/net_pkt exhaustion under the syslog-UDP load
# (2026-08-01: PhoneAPI accept-refused + SNTP/TCP starvation).
# mbedTLS/PSA core stays ON (Meshtastic PKI/DM crypto + BT_SMP both use it).
CONFIG_MQTT_LIB=n
CONFIG_MQTT_LIB_TLS=n
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_TLS_CREDENTIALS=n
CONFIG_NET_PKT_RX_COUNT=8
# TX pools sized for the concurrent syslog-UDP + SNTP + TCP(PhoneAPI) + DHCP burst.
# The old 10/12 was exhausted by the net-log flood -> SNTP "Failed to allocate
# net_pkt" and TCP handshake starvation (ping-OK / TCP-dead), 2026-08-01.
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=12
# Headroom trims (diagnostics only — no functional or stability cost).
# CONFIG_MESHTASTIC_TCP_THREAD_STACK_SIZE: the StreamAPI serve thread's protobuf
# decode+dispatch peak was measured at ~5.7 KB on live V3+V4 boards (the rounds
# behind commits 0dd0004, a5b7a26: 86% used at 4096 and >=70% at 8192 — both too
# tight — so it was raised to 16384). Trimmed to 14336 (2026-08-01): still ~2.5x
# the measured peak. Do NOT cut below ~12 KB without a fresh phone-connected
# high-water read — idle usage is only ~900 B and badly understates the StreamAPI
# path. The clean way to reclaim it entirely in BLE mode is the dynamic (heap)
# stack below (only paid when WiFi is the active transport), not a further static cut.
# CONFIG_NET_SHELL / CONFIG_NET_STATISTICS were trimmed here as "diagnostics
# only -- no functional or stability cost". **Both re-enabled 2026-08-11** at the
# bottom of this file; see that block. The claim was wrong in the way such claims
# usually are: there was no cost right up until all three nodes died at once and
# we had no net counters, no `net stats`, and a WiFi driver pinned at ERR, so
# nothing could say whether packets had been dropping beforehand. Diagnostics are
# not free, but "no cost" prices only the flash and not the outage you cannot
# explain. Left as a comment rather than deleted so the trade is legible.
# TCP serve-thread stack: heap-allocated at WiFi bring-up (CONFIG_MESHTASTIC_TCP_DYNAMIC_STACK)
# instead of statically reserved, so the large overflow-hardened ~16 KB stack leaves the static
# image and is paid only in WiFi mode. Safe: in WiFi mode the ESP32 BT controller is NOT
# initialised, so nothing large competes with the k_malloc'd stack on the system heap. The symbol
# selects DYNAMIC_THREAD + DYNAMIC_THREAD_ALLOC; POOL_SIZE=0 / PREFER_ALLOC force a heap-backed
# stack, not a static pool. Internal RAM only. OFF for single-transport v4-net / v3-net.
#
# The BLE work stack is deliberately STATIC (there is no dynamic-BLE option): the ESP32 BT
# controller draws from the same system heap (CONFIG_ESP_BT_HEAP_SYSTEM), so a k_malloc'd BLE
# stack starved it into an OOM abort and bricked BLE-mode boot (see meshtastic_ble.c /
# docs/KNOWN-ISSUES.md). The +6 KB static cost fits (unified ~90.7 % internal DRAM).
CONFIG_MESHTASTIC_TCP_DYNAMIC_STACK=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=0
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y

# --- WiFi / network diagnostics -------------------------------------------
# Added 2026-08-11 after all three nodes hardware-watchdog reset inside a 20 s
# window with nothing in any log to explain it, and none leaving a stage-0
# breadcrumb (so the IRAM watchdog ISR never ran -- interrupts masked for the
# whole ~40 s). All three are on the SAME BSSID, so the AP is the one shared
# dependency that can hit every node at once. See docs/KNOWN-ISSUES.md.
#
# The driver ALREADY computes what we want -- esp_wifi_handle_sta_disconnect_event()
# maps esp-idf's reason onto WIFI_REASON_DISCONN_* and then
# drivers/wifi/esp32/src/esp_wifi_drv.c:392 does LOG_DBG("Disconnect reason: %d").
# At the previous ERR level that line could never be emitted, which is why every
# disconnect this bench has ever had was invisible. INF rather than DBG: DBG on
# this driver also pulls in per-packet chatter, and the reason line is the part
# that matters. Raise to DBG live if needed:
#   log level dbg wifi_esp32     (or via log_backend_net, see LOG_RUNTIME_FILTERING above)
CONFIG_WIFI_LOG_LEVEL_INF=y

# Counters for drops/errors/retries -- there were previously NONE compiled in,
# so "did we lose packets before the stall" was unanswerable. WIFI adds the
# L2-level counters Zephyr's wifi_mgmt.c already knows how to collect.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_STATISTICS_UDP=y

# `net stats` / `net iface` / `net conn` on the node's shell, for interactive
# triage of a node that is still up but misbehaving -- e.g. the recurring
# "unreachable to ping+telnet for exactly one 65 s poll in five, while the
# netlog keeps flowing" pattern in monitor-soak.log, which is the best
# reproducible WiFi symptom we have.
CONFIG_NET_SHELL=y

# Render the ring's (and every backend's) timestamps as a calendar date rather
# than raw epoch-milliseconds. LOG_OUTPUT_FORMAT_DATE_TIMESTAMP (prj.conf)
# already does this for the netlog path; the log ring formats via its own
# log_output instance and needs this flag to match, otherwise recovered lines
# read as e.g. [00000001786469801024] and cannot be eyeballed against anything.
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y
