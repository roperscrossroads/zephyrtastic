# Instruction/thread/ISR-level tracing (CTF format, RAM ring-buffer backend). Opt-in
# via EXTRAS=overlay-tracing.conf just build -- not part of a normal deployment.
#
# Unlike netlog (always-on, drains continuously to a remote syslog collector), this
# has no network-capable backend in-tree: the RAM buffer is meant to be pulled out with
# a debugger attached ("gdb dump binary memory" -- see zephyr/subsys/tracing/Kconfig's
# own backend help text) and decoded with zephyr/scripts/tracing/parse_ctf.py. That
# makes it an ACTIVE, attended tool -- reproduce the issue with JTAG/west debug
# attached, halt, dump, decode -- not something to leave running on an unattended
# soak node. Use it for exactly the class of bug netlog timestamps can only approximate:
# the CAD-poll-vs-irq_work_handler interleaving that took manual log correlation to
# pin down 2026-08-07 would show up directly as an ordered event trace here.
#
# CTF over SEGGER SystemView: SystemView needs USE_SEGGER_RTT (a real J-Link, or
# possibly RTT-over-openocd once/if that's confirmed working here) and this bench
# doesn't have one; CTF + RAM needs only the JTAG connection this project is already
# wiring up for `west debug`.
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_BACKEND_RAM=y
# Default is 4096B; DRAM headroom here is tight (~77% used on the R8 build without
# this), so this is a deliberately modest bump, not a "make it big" default -- shrink
# it further (or drop this overlay) if a build with it on doesn't fit.
CONFIG_RAM_TRACING_BUFFER_SIZE=8192
