# MCUboot-image Kconfig for the XIAO nRF52840. Attached by sysbuild.cmake on
# top of sysbuild/mcuboot.conf (which is board-neutral). The bootloader is a
# separate Zephyr application built against the same board files, so every
# board-level trap the application had to learn applies to it too.

# LFCLK from the internal RC oscillator. The board default is the external
# 32 kHz crystal, which never starts on the kit boards — the application conf
# learned this on 2026-08-23 (a build that waits for it hangs pre-main, dark).
# MCUboot's system timer needs the LFCLK just the same, so without these two
# lines the bootloader would hang exactly where the app used to.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# slot1 is on the QSPI p25q16h: the bootloader needs the driver to read the
# staged image and to write into slot1 during a swap. 4 KB pages for the same
# reason as in app.conf (swap-move requires identical sector layouts).
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Feed a watchdog the application left running. The app's boot guard
# (MESHTASTIC_DFU_BOOT_GUARD) arms the nRF WDT with a 15 s timeout, and on the
# nRF52 a started WDT keeps running through a soft reset — straight into a
# swap that takes tens of seconds (181 sectors erased and rewritten twice).
# Without this the WDT resets mid-swap, the swap resumes, the WDT resets
# again… it would complete eventually but the boot guard would count three
# "failed boots" first and park the board in Adafruit DFU. The nRF feed
# reloads every WDT channel and is a no-op when no WDT is running.
CONFIG_BOOT_WATCHDOG_FEED=y

# No console: the board's console is the USB CDC, and enumerating a second,
# short-lived USB device on every boot buys nothing but host-side churn (the
# by-id path is the app's, and a flash tool waiting for it would see it come
# and go). MCUboot's outcome is read afterwards from the app (`mcuboot info`,
# `meshtastic resets`) rather than watched live.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
