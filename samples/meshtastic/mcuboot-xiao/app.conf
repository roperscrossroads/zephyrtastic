# Application-side Kconfig for the XIAO nRF52840 MCUboot build. Attached by
# sysbuild.cmake whenever this board is built with --sysbuild; a plain build
# never sees it. Only what the LAYOUT requires lives here — the update
# transport is a separate, opt-in overlay (overlay-ota-shell.conf today,
# BLE next), so the layout and the transport can be reasoned about apart.

# Link into slot0 behind a 0x200 MCUboot header, and let sysbuild sign the
# result. The board conf (boards/xiao_ble_nrf52840.conf) says =n for the
# legacy single-image layout the UF2 bootloader boots directly; this fragment
# is applied after it, and sysbuild forces the same value on the command line.
CONFIG_BOOTLOADER_MCUBOOT=y

# slot1 lives on the QSPI p25q16h. The driver must report the chip's real 4 KB
# erase sectors: swap-using-move refuses slots whose sector layouts differ,
# and internal flash pages are 4 KB. The driver default (64 KB) would make
# every upgrade fail with "Cannot upgrade: not same sector layout".
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# NOT here: the bootutil client library and the `mcuboot` shell command
# (`mcuboot info` / `confirm` / `request_upgrade`). They depend on the image
# manager, which only the OTA subsystem pulls in — so they live in
# overlay-ota-shell.conf beside the transport they instrument. A sysbuild
# build with no OTA overlay is a bootloader with no way to fill slot1; it
# builds, but it is not a configuration anyone wants to flash.
