# ===== overlay-nomqtt =====
# Disable the Meshtastic MQTT bridge entirely — no broker client, no MQTT thread, no
# MQTT-over-TLS. Layered LAST (justfile MQTT=0, the PROFILE default) so it overrides
# overlay-mqtt / overlay-mqtt-plain / the gitignored overlay-net-local's MQTT settings.
# Unlike overlay-uitest, this drops ONLY the MQTT bridge (keeps GNSS + full net buffers +
# PhoneAPI) — for a node that shouldn't bridge to a broker. PSA crypto stays on for PKC
# (MESHTASTIC_PKI), so DMs still work.
#
# 2026-08-05: extracted from overlay-v4-unified.conf, where this had been baked in
# unconditionally — MQTT=1 silently did nothing for a PROFILE=v4-unified build because
# this file didn't exist yet and nothing layered it conditionally. See the justfile's
# `_nomqtt` variable and docs/parity/INTEROP-TEST-MATRIX.md (MQTT-1) for the finding.
CONFIG_MESHTASTIC_MQTT=n
CONFIG_MQTT_LIB=n
CONFIG_MESHTASTIC_MQTT_TLS=n
CONFIG_MQTT_LIB_TLS=n
CONFIG_MESHTASTIC_MQTT_MAP_REPORT=n
