# ===== overlay-ota-ble-secure =====
# --- F7 P1: the SMP-over-BLE service demands an ENCRYPTED link ---
# Stack AFTER overlay-ota-ble.conf. That overlay leaves the service OPEN (a
# decision it states); this one steps it up to RW_ENCRYPT: every SMP write
# needs security level 2, i.e. a Just Works pairing, bonded. What that costs:
#  - the courier pairs before it talks (MESHTASTIC_SMP_CENTRAL_PAIR, default y
#    under RW_ENCRYPT): bt_conn_set_security(L2) on the adopted link, then the
#    usual MTU/discover/subscribe;
#  - bonds must SURVIVE a reboot on both sides, or the host's BlueZ refuses the
#    next connect on a key mismatch: BT_SETTINGS on;
#  - room for every bond: a kit bonds with its courier, the host and a phone; a
#    courier with two kits and the host. BT_MAX_PAIRED was 1;
#  - a Linux `smpmgr --ble` host needs a BlueZ pairing agent (bluetoothctl
#    `agent on` + `pair <addr>` once) before its first write.
# The peer beats ride the same encrypted link, harmlessly. This is the pipe;
# the payload is still MCUboot's signature check — meaningless until
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE names a real key (F7 P0).
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=n
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4
# A host that lost its bond (BlueZ `remove`, a reinstalled OS) must be able to
# pair again: Zephyr's default refuses an unauthenticated re-pair over an
# existing bond and DROPS THE LINK (bench 2026-08-28: a kit kept its bond for
# a BLE host after that host forgot it -> every connect died in pairing). Just Works
# authenticates nothing either way, so allowing the overwrite costs no
# security this fleet ever had; without it the only way back is a reflash.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

