# ===== overlay-ota-shell =====
# --- Firmware update over SMP (mcumgr) on the shell's serial console ---
# The same MESHTASTIC_OTA subsystem overlay-ota.conf runs over UDP, carried
# instead on the console the board already has: SMP frames ride the shell's
# serial backend (base64, 0x06 0x09-framed lines), demultiplexed from the
# interactive shell by the transport itself. No second port, no IP stack —
# which is what makes it the first update path for the XIAO (USB CDC console,
# LoRa + BLE, no WiFi). Requires the MCUboot A/B build (SYSBUILD=1 / --sysbuild).
#
# 2026-08-26: written for Phase A.1 (docs/xiao-mcuboot.md). It is the rung
# that proves the slot layout and MCUboot's test/confirm/revert on the bench
# before a BLE transport exists; it stays useful afterwards as the cable path.
#
# Client side: `smpmgr --port <cdc> upload <zephyr.signed.bin>` (or the Go
# `mcumgr` CLI with --conntype serial). The console is also the LOG sink; the
# client filters by the frame prefix, but `log halt` first keeps a log burst
# from landing inside a frame on a chatty node.
CONFIG_MESHTASTIC_OTA=y

# Transport: SMP over the shell backend.
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_BASE64=y
# Return the shell to normal use if a client dies mid-frame instead of holding
# it hostage waiting for the rest of a packet the header promised.
CONFIG_MCUMGR_TRANSPORT_SHELL_INPUT_TIMEOUT=y

# MCUboot image manager backend for img_mgmt (slot1 write / test / confirm),
# and the `mcuboot` shell command built on the same bootutil client library:
# `mcuboot info` is the instrument for the A/B ladder — which image is in
# which slot, whether it is confirmed, what swap is pending — and `mcuboot
# confirm` / `request_upgrade` drive it without an SMP client attached.
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUBOOT_SHELL=y
# Erase slot1 as the upload streams in rather than all up front — 180 QSPI
# sectors take seconds, and up front that is one silent SMP timeout.
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Frame sizes. Every upload chunk is a round trip on a 115200-ish CDC link, so
# bigger frames are the whole throughput lever: MTU 1024 puts a ~520 KB image
# at ~550 round trips. NETBUF_SIZE must be >= MTU + 2 (Kconfig.shell).
CONFIG_MCUMGR_TRANSPORT_SHELL_MTU=1024
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1152
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
# The shell's RX ring is the ISR-to-thread buffer the frames arrive through.
# Its default is 256 with the SMP transport; this board has already shown what
# a full RX ring does (commands vanish, no error), and a 64-byte USB packet
# burst is not the same as a human typing.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
# A frame arrives as up to N base64 LINES of 127 bytes, each parked in one of
# these buffers until the SMP work queue reassembles them. The client's
# "line buffers" setting MUST equal this count (smpmgr --line-buffers 10):
# with the default of 2 a client sending 8-line frames had its first chunk
# accepted and every later one dropped, which presents as an upload that
# stalls at 0% and times out (measured 2026-08-26). 10 x 127 B lines carry a
# ~950-byte decoded frame, inside the 1024 MTU. Costs 10 x 127 B of RAM.
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=10
# Answer `os mcumgr_params` (buffer size and count) so a client can size its
# frames from the device's own numbers instead of a guess on its command line.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# img_mgmt writes flash on the SMP work queue; same bump overlay-ota.conf
# carries (measured 57-69% of 2048 there, before the QSPI driver was in the
# path).
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
