# The LoRa transceiver driver at DEBUG: every configuration pushed, every interrupt (TX done,
# RX done, timeouts, CAD) and every received frame's RSSI/SNR, on the console. A bring-up
# feature (`features: [lora-debug]` in a layout; the bench's recipe appends this overlay last,
# after overlay-v4-unified.conf has set the driver to INF), not for a standing node: on a
# busy preset it is hundreds of lines a minute into the console, which is also the shell.
CONFIG_LORA_LOG_LEVEL_DBG=y
CONFIG_MESHTASTIC_LORA_DEBUG_BUILD=y
