CONFIG_HWINFO=y

# Primary console (native-USB usb_serial via the board's `zephyr,console`
# chosen node). Unrelated to the secondary uart0 shell -- see
# CONFIG_MESHTASTIC_SHELL_UART0 (src/Kconfig) and boards/*.overlay for that
# (currently heltec_wifi_lora32_v4 only). Motivation for the secondary shell:
# the native USB-CDC console has proven unreliable for capturing early boot
# output under WSL2's USB passthrough.
CONFIG_UART_CONSOLE=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
CONFIG_LORA_LOG_LEVEL_DBG=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Render log timestamps as a real calendar date/time (needs
# CONFIG_POSIX_C_LANG_SUPPORT_R, already on) instead of log_output's default
# "elapsed hh:mm:ss" renderer -- which, fed the epoch-based value
# MESHTASTIC_LOG_WALLCLOCK (src/Kconfig) switches to once the clock is
# seeded, prints something like "[496194:12:08.048,000]" (hours-since-1970,
# not a date). This is a plain `=y`, not a `select` in src/Kconfig, because
# LOG_OUTPUT_FORMAT_DATE_TIMESTAMP is a choice-group member and Kconfig
# ignores select/imply on those. Found 2026-08-09, see
# docs/uart0-console-investigation.md.
CONFIG_LOG_OUTPUT_FORMAT_DATE_TIMESTAMP=y
# Deferred-log ring buffer (DRAM). Was the Zephyr default (1024); bumped back
# toward 2048 2026-08-09 -- shell/UART0 bench sessions were regularly seeing
# "--- N messages dropped ---" (up to 48 in one burst) during the periodic
# thread_analyzer dump (~18 near-simultaneous INF lines every 5 min, see
# CONFIG_MESHTASTIC_THREAD_SUMMARY_INTERVAL below) landing on top of ordinary
# traffic. DRAM headroom checked first (~70 KB free on the v4-unified app
# image) -- comfortable for another 1 KB.
CONFIG_LOG_BUFFER_SIZE=2048
# The deferred log-processing thread formats each message on its own stack; the
# Zephyr default (~1 KB) is too tight for meshtastic's larger messages and
# overflowed the log thread at network-up on the V3. Give it modest headroom.
# (v4-unified overrides this again, see overlay-v4-unified.conf — keep both in sync.)
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=3072

CONFIG_MAIN_STACK_SIZE=8192

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_SETTINGS=y
CONFIG_MESHTASTIC_LOG_LEVEL_DBG=y
# Packet hex dumps stay OFF (MESHTASTIC_PACKET_HEXDUMP): dumping a full ~256-byte
# packet per TX/RX is the deepest formatter on the log path and can overflow the
# log-thread stack. Enable it (and raise CONFIG_LOG_PROCESS_THREAD_STACK_SIZE)
# only for wire-level debugging.

# for persistent settings
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# MCUboot A/B: build the app as a signed slot0 image (zephyr.signed.bin) under
# sysbuild. Inert unless the build is invoked with --sysbuild (SYSBUILD=1 in the
# justfile); harmless for every variant, so it lives here rather than an overlay.
CONFIG_BOOTLOADER_MCUBOOT=y
 # for delayed settings save in system work queue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Regulatory: the region this device transmits in. 1 = US (902-928 MHz).
# Determines the LoRa frequency and the TX power ceiling. Override in a
# gitignored *-local.conf for a device operating elsewhere — transmitting
# outside your allocation is illegal in most jurisdictions and the firmware
# cannot detect that for you. See MESHTASTIC_DEFAULT_REGION in src/Kconfig.core
# for the full code list.
CONFIG_MESHTASTIC_DEFAULT_REGION=1

# --- Debugging: __ASSERT() + coredump-on-fault + reboot instead of hang. ---
# __ASSERT() compiles to nothing unless ASSERT=y (it was off, silently, before
# this). Turning invariant violations (e.g. the sx126x DIO1/CAD race class of
# bug -- see sx126x_irq_work_handler()) into a fatal error beats them staying
# silent three log lines away from their symptom.
CONFIG_ASSERT=y
# z_fatal_error() runs coredump() BEFORE deciding halt-vs-reboot (see
# kernel/fatal.c), so this doesn't cost the forensic dump -- it just adds
# automatic recovery after it. Without this, the unweighted Zephyr default is
# arch_system_halt(): spin forever with IRQs locked. On an unattended bench
# node that's the same "needs a physical power cycle" outage class as the
# rzr3 incident, just self-inflicted instead of hardware-caused. The reboot
# is a normal warm reset -- MCUboot has no opinion on it (only an
# unconfirmed-slot boot triggers the test/revert dance), so it comes back on
# the same confirmed image.
CONFIG_RESET_ON_FATAL_ERROR=y

# Coredump rides the existing LOG/netlog pipe (no flash partition, no new
# listener): on a fatal error the crashing thread's registers + all of RAM's
# data/bss/noinit (the DEBUG_COREDUMP_MEMORY_DUMP_LINKER_RAM default -- keep
# it; it's what lets a post-mortem see driver-static state like sx126x_data,
# not just one thread's stack) get emitted as "#CD:" log lines. Reconstruct
# with zephyr/scripts/coredump/coredump_serial_log_parser.py against a
# captured netlog excerpt, then zephyr/scripts/coredump/coredump_gdbserver.py
# + the matching zephyr.elf for a symbolic GDB backtrace.
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y

# Promoted from the opt-in TA=1 overlay (overlay-threadanalyzer.conf, still there for
# a manual `kernel thread stacks`-style one-off) to always-on: periodic per-thread
# stack high-water-mark logging over the existing netlog pipe -- every 5 min is enough
# to catch a trend without spamming netlog (caught a real near-miss stack overflow,
# STABILITY-2, 2026-08-05). CONFIG_THREAD_ANALYZER itself (the underlying
# thread_analyzer_run() API + THREAD_RUNTIME_STATS) stays on; the periodic REPORTING
# is now meshtastic_thread_summary.c (CONFIG_MESHTASTIC_THREAD_SUMMARY, src/Kconfig),
# not upstream's own CONFIG_THREAD_ANALYZER_AUTO -- see that Kconfig entry for why:
# the built-in AUTO dump is 2 LOG_INF lines per thread (~29 threads on this build =
# ~58 near-simultaneous lines every interval), which regularly overran the deferred-
# log ring buffer ("--- N messages dropped ---", found 2026-08-09). The condensed
# summary reports the same two numbers that actually matter (stack%, cpu%) batched
# 3 threads per line instead.
CONFIG_THREAD_ANALYZER=y

# sys_heap_runtime_stats_get() (used by meshtastic_watchdog.c's periodic system-heap
# logging, and Zephyr's own `kernel heap` shell command) is compiled in only with
# this on -- lib/heap/CMakeLists.txt gates the whole heap_stats.c file behind it.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# 2026-08-08: rzr1 hit a genuine Xtensa double-exception (EXCCAUSE 9,
# load/store-alignment, EXCVADDR pointing into *code* space -- a corrupted
# pointer, not a legitimate variable) with THREAD_ANALYZER showing every
# stack completely healthy 3 minutes earlier. That signature -- sudden, no
# creeping-usage warning -- is exactly what a compiler stack canary catches
# and THREAD_ANALYZER's periodic sampling structurally cannot: a canary
# check runs at every vulnerable function's return, not on a timer, so it
# has a chance to catch the smash before the corrupted value (a saved
# register/return address) ever gets used. Entropy is already available
# (ENTROPY_GENERATOR, confirmed via a resolved .config) so this is free to
# turn on. Doesn't explain everything -- see meshtastic_fatal.c for the
# other half of this arc -- but it's the most direct defense against the
# actual bug class observed.
CONFIG_STACK_CANARIES=y

# Companion to the above: the double-exception vector's own body (see
# xtensa_asm2_util.S, no CONFIG_XTENSA_MMU) is unconditional `1: j 1b` --
# zero C code reachable, nothing to hook into short of rewriting core
# arch assembly. This is the closest thing to a live catch: a BREAK
# instruction right before the loop, needing an attached debugger to mean
# anything, which is the whole reason for the JTAG work in the first
# place. Free otherwise (compiles to nothing without a debugger present).
CONFIG_XTENSA_BREAK_ON_UNRECOVERABLE_EXCEPTIONS=y

# 2026-08-09: migrated the watchdog to task_wdt (see meshtastic_watchdog.c) --
# independent channels per subsystem instead of one global liveness signal.
# CONFIG_TASK_WDT_MIN_TIMEOUT is a DIFFERENT number from either channel's own
# timeout (CONFIG_MESHTASTIC_WATCHDOG_TIMEOUT_MS, 180 s default): it sizes
# the underlying *hardware* watchdog's timeout (this value +
# CONFIG_TASK_WDT_HW_FALLBACK_DELAY), which becomes a second, much tighter
# safety net under the software task_wdt layer, in case that layer itself
# wedges. Capped at 10 s by task_wdt's own Kconfig range regardless of how
# generous the channel timeouts are -- set to the max allowed.
#
# 2026-08-10 CORRECTION: this was originally set to the max "for the most
# fallback margin", which had the relationship backwards. MIN_TIMEOUT is not
# margin -- it is the *period of task_wdt's own background feed*. task_wdt
# registers a background channel with exactly this reload period, and feeds
# the hardware watchdog from schedule_next_timeout()
# (zephyr/subsys/task_wdt/task_wdt.c:84) each time that channel comes due,
# while the hardware stage-0 interrupt is programmed at MIN_TIMEOUT + DELAY.
# So the real margin between "background feed lands" and "hardware fires" is
# HW_FALLBACK_DELAY *alone*, and raising MIN_TIMEOUT does not widen it by one
# millisecond. At the Zephyr default DELAY of 20 ms, that margin was 20 ms of
# permitted k_timer latency -- which every bench node exceeded during WiFi
# association on essentially every boot, firing the stage-0 interrupt and
# writing a "scheduler-independent path" crash breadcrumb (see
# meshtastic_watchdog.c) for what was in fact a perfectly healthy boot. Caught
# by noticing the breadcrumb's uptime always fell a few seconds BEFORE the
# same boot's DHCP lease, i.e. it was being written and read within one boot,
# never surviving a reset at all.
CONFIG_TASK_WDT_MIN_TIMEOUT=10000
# The actual margin knob (range 1..10000). 2000 ms of permitted k_timer
# latency before the hardware watchdog concludes the software layer is gone:
# far beyond anything association/flash/PSRAM-init has been observed to cause,
# while still leaving the hardware backstop an order of magnitude tighter than
# any single channel's 180 s grace period. Stage 1 (the actual SoC reset) is a
# further MIN_TIMEOUT+DELAY beyond stage 0 -- see wdt_esp32_set_config(),
# which programs both stages with the same value -- so a genuinely wedged
# scheduler is reset ~24 s after its last feed.
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000

# Statistics: named counter groups, listable via the `stats list` shell
# command. Used for the task_wdt channel feed counts and a mirror of the
# existing CAD/AGC counters (meshtastic_radio.c) -- see
# meshtastic_watchdog.c. STATS_NAMES trades a little code size for readable
# names instead of generated "s0"/"s1" placeholders.
CONFIG_STATS=y
CONFIG_STATS_NAMES=y
CONFIG_STATS_SHELL=y

# 2026-08-09: heap-alloc tracing (meshtastic_heap_trace.c) exists but is OFF
# by default (see Kconfig.heap_trace) -- live test on rzr3 showed the WiFi
# thread's own alloc/free churn runs at ~60+ events/sec, which flooded
# LOG_BACKEND_NET badly enough that ~84% of the trace's own log lines never
# reached the collector (on-device sequence numbers reached #3450 in under a
# minute; only 527 survived). Same flood class as the resolved net_pkt-
# exhaustion bug. Do not enable this on a live/bench node without also
# raising CONFIG_MESHTASTIC_LORA_LOG_LEVEL-style throttling or narrowing the
# listener to a specific thread/size range first -- see bead agents-5v4g and
# docs/KNOWN-ISSUES.md for what was learned from the one test run.
