CONFIG_HWINFO=y

# Primary console (native-USB usb_serial via the board's `zephyr,console`
# chosen node). Unrelated to the secondary uart0 shell -- see
# CONFIG_MESHTASTIC_SHELL_UART0 (src/Kconfig) and boards/*.overlay for that
# (currently heltec_wifi_lora32_v4 only). Motivation for the secondary shell:
# the native USB-CDC console has proven unreliable for capturing early boot
# output under WSL2's USB passthrough.
CONFIG_UART_CONSOLE=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
CONFIG_LORA_LOG_LEVEL_DBG=y

CONFIG_LOG=y
# Log level, buffer and log-thread stack: defaults in Kconfig.debug.
# Render log timestamps as a real calendar date/time (needs
# CONFIG_POSIX_C_LANG_SUPPORT_R, already on) instead of log_output's default
# "elapsed hh:mm:ss" renderer -- which, fed the epoch-based value
# MESHTASTIC_LOG_WALLCLOCK (src/Kconfig) switches to once the clock is
# seeded, prints something like "[496194:12:08.048,000]" (hours-since-1970,
# not a date). This is a plain `=y`, not a `select` in src/Kconfig, because
# LOG_OUTPUT_FORMAT_DATE_TIMESTAMP is a choice-group member and Kconfig
# ignores select/imply on those. Found 2026-08-09, see
# docs/uart0-console-investigation.md.
CONFIG_LOG_OUTPUT_FORMAT_DATE_TIMESTAMP=y

CONFIG_MAIN_STACK_SIZE=8192

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_SETTINGS=y
CONFIG_MESHTASTIC_LOG_LEVEL_DBG=y
# Packet hex dumps stay OFF (MESHTASTIC_PACKET_HEXDUMP): dumping a full ~256-byte
# packet per TX/RX is the deepest formatter on the log path and can overflow the
# log-thread stack. Enable it (and raise CONFIG_LOG_PROCESS_THREAD_STACK_SIZE)
# only for wire-level debugging.

# for persistent settings
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# MCUboot A/B: build the app as a signed slot0 image (zephyr.signed.bin) under
# sysbuild. Inert unless the build is invoked with --sysbuild (SYSBUILD=1 in the
# justfile); harmless for every variant, so it lives here rather than an overlay.
CONFIG_BOOTLOADER_MCUBOOT=y
 # for delayed settings save in system work queue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Regulatory: the region this device transmits in. 1 = US (902-928 MHz).
# Determines the LoRa frequency and the TX power ceiling. Override in a
# gitignored *-local.conf for a device operating elsewhere — transmitting
# outside your allocation is illegal in most jurisdictions and the firmware
# cannot detect that for you. See MESHTASTIC_DEFAULT_REGION in src/Kconfig.core
# for the full code list.
CONFIG_MESHTASTIC_DEFAULT_REGION=1

# --- Debugging: asserts, reset-on-fatal, coredump, thread analyzer, heap stats,
# stats and the rest now have their defaults, reasons and per-board costs in ONE
# place: Kconfig.debug (next to this file). Only the settings below stay here,
# because each is a member of a Kconfig choice, which a Kconfig file cannot
# default (Kconfig.debug lists them too).
#
# Coredump backend: "#CD:" lines over the log pipe (class images switch to a
# flash partition with overlay-coredump-flash.conf).
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y

# Compiler stack canaries, STRONG (a choice; reason in Kconfig.debug).
CONFIG_STACK_CANARIES_STRONG=y

# Stack-overflow detection is BASELINE -- every image, every board -- but the
# MECHANISM differs per SoC and must not be hardcoded here. See
# src/Kconfig.diagnostics: MESHTASTIC_STACK_PROTECTION is default y and selects
# the hardware MPU guard where the arch has one (nRF52840) and the sentinel
# where it does not (ESP32-S3).
#
# Do not "simplify" this back to CONFIG_STACK_SENTINEL=y. That is what was tried
# first, and Kconfig silently discards it on any board with an MPU.

# 2026-08-09: migrated the watchdog to task_wdt (see meshtastic_watchdog.c) --
# independent channels per subsystem instead of one global liveness signal.
# CONFIG_TASK_WDT_MIN_TIMEOUT is a DIFFERENT number from either channel's own
# timeout (CONFIG_MESHTASTIC_WATCHDOG_TIMEOUT_MS, 180 s default): it sizes
# the underlying *hardware* watchdog's timeout (this value +
# CONFIG_TASK_WDT_HW_FALLBACK_DELAY), which becomes a second, much tighter
# safety net under the software task_wdt layer, in case that layer itself
# wedges. Capped at 10 s by task_wdt's own Kconfig range regardless of how
# generous the channel timeouts are -- set to the max allowed.
#
# 2026-08-10 CORRECTION: this was originally set to the max "for the most
# fallback margin", which had the relationship backwards, and the correction
# then exposed a second, worse problem underneath. Both are below, because
# picking these two numbers requires knowing both.
#
# (1) MIN_TIMEOUT is not margin -- it is the *period of task_wdt's own
# background feed*. task_wdt registers a background channel with exactly this
# reload period and feeds the hardware watchdog from schedule_next_timeout()
# (zephyr/subsys/task_wdt/task_wdt.c:84) each time it comes due, while the
# hardware timeout is programmed at MIN_TIMEOUT + DELAY. So raising
# MIN_TIMEOUT moves the deadline and the feed by the same amount and widens
# nothing; DELAY is the entire margin.
#
# (2) The hardware timeout used to be HALF what was asked for -- Zephyr's
# watchdog API documents wdt_timeout_cfg.window.max in milliseconds, but
# wdt_esp32.c passed it straight to wdt_hal_config_stage(), which takes TICKS
# (500 us each on the S3: MWDT hard-wired to APB at 80 MHz, prescaler 40000
# -> 2 kHz). Combined with (1), that put a REAL SoC RESET 20 ms after the feed
# meant to prevent it: V = 10000 + Zephyr's default 20 gave stage 0 at 5.01 s
# and the reset at 10.02 s against a 10.00 s feed. Weeks of spurious reboots
# with no fault, no assert and no breadcrumb, because nothing in software was
# wrong. **Fixed properly in the driver 2026-08-10** -- carried patch
# zephyr/patches/0007-wdt-esp32-convert-timeout-ms-to-mwdt-ticks.patch -- so
# these two values are now plain milliseconds and mean what they say.
#
# What they buy, with the conversion correct (MWDT stages are sequential and
# wdt_esp32_set_config() programs both with the same value, so stage 1 lands
# at 2x stage 0):
#     background feed every  10 s   (= MIN_TIMEOUT)
#     stage 0, interrupt, breadcrumb 20 s   (= MIN_TIMEOUT + DELAY)
#     stage 1, actual SoC reset      40 s
#     -> 10 s of margin for a late k_timer expiry before the breadcrumb fires,
#        30 s before anything resets.
#
# DELAY is the whole margin: MIN_TIMEOUT is the *period of task_wdt's own
# background feed* (see (1)), so raising it moves the deadline and the feed
# together. DELAY is at its Kconfig ceiling of 10000 here. A 10 s margin is
# ~500x the worst case this bench has ever demonstrated, and the 40 s hardware
# backstop is still 4.5x tighter than any application channel's 180 s grace
# period, which is the point of having it.
#
# MIN_TIMEOUT is back to 10 s (it was briefly driven down to 2 s as a
# pre-patch workaround, when a shorter feed period was the only way to buy
# margin against a halved deadline). That restores the lower wake rate, which
# matters for any future node that actually light-sleeps -- these WiFi nodes
# never do, since WiFi and light sleep are mutually exclusive in this port.
CONFIG_TASK_WDT_MIN_TIMEOUT=10000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=10000

# 2026-08-09: heap-alloc tracing (meshtastic_heap_trace.c) exists but is OFF
# by default (see Kconfig.heap_trace) -- live test on rzr3 showed the WiFi
# thread's own alloc/free churn runs at ~60+ events/sec, which flooded
# LOG_BACKEND_NET badly enough that ~84% of the trace's own log lines never
# reached the collector (on-device sequence numbers reached #3450 in under a
# minute; only 527 survived). Same flood class as the resolved net_pkt-
# exhaustion bug. Do not enable this on a live/bench node without also
# raising CONFIG_MESHTASTIC_LORA_LOG_LEVEL-style throttling or narrowing the
# listener to a specific thread/size range first -- see bead agents-5v4g and
# docs/KNOWN-ISSUES.md for what was learned from the one test run.

# No formatted floating point. The firmware formats no floats at all -- the environment
# module's debug lines were the last %f and now print <int>.<milli> -- but both of these
# default on and cost 4,727 B measured on the XIAO (picolibc's float IO plus cbprintf's FP
# support). Turning them off is a straight saving on every image.
#
# ⚠️ If you ever add a %f, it will NOT fail to build: it will print wrongly at runtime.
# Format integer and thousandths instead (meshtastic_environment.c has the pattern).
CONFIG_PICOLIBC_IO_FLOAT=n
CONFIG_CBPRINTF_FP_SUPPORT=n
