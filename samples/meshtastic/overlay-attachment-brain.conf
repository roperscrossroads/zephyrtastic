# The brain of a multi-radio node (ATTACHMENT-DESIGN S6). Layer on any image
# that carries the BLE peer link: it accepts attachment envelopes from radio
# heads (and from a relay ear that has learned to send them) and hears through
# them as if through its own radio, on their presets. Its own identity, keys,
# NodeDB and modules are untouched. The beat advertises FLAG_ATTACH so peers
# know to send envelopes.
#
# Cost: a table of MESHTASTIC_ATTACHMENT_MAX entries (~50 B each) and 8 B per
# RX queue slot in dram0; the code is flash. Measured in the fleet lane.
CONFIG_MESHTASTIC_ATTACHMENT_BRAIN=y
CONFIG_MESHTASTIC_ATTACHMENT_MAX=4

# The outbound worker ("meshtastic_tx") hands frames to heads from its own stack: an
# envelope (MESHTASTIC_ATTACHMENT_ENV_MAX) plus the BLE peer link's chunk buffer
# (L2CAP MTU - 3 = 244 B) plus the Bluetooth host's write path. Measured on rzr1 (V4 brain)
# after a day of relaying through rzr5: 1908 of 2048 B; a brain that had not relayed sat at
# 996. The default is sized for a LoRa transmit only. +768 B, brains only (2026-09-29).
CONFIG_MESHTASTIC_OUTBOUND_STACK_SIZE=2816
