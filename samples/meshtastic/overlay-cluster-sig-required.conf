# Refuse cluster entries authored by anyone else that are not signed
# (CONFIG_MESHTASTIC_CLUSTER_SIG_REQUIRED, Kconfig.cluster; agents-ooma.31, the last step).
#
# Requires overlay-xeddsa.conf (this is a verify-side gate, not a signing one -- every
# node in the fleet needs it, not just the ones that author entries). Without this, a
# present-but-bad or unverifiable signature is already refused, but an unsigned entry is
# still accepted -- the setting that let the fleet adopt signing one node at a time.
# With it, an unsigned entry from anyone but this node is refused outright.
#
# ⚠️ ONLY turn this on fleet-wide once every node verifies AND every entry already in the
# cluster document is signed on every node ("signed" is per-node -- a node keeps whichever
# copy reached it first, and signed/unsigned copies of one (key, stamp) hash identically,
# so no digest ever flags the difference). Sweep `meshtastic cluster` on every node first.
# See docs/handoff-CLUSTER_SIG_REQUIRED.md.
CONFIG_MESHTASTIC_CLUSTER_SIG_REQUIRED=y
