# ===== overlay-ble-peer =====
# Turn on the node-to-node BLE peer link (agents-a4it) on a board whose base
# profile doesn't already carry it. The Heltec classes get this from
# overlay-nonet.conf's own peer-link block (the "ble" variant delta); this
# overlay exists for classes that don't build with overlay-nonet at all — the
# XIAOs, which never had WiFi/net to remove in the first place.
#
# Two conn slots: phone + peer (the peer code build-asserts BT_MAX_CONN >= 2).
# Whichever isn't holding the phone is available for the outbound peer link
# or an inbound one from a peer's central role.
CONFIG_MESHTASTIC_BLE_PEER=y
CONFIG_BT_MAX_CONN=2
