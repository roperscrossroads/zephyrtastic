# Fleet image class 6 — a healthy Heltec V4-**R8**: transmits, participates in
# the mesh and the cluster. The R8 counterpart of class 4 (overlay-v4-member.conf).
#
# WHY THIS CLASS HAD TO EXIST (added 2026-08-31).
# The bench had exactly one R8 class — class 2, the courier — so the only other
# R8 on the bench (rzr4, devreg `v4r8-spare`) was declared class 4. Class 4 builds
# for `heltec_wifi_lora32_v4`, the PLAIN V4: different PSRAM entirely (2 MB quad
# vs the R8's 8 MB octal). rzr4 was in fact running an R8-built image carrying
# class 4, i.e. somebody had overridden the board by hand and fleet.toml recorded
# none of it. Rebuilding class 4 from the recipe and flashing rzr4 would have put
# quad-PSRAM assumptions onto octal hardware.
#
# This is the same argument overlay-v4-member.conf makes about class 3 vs 4, one
# level up: hw_model cannot distinguish a V4 from a V4-R8 well enough to protect
# anyone, the CLASS is what a courier matches on, and the class rides in the
# signed image as protected TLV 0x00A0. A V4 image and an R8 image must therefore
# never share a class number, however similar the roles look.
#
# Differs from class 4 in exactly two things: this file (class number + TLV) and
# the board passed to `west build`. Every other overlay in the recipe is shared,
# so the two member roles cannot drift apart by accident.
CONFIG_MESHTASTIC_FLEET_CLASS=6
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--custom-tlv 0x00A0 0x06"

# Boots mute, for the same reason class 4 does — see overlay-v4-member.conf's
# note in full. Short version: flashing erases NVS, a fresh board falls back to
# LongFast (the PUBLIC mesh) with TX on at full region power, and rzr2 was
# observed beaconing onto public LongFast within 33 s of boot before any operator
# command could land. DEFAULT_REBROADCAST_MODE stops a fresh node relaying
# other people's traffic but deliberately does not stop it transmitting its own.
# A bench node is always reachable by USB or BLE, so discoverability over the air
# buys nothing here and costs something. Turn TX on with `meshtastic lora tx on`
# once the preset and channels are right.
#
# BENCH default, not a shipping one: a field node that boots unable to transmit
# is also unable to be found.
CONFIG_MESHTASTIC_TX_ENABLED_DEFAULT=n
