# overlay-pm-on.conf — restore ESP32-S3 light sleep on top of a profile that now
# defaults it off.
#
# 2026-08-23: overlay-v4-unified.conf's own CONFIG_PM default flipped from y to n
# (battery-related debugging in progress — see that file's "===== overlay-pm ====="
# header and docs/AUG-23.md), so the PM=1 justfile knob needs an explicit "turn it back
# on" overlay the same way PM=0 already had overlay-pm-off.conf. Before this file
# existed, PM=1 relied entirely on the profile's own baked-in CONFIG_PM=y and had no
# overlay of its own — flipping the profile default silently broke it (PM=1 would
# request light sleep and get none, with no error). This is that missing overlay.
#
# Layer LAST, after the unified profile, so its CONFIG_PM=y wins over whatever the
# profile itself currently defaults to:
#   ... -DEXTRA_CONF_FILE="overlay-v4-unified.conf;overlay-pm-on.conf"
# or via the justfile:  PROFILE=v4-unified PM=1 BOARD_TAG=heltec-v4 just dist
#
# This is the exact inverse of overlay-pm-off.conf — same four symbols, opposite
# values, same reasoning (see that file's comments for the "why" on each one). Not a
# blind toggle: each value below is what the profile's own "===== overlay-pm ====="
# block sets when describing ON behaviour, kept in sync with it deliberately.

# --- Turn the PM subsystem on: the idle thread may enter PM_STATE_STANDBY
#     (esp_light_sleep_start), powering down the CPU domain between events. The board
#     DT's wakeup-source declarations (rtc_timer / gpio / lora) become live.
CONFIG_PM=y

# --- Default the node to power-saving ON so a PM build actually enters light sleep out
#     of the box (otherwise PowerConfig.is_power_saving defaults false and the power
#     policy holds a pm_policy lock blocking STANDBY — see meshtastic_power.c). The
#     phone's stored is_power_saving still overrides this on the next boot either way.
CONFIG_MESHTASTIC_POWER_SAVE_DEFAULT=y

# --- Residency-stats collector + its shell surface, so light sleep is provable rather
#     than assumed (`cpu states`, `cpu available`, `stats list` — see the profile's own
#     "===== overlay-pm =====" block for the full command list and what each shows).
CONFIG_PM_STATS=y
CONFIG_PM_CPU_SHELL=y
