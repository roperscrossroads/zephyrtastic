# Coredump to FLASH instead of the console log.
#
# THE CONSOLE BACKEND CANNOT WORK ON THIS HARDWARE, and that is measured rather
# than suspected (agents-quo6, 2026-08-30):
#
#   whole-RAM dump          337,680 bytes
#   logging backend rate      4,578 bytes/s   (measured over a real dump)
#   => time needed             73.8 s
#   watchdog allows            ~17 s          ("PRO CPU has been reset by WDT")
#
# So every coredump this fleet has ever emitted was truncated at ~23 % of RAM,
# and would have been whatever the fault was. It LOOKS like it works -- thousands
# of #CD: lines scroll past -- and yields nothing: the stacks sit at ~60 % into
# the region and were never reached.
#
# Flash has no such budget. The dump is written in well under a second, survives
# the reset that follows, and is read back over USB at leisure with the shell
# commands below:
#
#   coredump find     -- is a dump stored?
#   coredump verify   -- is it intact?
#   coredump print    -- emit it as #CD: lines, with no watchdog racing it
#   coredump erase    -- arm for the next one
#
# Then the usual pipeline: coredump_serial_log_parser.py, then
# coredump_gdbserver.py against the MATCHING zephyr.elf.
#
# Requires a `coredump_partition` in the board's flash map. Today only the
# Heltec V4 16 MB map has one, which is why this is an overlay and not prj.conf.
# Pair with coredump-big.overlay (DTS) so LINKER_RAM actually fits.

CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_LINKER_RAM=y
CONFIG_DEBUG_COREDUMP_SHELL=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# A crash-capture pipeline that is only ever exercised by the bug it was built
# to catch gets discovered broken at the worst possible moment -- which is
# exactly what happened here. `meshtastic crashtest <panic|stack>` proves the
# whole chain in a couple of minutes, against the image about to be deployed.
# Default n in Kconfig; on here because this IS the diagnostic image.
CONFIG_MESHTASTIC_SHELL_CRASHTEST=y
