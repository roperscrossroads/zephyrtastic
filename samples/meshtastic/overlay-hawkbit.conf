# Firmware updates from an Eclipse hawkBit server (DDI polling), for an IP image (the WiFi
# `net` profile: overlay-v4-unified.conf + overlay-nobt.conf). Not with overlay-ota.conf: one
# writer of slot 1. The server and the device token are set at run time and kept in settings:
#   hawkbit server <address> [port]
#   hawkbit token <target token>
# Details: src/Kconfig.hawkbit, src/meshtastic_hawkbit.c.
CONFIG_HAWKBIT=y
CONFIG_HAWKBIT_SET_SETTINGS_RUNTIME=y
CONFIG_HAWKBIT_SERVER=""
CONFIG_HAWKBIT_PORT=8080
CONFIG_HAWKBIT_DDI_TARGET_SECURITY=y
CONFIG_HAWKBIT_DDI_GATEWAY_SECURITY=n
CONFIG_HAWKBIT_DDI_SECURITY_TOKEN=""
CONFIG_HAWKBIT_HWINFO_DEVICE_ID=y
CONFIG_HAWKBIT_CUSTOM_ATTRIBUTES=y
CONFIG_HAWKBIT_CONFIRM_IMG_ON_INIT=n
CONFIG_HAWKBIT_AUTOHANDLER=n
CONFIG_HAWKBIT_SHELL=n
# A fatal error resets the board, so MCUboot can swap an unconfirmed image back
# (a halt would defeat the revert). Already the app default; stated here on purpose.
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_MESHTASTIC_HAWKBIT=y

# What the client needs
CONFIG_HTTP_CLIENT=y
CONFIG_JSON_LIBRARY=y
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_HWINFO=y
CONFIG_DNS_RESOLVER=y
