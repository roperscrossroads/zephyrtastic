# ===== overlay-depot =====
# --- Firmware depot on the Heltec 16 MB map: LittleFS at /depot, filled over SMP ---
# The courier's cargo hold: images for OTHER nodes live here as
# files, put there with `smpmgr file upload <bin> /depot/<name>` and pushed on with
# `smpc push /depot/<name>`. Needs the board partition map with a `depot` partition
# (boards/heltec/heltec_wifi_lora32_v4/heltec_partitions_16M.dtsi, 2026-08-26 — a
# bootloader reflash the first time a board takes it) and the DT enable:
#   -DEXTRA_DTC_OVERLAY_FILE=depot.overlay
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_MESHTASTIC_DEPOT=y
# The fstab `automount;` property does nothing without this: it is the switch that
# makes littlefs_fs.c mount its fstab entries at init (found the hard way).
CONFIG_FS_LITTLEFS_FSTAB_AUTOMOUNT=y
# Format a fresh depot on first mount (automount without no-format).
CONFIG_FILE_SYSTEM_MKFS=y
# SMP file management so a host (or a peer) can fill the depot over any SMP transport.
CONFIG_MCUMGR_GRP_FS=y
# LittleFS RAM: one file open at a time is all the courier needs.
CONFIG_FS_LITTLEFS_NUM_FILES=2
CONFIG_FS_LITTLEFS_NUM_DIRS=2
# The file-cache pool is sized by THESE, not by the fstab node: an fs_open() on a mount
# whose cache-size (256) exceeds CONFIG_FS_LITTLEFS_CACHE_SIZE (64) fails with -ENOMEM.
# Keep them equal to the depot node's read-size / prog-size / cache-size / lookahead.
CONFIG_FS_LITTLEFS_READ_SIZE=32
CONFIG_FS_LITTLEFS_PROG_SIZE=32
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=64
# Firmware images are far bigger than fs_mgmt's 64 KB default file-size cap.
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
# Bench visibility: `fs ls /depot`, `fs statvfs /depot`, `fs mount littlefs /depot`, and
# INFO-level FS logs so a failed automount says why. Drop for a field build.
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FS_LOG_LEVEL_INF=y

# File transfer over SMP — `smpmgr --ble <node> file download|upload`. This lives
# HERE and not in overlay-ota-ble.conf on purpose: MCUMGR_GRP_FS `depends on
# FILE_SYSTEM`, and this overlay is the only place a filesystem is mounted. A
# class with no filesystem would either fail the dependency or drag LittleFS in
# for nothing, so the group belongs with the storage, not with the transport.
#
# Two things it buys on the courier specifically:
#   - the depot becomes readable/writable over BLE with stock tooling, instead of
#     only through the bespoke upload path;
#   - a stored coredump can be pulled OFF a node over BLE rather than needing the
#     board on a USB host — which is exactly the recovery that was impossible for
#     rzr3 (agents-qcp1) and is the practical half of agents-l984.
#
# ⚠️ SECURITY: this is filesystem read/write over the air. It is only acceptable
# because the SMP service is already gated — overlay-ota-ble-secure.conf's
# RW_ENCRYPT, with the courier pairing before it talks SMP (F7 P1). Do not enable
# this on an image whose SMP service is open.
CONFIG_MCUMGR_GRP_FS=y

# Fleet image class 2: the Heltec R8 courier (BLE + SMP server + SMP client +
# this depot). Distinct from a plain Heltec BLE node (class 0/unset today) and
# from the transmit-disabled build (class 3): none of the three may replace
# another over the air.
CONFIG_MESHTASTIC_FLEET_CLASS=2
# The same class, signed into the image as protected TLV 0x00A0 (F4): a depot
# reads it from the header; CMakeLists refuses a build where the two disagree.
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--custom-tlv 0x00A0 0x02"
