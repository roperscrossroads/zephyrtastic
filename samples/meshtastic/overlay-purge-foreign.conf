# TEMP one-shot: purge stale-format (non-37 B) persisted node-key records from NVS.
#
# Layer this on a normal build, flash it ONCE (OTA preserves NVS), let it boot — it
# deletes any pre-role/key-only mtnode records left by an older build, then leave it.
# The device private key (meshtastic config subtree) and WiFi credentials (wifi_cred
# subtree) are NOT touched. Re-flash a normal build (without this overlay) afterwards.
#
#   PROFILE=v4-unified EXTRAS=overlay-purge-foreign.conf just dist
#
# Delete this file once the bench nodes are cleaned.
CONFIG_MESHTASTIC_NODEDB_PURGE_FOREIGN_KEYS=y
