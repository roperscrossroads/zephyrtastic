# Effective RF gain-path readback (`meshtastic rf`) and RSSI/SNR history,
# fleet-wide (Kconfig.rf). Added 2026-09-01 so "what is this board's FEM,
# tx power, rx boost, and gain path actually doing" can be answered from the
# console on every node, not derived from `meshtastic lora` plus source
# reading. See main/docs/rf-measurement.md.
#
# Pure readback + passive receive-side accounting: nothing here transmits,
# and it costs no RAM/cycles on the transmit path. Safe on every board this
# port targets, FEM or no FEM, ESP32 or nRF.
CONFIG_MESHTASTIC_RF=y
CONFIG_MESHTASTIC_RF_PATH_REPORT=y
CONFIG_MESHTASTIC_RF_HIST=y
