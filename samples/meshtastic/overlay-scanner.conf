# Multi-preset RX-only survey (docs/MULTI-PRESET-OPERATION.md §3).
#
# Layer onto any profile: EXTRAS=overlay-scanner.conf.  Scanning is a RUNTIME
# mode (`meshtastic scan start` / `stop`), so a node built with this is an
# ordinary participant until told otherwise — enabling it costs the ring and
# the sweep thread, not the node's membership of its mesh.
#
# This overlay exists because the first scanner image (rzr3, 2026-08-19) was
# built from an ad-hoc config that was never checked in, which made the image
# that produced the survey results unreproducible.  Keep it in-repo.
CONFIG_MESHTASTIC_SCANNER=y
