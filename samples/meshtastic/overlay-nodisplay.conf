# No on-device screen UI (agents-zo3o.2). The justfile appends it for UI=0.
#
# overlay-v4-unified.conf turns the CFB display UI on for every V4 image. Since agents-zo3o.7
# the display option owns its whole stack (DISPLAY, CHARACTER_FRAMEBUFFER, INPUT, the SSD1306
# driver), so this one line removes all of it: 9.1 KB of dram0 on a class-4 image.
CONFIG_MESHTASTIC_DISPLAY=n
