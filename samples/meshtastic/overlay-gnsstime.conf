# GNSS TIME diagnostics — DIAGNOSTIC ONLY (bench). Layer with EXTRAS=overlay-gnsstime.conf.
#
# Answers the three Phase A questions of the time arc in one image:
#
#   1. Does the fitted L76K emit NMEA sub-second digits, or a bare `.000`?
#   2. How LATE is the sentence — the delay from the true UTC second to the
#      moment our callback runs? This is the term that actually bounds GNSS
#      time accuracy, and it is one-sided, so it cannot be averaged away.
#   3. Does the module drive the 1PPS pin (GPIO41) at all?
#
# (1) and (2) come from MESHTASTIC_GNSS_TIME_DEBUG's per-callback line, which is
# stamped with k_cycle_get_32() BEFORE the no-fix gate — so a module that is
# tracking satellites without a fix is still visible, which is the normal indoor
# state. (3) comes from the board's `gps pps start` edge counter, stamped from
# the SAME cycle counter: an interleaved capture gives (2) by subtraction.
#
# DELIBERATELY NOT gnss_dump. That overlay exists already (overlay-gnssdump.conf)
# and composes on top of this one when you want the per-satellite SNR view during
# acquisition. It is not folded in here because it logs via LOG_PRINTK — which is
# unconditional, so `log disable gnss` cannot quiet it — at ~13 lines/s with
# GNSS_SATELLITES. Measured on rzr2: that overruns the shell RX ring and the
# console answers `gps pps` with "55 messages dropped". A diagnostic you cannot
# type into is not a diagnostic.
#
# Liveness is still visible without it: the driver publishes only when it parses
# a sentence, so a `gnsst` line arriving at 1 Hz IS the module alive and
# streaming. What gnss_dump adds is per-satellite SNR — the useful progress bar
# while a receiver acquires — so layer it in for the window trip and drop it
# again to use the shell:
#
#   EXTRAS="overlay-gnsstime.conf;overlay-gnssdump.conf"
CONFIG_GNSS=y
CONFIG_MESHTASTIC_GNSS=y
CONFIG_MESHTASTIC_GNSS_TIME_DEBUG=y

# MESHTASTIC_GNSS_PPS_AUTOSTART follows TIME_DEBUG by default, so the 1PPS counter
# is armed at boot. That is what makes an UNATTENDED run work: a receiver needs
# sky, a node at a window is on battery with no console, and a counter armed by
# hand collects nothing there. Both instruments log with the same cycle stamp and
# both land in the retained ring below, so `logring` on return replays the
# interleaved PPS/NMEA stream and the latency is a subtraction over it.
#
# Bigger ring, because that stream is the deliverable. At INF level the ring holds
# roughly SIZE/100 lines; two lines a second means 4096 B buys only ~20 s of
# history, and the interesting seconds are the ones just after a fix. 7168 B is
# about a minute. It lives in the 8 KB RTC slow segment alongside the bootlog, and
# at 7168 that segment measures **7524 B / 8192, 91.85%** — so this is close to the
# ceiling. Check the `rtc_slow_seg` line in the build's memory report before raising
# it further. Overflowing it is a link error, not a runtime surprise.
CONFIG_MESHTASTIC_LOGRING_SIZE=7168

# ⚠️ Retained RAM survives a warm reset (confirmed repeatedly on this bench,
# including `west flash` and `kernel reboot cold`) but NOT a power cycle. A node
# whose battery died on the windowsill comes back with nothing. Plug USB back in
# WITHOUT letting it lose power, then read `logring` — or `logring prev` if it
# rebooted on the way.
