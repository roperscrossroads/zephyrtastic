# ===== overlay-nonet ===== (the "ble" variant delta)
# Compile the entire network side OUT of the unified profile: no WiFi driver, no
# IP stack, no MQTT, no netlog, no SNTP, no telnet, no TCP PhoneAPI — a node
# whose transports are BLE (phone / future peer link) + LoRa only. Appended by
# the justfile for VARIANT=ble, which also forces OTA=0 (SMP/UDP needs the net
# stack; flash over USB) and LOCAL=0 (the local overlay holds only net-service
# identifiers, meaningless here).
#
# Unlike overlay-pm-quiet.conf (runtime-quiet: net compiled in but not brought
# up), this removes the stack at build time. What that buys on the S3 (2026-08-23
# linker-map tally of the unified+BT image): WiFi driver + supplicant ~8 KB
# .bss, IP stack ~25 KB bss+noinit, telnet shell ~8 KB, the ESP WiFi heap
# reservation, and every net thread stack — the DRAM that makes BLE + display +
# GNSS fit with real headroom instead of scraping past the linker.
#
# CONFIG_NETWORKING=n cascades through everything that `depends on` it (NET_*,
# DNS, sockets, DHCP). The lines below name the top-level switches and the
# MESHTASTIC features whose absence is the point, so the variant's feature set
# is readable here rather than inferred from Kconfig dependency chains.
# (`=n` on an already-dead symbol is always safe — no Kconfig assign warnings.)
CONFIG_WIFI=n
CONFIG_NETWORKING=n

# Meshtastic net-side features off by name.
CONFIG_MESHTASTIC_TCP=n
CONFIG_MESHTASTIC_SNTP=n
CONFIG_MESHTASTIC_MQTT=n
CONFIG_MQTT_LIB=n
CONFIG_MESHTASTIC_WIFI_AUTOCONNECT=n
CONFIG_WIFI_CREDENTIALS=n

# Console comes back home: logs to the UART backend (netlog is gone), shell on
# serial only (no telnet). Same restore overlay-pm-quiet.conf documents.
CONFIG_LOG_BACKEND_NET=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL_BACKEND_TELNET=n
CONFIG_NET_SHELL=n

# PSA crypto for Meshtastic PKC (X25519 + AES-CCM + SHA-256) is deliberately
# KEPT — it rides on mbedTLS builtin, not on the (removed) TLS data path.
