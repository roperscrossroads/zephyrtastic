# MQTT over TLS on the V4 profile (agents-zo3o.7). Chain it LAST, after
# overlay-nomqtt.conf, on a networked image (overlay-nobt.conf or the unified image):
#
#   -DEXTRA_CONF_FILE="overlay-v4-unified.conf;overlay-nobt.conf;...;overlay-nomqtt.conf;overlay-mqtt-tls.conf"
#
# Why a separate overlay: overlay-v4-unified.conf ends with its "overlay-mqtt-plain" block,
# which is unconditional. It drops the mbedTLS SSL/X509 layer and the certificate crypto
# to reclaim DRAM. Turning only MQTT_LIB_TLS and friends back on (what the 2026-09-26 memory
# sweep tried) then fails to compile: Zephyr's sockets_tls.c needs mbedtls_ssl_get_session()
# and _set_session(), which live in the dropped SSL layer. This file is the exact inverse
# of that block, so the profile's own TLS settings (NO_VERIFY, the PSA_WANT scaffolding,
# SSL_IN_CONTENT_LEN) apply again.
#
# Peer verification stays OFF, as in the profile: the link is encrypted but the broker is
# not authenticated. Point MESHTASTIC_MQTT_BROKER_HOST at a real broker in a local,
# gitignored overlay; the profile's placeholder is not a host.

CONFIG_MQTT_LIB=y
CONFIG_MESHTASTIC_MQTT=y

CONFIG_MESHTASTIC_MQTT_BROKER_PORT=8883
CONFIG_MESHTASTIC_MQTT_TLS=y
CONFIG_MESHTASTIC_MQTT_TLS_NO_VERIFY=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y

# --- the mbedTLS SSL/X509 layer the plaintext block drops ---
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y

# --- certificate crypto (PKC itself needs only X25519 + AES-CCM + SHA-256) ---
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
