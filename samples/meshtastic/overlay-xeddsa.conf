# Verify XEdDSA signatures on received packets (CONFIG_MESHTASTIC_XEDDSA, Kconfig.xeddsa).
#
# What changes on the air: a packet arriving WITH a signature must have a good one, or it is
# dropped -- not delivered, not relayed. A packet arriving WITHOUT one is unaffected under the
# default policy (SecurityConfig.packet_signature_policy = COMPATIBLE), so enabling this on
# some nodes and not others does not partition a mesh.
#
# What it does NOT do: this port never signs, so our own traffic stays unauthenticated to
# everyone else (agents-ooma.30), and BALANCED's downgrade-drop is not implemented -- it
# behaves as COMPATIBLE (agents-ooma.32).
#
# ⚠️ COSTS FLASH: the vendored Ed25519 arithmetic (src/crypto/ed25519) plus PSA SHA-512.
# Measure before adding it to an image that is already near the ceiling -- the XIAO lockdown
# variant was at 96.9% of flash before this existed.
CONFIG_MESHTASTIC_XEDDSA=y
