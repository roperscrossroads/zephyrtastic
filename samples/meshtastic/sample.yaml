sample:
  name: Meshtastic
  description: >
    Demonstrates the Meshtastic mesh radio stack: initialises the default
    LongFast channel, prints received text messages, and broadcasts a
    greeting every 30 seconds.
common:
  build_only: true
  # No integration_platforms here: twister MERGES a common list into every scenario, and a
  # board outside a scenario's platform_allow is then an error. Each scenario names its own.
tests:
  sample.meshtastic:
    tags:
      - lora
      - meshtastic
    integration_platforms:
      - twatch_s3/esp32s3/procpu
      - heltec_wifi_lora32_v4/esp32s3/procpu
      - arduino_giga_r1/stm32h747xx/m7
    platform_allow:
      - twatch_s3/esp32s3/procpu
      - heltec_wifi_lora32_v4/esp32s3/procpu
      - heltec_wifi_lora32_v4_r8/esp32s3/procpu
      - arduino_giga_r1/stm32h747xx/m7
      # The two 2026-08 bring-ups — in CI so the next regression is not found
      # by hand on the bench (agents-sgs7.1):
      - xiao_ble/nrf52840          # + wio_sx1262_xiao shield; the first nRF target
      - sensecap_indicator_d1l/esp32s3/procpu
    extra_args:
      - platform:arduino_giga_r1/stm32h747xx/m7:SHIELD=semtech_sx1262mb2das
      - platform:xiao_ble/nrf52840:SHIELD=wio_sx1262_xiao
  sample.meshtastic.settings:
    tags:
      - lora
      - meshtastic
      - settings
    integration_platforms:
      - twatch_s3/esp32s3/procpu
      - arduino_giga_r1/stm32h747xx/m7
    platform_allow:
      - twatch_s3/esp32s3/procpu
      - arduino_giga_r1/stm32h747xx/m7
    # The settings config (CONFIG_MESHTASTIC_SETTINGS / NVS / FLASH_MAP) is now a
    # default in prj.conf, so no overlay is needed — this stays as an explicit
    # settings-tagged build.
    extra_args:
      - platform:arduino_giga_r1/stm32h747xx/m7:SHIELD=semtech_sx1262mb2das
  sample.meshtastic.unified:
    # The shipping unified image: BLE + WiFi PhoneAPI in one build, telnet
    # shell-over-IP, MQTT-over-TLS bridge, WiFi boot auto-connect, and the
    # TCP:4403 PhoneAPI transport. No site-specific broker/SSID, so the target
    # is publishable/upstreamable. Heltec V4 (esp32s3).
    tags:
      - lora
      - meshtastic
      - net
      - wifi
      - ble
      - mqtt
    integration_platforms:
      - heltec_wifi_lora32_v4/esp32s3/procpu
    platform_allow:
      - heltec_wifi_lora32_v4/esp32s3/procpu
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf"
  sample.meshtastic.standalone_phone:
    # A XIAO carried and used from a phone: fixed-PIN pairing, bonds kept across
    # reboots, no SMP over BLE, no BLE peer link, and the serial PhoneAPI on a
    # second USB CDC port for Web Serial. Build-only: it caught two configs that
    # had never been built (serial PhoneAPI on nRF, BLE without the peer link).
    tags:
      - lora
      - meshtastic
      - ble
      - serial
    platform_allow:
      - xiao_ble/nrf52840
    integration_platforms:
      - xiao_ble/nrf52840
    extra_args:
      - SHIELD=wio_sx1262_xiao
      - "EXTRA_CONF_FILE=overlay-ota-ble.conf;overlay-xeddsa.conf;overlay-standalone-phone.conf;overlay-web-serial.conf"
      - EXTRA_DTC_OVERLAY_FILE=phone-cdc.overlay

  # ---- Fleet images and their arms on the REAL boards (agents-zo3o.7) --------------------
  # tests/variants is native_sim only, so it cannot see a break that exists only on a
  # hardware target: a board file, the ESP32 watchdog/fatal paths, the CFB link, the
  # ESP32 linker's PSRAM section. On 2026-09-26 the memory sweep found six such breaks
  # with the native_sim sweep all green. These scenarios build each fleet class's image
  # and the arms that broke, so the next one fails here instead of on someone's bench.
  #
  #   west twister -T main/samples/meshtastic --tag fleet     (from the workspace root)
  #
  # Run it against main/ only. Twister takes board roots from the west manifest, which
  # names main/, and ignores ZEPHYR_EXTRA_MODULES for that: from a sibling worktree it
  # sees the V4 boards twice ("defined multiple times") or, without -A, only main/'s copy.
  # A worktree checks the same scenarios with plain `west build` (the tooling repo's
  # tools/fleet-lane.py reads this file and does that).
  #
  # The overlay lists MIRROR the tooling repo's fleet.toml [classes.*].build, minus the fleet
  # signing key (a XIAO sysbuild falls back to MCUboot's dev key). Change a class there,
  # change it here. Heltec scenarios are app builds (flash does not bind on a Heltec, and
  # dram0 is the same either way); XIAO scenarios are sysbuild, because the XIAO binds on
  # its MCUboot app slot and only a sysbuild measures that. ~3 min per image.
  # Each scenario repeats its board as integration_platforms (see the note under common:).
  sample.meshtastic.fleet.c4:
    # Class 4, V4 cluster member (the plain-V4 image).
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v4/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-v4-member.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf"
      - "EXTRA_DTC_OVERLAY_FILE=coredump-big.overlay"
  sample.meshtastic.fleet.c4.brain:
    # Class 4 as a brain (rig B): the V4 member plus overlay-attachment-brain.conf.
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v4/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-v4-member.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf;overlay-attachment-brain.conf;overlay-quiet-first-boot.conf"
      - "EXTRA_DTC_OVERLAY_FILE=coredump-big.overlay"
  sample.meshtastic.fleet.c4.no_reboot_trace:
    # MESHTASTIC_REBOOT_TRACE=n: the admin, fatal and watchdog paths called the note
    # function unguarded, and native_sim compiles none of them.
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v4/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-v4-member.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf"
      - "EXTRA_DTC_OVERLAY_FILE=coredump-big.overlay"
    extra_configs:
      - CONFIG_MESHTASTIC_REBOOT_TRACE=n
  sample.meshtastic.fleet.c4.no_display:
    # MESHTASTIC_DISPLAY=n: the profile used to enable the CFB stack directly, so dropping
    # the module left a framebuffer with no font ("cfb_font not defined").
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v4/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-v4-member.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf"
      - "EXTRA_DTC_OVERLAY_FILE=coredump-big.overlay"
    extra_configs:
      - CONFIG_MESHTASTIC_DISPLAY=n
  sample.meshtastic.fleet.c4.no_gnss:
    # MESHTASTIC_GNSS=n (and no overlay-gnss.conf): the V4 board file printed a
    # GNSS-only Kconfig value in its `gps pps` shell, so a GNSS-less V4/R8 image did
    # not compile (agents-zo3o.8). A gateway/bridge image drops GNSS to fit.
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v4/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-v4-member.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf"
      - "EXTRA_DTC_OVERLAY_FILE=coredump-big.overlay"
    extra_configs:
      - CONFIG_MESHTASTIC_GNSS=n
  sample.meshtastic.fleet.c4.terse_asserts:
    # The diagnostic tier's field rung: ASSERT_VERBOSE=n keeps every check, drops the text.
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v4/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-v4-member.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf"
      - "EXTRA_DTC_OVERLAY_FILE=coredump-big.overlay"
    extra_configs:
      - CONFIG_ASSERT_VERBOSE=n
  sample.meshtastic.fleet.c2:
    # Class 2, the V4-R8 courier (depot, SMP central). The tightest dram0 in the fleet.
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v4_r8/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4_r8/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-ota-shell.conf;overlay-smp-central.conf;overlay-depot.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf"
      - "EXTRA_DTC_OVERLAY_FILE=depot.overlay"
  sample.meshtastic.fleet.c2.brain:
    # Class 2 as a brain (rig A): the courier plus overlay-attachment-brain.conf. The image
    # that overflowed dram0 by 560 B on 2026-10-01 with no lane scenario to catch it (agents-pcs2.7).
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v4_r8/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4_r8/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-ota-shell.conf;overlay-smp-central.conf;overlay-depot.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf;overlay-attachment-brain.conf;overlay-quiet-first-boot.conf"
      - "EXTRA_DTC_OVERLAY_FILE=depot.overlay"
  sample.meshtastic.fleet.c6:
    # Class 6, V4-R8 cluster member.
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v4_r8/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4_r8/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-cluster.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-v4r8-member.conf;overlay-health.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-cluster-sig-required.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf"
      - "EXTRA_DTC_OVERLAY_FILE=coredump-big.overlay"
  sample.meshtastic.fleet.c8:
    # Class 8, V4-R8 RF listener (preset scanner, transmit refused).
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v4_r8/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4_r8/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-coredump-flash.conf;overlay-battery.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-scanner.conf;overlay-listener.conf;overlay-v4r8-listener.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf"
      - "EXTRA_DTC_OVERLAY_FILE=coredump-big.overlay"
  sample.meshtastic.fleet.c1:
    # Class 1, XIAO cluster member. Binds on the MCUboot app slot (733,034 B).
    tags: [meshtastic, fleet]
    platform_allow: [xiao_ble/nrf52840]
    integration_platforms: [xiao_ble/nrf52840]
    sysbuild: true
    extra_args:
      - SHIELD=wio_sx1262_xiao
      - "EXTRA_CONF_FILE=overlay-ota-shell.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-health.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sig-required.conf;overlay-ble-peer.conf;overlay-led-status.conf;overlay-quiet-first-boot.conf"
  sample.meshtastic.fleet.c1.terse_signed:
    # Class 1 with terse asserts AND cluster + packet signing: the image agents-ooma.38 will
    # prove on hardware. It only fits because ASSERT_VERBOSE=n frees ~39 KB of flash.
    tags: [meshtastic, fleet]
    platform_allow: [xiao_ble/nrf52840]
    integration_platforms: [xiao_ble/nrf52840]
    sysbuild: true
    extra_args:
      - SHIELD=wio_sx1262_xiao
      - "EXTRA_CONF_FILE=overlay-ota-shell.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-health.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-cluster-sig-required.conf;overlay-ble-peer.conf;overlay-led-status.conf;overlay-cluster-sign.conf;overlay-xeddsa-sign.conf;overlay-quiet-first-boot.conf"
    extra_configs:
      - CONFIG_ASSERT_VERBOSE=n
  sample.meshtastic.fleet.c12:
    # Class 12, XIAO keyless radio head (ATTACHMENT-DESIGN S5): the peer link and OTA,
    # nothing that holds a key or speaks. The post-build keyless assert runs on this ELF.
    tags: [meshtastic, fleet]
    platform_allow: [xiao_ble/nrf52840]
    integration_platforms: [xiao_ble/nrf52840]
    sysbuild: true
    extra_args:
      - SHIELD=wio_sx1262_xiao
      - "EXTRA_CONF_FILE=overlay-ota-shell.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-health.conf;overlay-rf.conf;overlay-ble-peer.conf;overlay-led-status.conf;overlay-attachment-head.conf"
    extra_configs:
      - CONFIG_MESHTASTIC_FLEET_CLASS=12
      - CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--custom-tlv 0x00A0 0x0c"
  sample.meshtastic.fleet.c13:
    # Class 13, Heltec V3 keyless radio head (ATTACHMENT-DESIGN S5, review plan R7): the
    # XIAO head's role on the V3 (no PSRAM, CP210x console). The V3's shared profile with
    # the network off, the peer link, and the head overlay; the keyless assert runs on
    # this ELF too. dram0 ~76 %: the board has room a brain does not.
    tags: [meshtastic, fleet]
    platform_allow: [heltec_wifi_lora32_v3/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v3/esp32s3/procpu]
    sysbuild: true
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nonet.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-ble-peer.conf;overlay-rf.conf;overlay-led-status.conf;overlay-attachment-head.conf;overlay-quiet-first-boot.conf"
    extra_configs:
      - CONFIG_MESHTASTIC_FLEET_CLASS=13
      - CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--custom-tlv 0x00A0 0x0d"
  sample.meshtastic.fleet.c9:
    # Class 9, XIAO RF listener.
    tags: [meshtastic, fleet]
    platform_allow: [xiao_ble/nrf52840]
    integration_platforms: [xiao_ble/nrf52840]
    sysbuild: true
    extra_args:
      - SHIELD=wio_sx1262_xiao
      - "EXTRA_CONF_FILE=overlay-ota-shell.conf;overlay-ota-ble.conf;overlay-ota-ble-secure.conf;overlay-rf.conf;overlay-node-id-from-key.conf;overlay-xeddsa.conf;overlay-scanner.conf;overlay-listener.conf;overlay-xiao-listener.conf;overlay-led-status.conf"
  sample.meshtastic.fleet.gateway:
    # The WiFi gateway (net, no BT) with plaintext MQTT, as measured in FEATURE-COSTS §6.1:
    # what the justfile builds for PROFILE=v4-unified MQTT=1 (overlay-mqtt.conf last).
    tags: [meshtastic, fleet, net, mqtt]
    platform_allow: [heltec_wifi_lora32_v4/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nobt.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-mqtt.conf"
  sample.meshtastic.fleet.gateway_tls:
    # The same gateway with MQTT over TLS. Before overlay-mqtt-tls.conf existed, TLS could
    # not be turned back on: the profile's plaintext block drops the mbedTLS SSL layer that
    # Zephyr's TLS sockets need.
    tags: [meshtastic, fleet, net, mqtt]
    platform_allow: [heltec_wifi_lora32_v4/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v4/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nobt.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf;overlay-mqtt-tls.conf"
  sample.meshtastic.fleet.v3_net:
    # The V3 (no PSRAM) on the shared profile. It rotted twice over: the profile enabled
    # PSRAM and put WiFi's heap there. Both now belong to the V4 board files.
    tags: [meshtastic, fleet, net]
    platform_allow: [heltec_wifi_lora32_v3/esp32s3/procpu]
    integration_platforms: [heltec_wifi_lora32_v3/esp32s3/procpu]
    extra_args:
      - "EXTRA_CONF_FILE=overlay-v4-unified.conf;overlay-nobt.conf;overlay-gnss.conf;overlay-pm-off.conf;overlay-nomqtt.conf"
