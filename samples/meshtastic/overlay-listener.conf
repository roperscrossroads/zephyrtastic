# The LISTENER role, board-neutral: a node that surveys the air and never
# transmits. Layer after the board's profile and with overlay-scanner.conf, then
# a per-board class overlay (overlay-v4r8-listener.conf, overlay-xiao-listener.conf).
# overlay-v4-listener.conf (class 5) predates this split and carries the same
# reasoning in full; read it for why each line below is here.

CONFIG_MESHTASTIC_SCANNER_AUTOSTART=y

# The survey: the default-channel slots of the presets in local use, including
# the three 500 kHz presets (LongTurbo is the new US app default). Build-time,
# because the runtime list does not survive a reset.
CONFIG_MESHTASTIC_SCANNER_AUTOSTART_PRESETS="LongFast LongTurbo MediumFast MediumTurbo ShortTurbo"

# Mute from the first boot, not only while sweeping.
CONFIG_MESHTASTIC_TX_ENABLED_DEFAULT=n

# Nothing to announce. Each of these would queue a transmission the scan gate
# then refuses and counts, and the instrument's claim to have disturbed nothing
# rests on that counter reading 0.
CONFIG_MESHTASTIC_NODEINFO_AUTO_SEND=n
CONFIG_MESHTASTIC_DEVICE_METRICS_AUTO_SEND=n
CONFIG_MESHTASTIC_STATUSMESSAGE_AUTO_SEND=n

# Not a cluster member: it holds no fleet config and cannot hear the cluster
# channel while parked off the operating preset. (The XIAO board conf turns the
# cluster on, so this has to say n rather than just omit overlay-cluster.conf.)
CONFIG_MESHTASTIC_CLUSTER=n
