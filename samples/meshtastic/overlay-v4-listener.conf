# Fleet image class 5 — THE LISTENER. A Heltec V4 turned into a passive
# instrument: it watches the air, timestamps every frame it hears, and never
# transmits.
#
# Layer this AFTER overlay-v4-member.conf, which it deliberately reuses (and
# whose CONFIG_MESHTASTIC_TX_ENABLED_DEFAULT=n it inherits, so the node is mute
# from its very first boot as well as while sweeping).
#
# WHY A SEPARATE CLASS AND NOT JUST `scan start` ON A CLASS-4 NODE:
#   - An instrument must come back measuring after a power cut. AUTOSTART does
#     that; a shell command does not survive a reset.
#   - Only the listener wants a large capture ring. At 27 B a record, a ring big
#     enough to be useful costs most of a V4's spare PSRAM, and there is no
#     reason to spend that on nodes that are participating.
#   - The class is what stops a courier ever handing this node a participating
#     image, exactly as class 3 protects rxru (see overlay-v4-member.conf).
CONFIG_MESHTASTIC_FLEET_CLASS=5
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--custom-tlv 0x00A0 0x05"

# Layer overlay-scanner.conf (CONFIG_MESHTASTIC_SCANNER=y) with this one — the
# survey itself is that existing fragment's job, and this file only says how a
# LISTENER differs from an ad-hoc survey.
#
# Come up listening, and come up listening to the RIGHT thing. The runtime
# preset list is RAM-only, so without the second line a power-cycled listener
# resumes SWEEPING ALL PRESETS — correct for a survey, wrong for a tap, and
# silent about the difference. 8 = ShortTurbo, the bench's operating preset.
# Narrowing to one preset also engages tap mode: no retune between dwells, so no
# periodic blind spot in the capture.
CONFIG_MESHTASTIC_SCANNER_AUTOSTART=y
CONFIG_MESHTASTIC_SCANNER_AUTOSTART_PRESET=8

# 32768 records x 27 B = 884 KB, in PSRAM. The V4 has 2 MB SPIRAM with a 1 MB
# heap pool, leaving ~1 MB after the existing ~56 KB of .ext_ram.bss statics —
# so this is close to the ceiling for THIS board and must not be raised without
# re-reading _ext_ram_bss_end in the map. (An R8 listener could hold ~100k; the
# Kconfig help has the measured numbers.)
#
# At bench rates — five nodes beaconing and exchanging cluster digests — this is
# many hours of capture. It is a BUFFER, not a database: drain it with
# `meshtastic scan dump` and let the host keep the history.
CONFIG_MESHTASTIC_SCANNER_RING_RECORDS=32768

# NOT SET, deliberately: CONFIG_MESHTASTIC_SCANNER_RX_ONLY.
# Compiling the transmit path out would make the image structurally mute, which
# sounds stronger and is in one way weaker: the runtime gate COUNTS the
# transmissions it refuses (`meshtastic scan status`), so "this instrument did
# not perturb what it measured" becomes an assertion rather than an assumption.
# Keeping the path also means `scan stop` turns the node back into an ordinary
# class-5 member long enough to be updated, then `scan start` returns it to duty.

# --- An instrument has nothing to announce -------------------------------
#
# The scan gate refuses every transmit, and COUNTS the refusals, so a listener
# that still queues beacons shows up as `tx refused while scanning: N
# (expected 0 — investigate)`. That warning is correct and should stay correct:
# on a node that is only *temporarily* surveying it means something raced the
# gate and is worth chasing. Leaving a permanent listener to trip it forever
# would train us to ignore the one message whose whole job is to be believed.
#
# Measured on rzr2 before this: `first: to 0xffffffff ch 0x0e len 104` — the
# boot NodeInfo announce, on the primary channel, at NODEINFO_START_DELAY_SEC.
# NodeInfo then repeats every NODEINFO_INTERVAL_SEC (3 h) and a GNSS fix would
# add a Position send, so the counter would have climbed forever.
#
# Turned off at the ROLE level rather than by teaching each beacon module about
# the scanner: every transmit already funnels through one gate, and scattering
# `if (scanning)` through nodeinfo/position/gnss would undo exactly the property
# that makes that gate trustworthy.
CONFIG_MESHTASTIC_NODEINFO_AUTO_SEND=n
CONFIG_MESHTASTIC_GNSS_AUTO_SEND=n

# ...and the FOURTH beacon, found on rzr2 2026-08-29 (later) — the first time
# the listener had been left running for more than a few minutes.
#
#   tx refused while scanning: 2 (expected 0 — investigate)
#     first: to 0xffffffff ch 0x0e len 39 (a broadcast — a beacon or a digest)
#
# Device-metrics Telemetry, on the PRIMARY channel, at
# MESHTASTIC_DEVICE_METRICS_INTERVAL_SEC (3600). Uptime was 7951 s and the
# counter read exactly 2, which is the whole diagnosis: this beacon fires once an
# HOUR, so the bench session that peeled off NodeInfo, GNSS and the cluster
# digest — all of which fire within a minute or two of boot — could not have seen
# it. Nothing raced and nothing regressed; the interval simply outran the test.
#
# It matters because of what the counter is FOR. A permanent listener that trips
# "expected 0 — investigate" forever trains us to ignore the one message whose
# whole job is to be believed, and the instrument's central claim — that it did
# not perturb what it measured — is an assertion resting on that counter reading
# zero.
#
# MESHTASTIC_DEVICE_METRICS itself stays on: LOCAL_STATS depends on the same
# accounting, the counters cost no airtime, and `meshtastic metrics localstats`
# is how the listener reports its own health over the console.
CONFIG_MESHTASTIC_DEVICE_METRICS_AUTO_SEND=n

# Note what is deliberately KEPT:
#   MESHTASTIC_NODEINFO=y — still learns peers from received NodeInfo, so a
#     `scan stop` leaves an ordinary node that knows who is out there.
#   MESHTASTIC_GNSS=y — the GNSS receiver is this node's only self-sustaining
#     CLOCK source, and clock quality is the listener's product: GPS sits at the
#     top of the source ladder and always re-applies, so a listener that can see
#     sky disciplines itself without an operator. It just never transmits what
#     it finds.
#   MESHTASTIC_POSITION=y — POSITION_BROADCAST_INTERVAL_SEC only re-announces an
#     admin-set FIXED position, which a listener has none of, so it never fires;
#     and the module is what accepts time from a peer's Position (quality NET).

# ...and the last beacon: the cluster digest.
#
# Measured after the two above were off: `first: to 0xffffffff ch 0xe0 len 51`
# — a digest on the cluster channel. The cluster module is level-triggered and
# broadcasts on a cadence forever, so it would have kept tripping the counter.
#
# A listener is NOT a cluster member. It holds no fleet config, it cannot
# receive while parked off the operating preset anyway, and it is managed by
# reflashing rather than by convergence. So the LISTENER BUILD OMITS
# overlay-cluster.conf entirely rather than setting CONFIG_MESHTASTIC_CLUSTER=n
# on top of it — see the class 5 build line in the tooling repo's fleet.toml.
#
# What that costs, and why it is acceptable: MESHTASTIC_FLEET depends on
# MESHTASTIC_CLUSTER, so the listener has no fleet intent reader either. It is
# still a courier TARGET — a courier decides from the document IT holds plus the
# target's BLE beat (class + running version), and the target needs only the
# peer link and the SMP server to be updated. MESHTASTIC_FLEET_CLASS sits
# outside the `if MESHTASTIC_FLEET` block, so the class still reaches both the
# beat and the signed image's TLV.
