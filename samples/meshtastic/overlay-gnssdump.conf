# GNSS NMEA dump-to-log — DIAGNOSTIC ONLY (bench). Layer with EXTRAS=overlay-gnssdump.conf.
#
# Zephyr's gnss_dump (drivers/gnss/gnss_dump.c) logs each parsed GNSS data update
# via LOG_PRINTK (unconditional — appears on the console regardless of log level):
#   <gnss>: fix_status: NO_FIX, ... satellites: N, hdop: ...      (info)
#   <gnss>: nav_data: lat ... lon ...                             (nav)
#   <gnss>: utc: ...                                              (time)
# and, with GNSS_SATELLITES, one line per satellite (PRN / SNR / elevation).
#
# This is the ONLY way to see the module BEFORE a position fix: the meshtastic
# GNSS callback bails on NO_FIX, so a powered, NMEA-streaming, satellite-tracking
# module is otherwise invisible. satellites>0 = module alive & being read (just
# needs sky for a fix); nothing at all = the enable/UART chain is the problem.
CONFIG_GNSS=y
CONFIG_MESHTASTIC_GNSS=y
CONFIG_GNSS_DUMP_TO_LOG=y
CONFIG_GNSS_SATELLITES=y
CONFIG_GNSS_DUMP_TO_LOG_BUF_SIZE=256

# Raw-RX visibility: the modem layer under gnss-nmea-generic logs each received
# line at DBG (modem_chat.c "raw:" for matched sentences; the received buffer for
# unmatched ones). gnss_dump only prints SUCCESSFULLY PARSED GGA/RMC/GSV, so it
# can't tell "module silent" from "bytes arriving but not parsing (wrong baud /
# unmatched sentence)". Compiling modem modules at DBG (LOG_MAX_LEVEL is already
# DBG) makes that distinction visible on the bench.
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=y
