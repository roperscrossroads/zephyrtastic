# Thread analyzer — periodic per-thread stack high-water-mark logging, for a stack-sizing
# soak. CONFIG_THREAD_ANALYZER (the underlying thread_analyzer_run() API this reporting
# is built on) and its periodic reporting are now BOTH always-on by default in prj.conf
# (see CONFIG_MESHTASTIC_THREAD_SUMMARY, src/Kconfig.thread_summary) — this overlay is a
# near-total no-op now, kept only for `BOARD_TAG=... TA=1 just dist` to keep working as a
# documented invocation rather than erroring. Do NOT set CONFIG_THREAD_ANALYZER_AUTO=y
# here — that re-enables upstream's own verbose two-lines-per-thread dump ALONGSIDE the
# condensed summary, doubling the exact reporting volume this was split out to reduce
# (found 2026-08-09, see docs/uart0-console-investigation.md).
#
# The "unused" figure each report prints is the deepest the stack reached since boot (the
# INIT_STACKS 0xAA pattern, overwritten as the stack grows) — i.e. the true high-water-mark.
# `kernel thread stacks` reads the same thing on demand.
CONFIG_THREAD_ANALYZER=y
