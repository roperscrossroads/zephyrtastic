# ===== overlay-notx =====
# --- Receive-only from the very first boot ---
#
# ⚠️ NOT IN USE (operator decision, 2026-08-30). This overlay, and the class-3 image
# it built, existed specifically for rxru (Heltec V4, node 0xb2a71198 — broken LoRa
# antenna connector, keying the PA into it reflects transmit power back into the
# front end). rxru now runs the plain class-4 build like any other V4 member; TX-off
# is enforced as a persisted RUNTIME setting instead (`meshtastic lora tx off`),
# re-applied automatically at flash time by devreg's `post_flash_shell` policy for
# rxru (~/lab/devices/registry.yaml) rather than baked into a separate image. The
# operator's call: the connector isn't getting fixed and has proved useful at the
# bench as-is, so a whole separate class + build to protect it permanently wasn't
# worth the ongoing cost. See fleet.toml's classes.4 comment for the fuller
# reasoning.
#
# Kept in the tree, unused, rather than deleted: the lesson below (a safety setting
# has to be reproducible from the tree, or it is not a setting) is still real, and
# still the reason the runtime replacement is enforced by a checked policy rather
# than left as something to remember. If some future board needs a genuinely
# build-time TX lockout, start here.
#
# For a board whose RF hardware must never be keyed. On this bench that is rxru
# (Heltec V4, node 0xb2a71198), whose LoRa antenna connector is broken: keying the
# PA into it reflects the transmit power back into the front end.
#
# Layer it last, by name:
#   BOARD_TAG=heltec-v4 PROFILE=v4-unified \
#   EXTRAS=$PWD/main/samples/meshtastic/overlay-notx.conf just dist
#
# The build label picks up a `-notx` suffix from the filename (justfile `extras_tag`),
# so the artifacts land in their own dist directory and can never overwrite — or be
# overwritten by — a transmit-capable image for the same board.
#
# WHY THIS FILE EXISTS AT ALL (2026-08-26). It should have existed since rxru joined
# the bench. It did not: the flashed image's `.config` carried
# `# CONFIG_MESHTASTIC_TX_ENABLED_DEFAULT is not set`, but *nothing in the tree
# produced it* — `EXTRA_CONF_FILE` was empty, no tracked conf mentioned the symbol,
# and the same label built for the R8 resolved to `=y`. The setting lived only as a
# hand-edited `.config` inside one build directory.
#
# That is a safety property stored in a build artifact. `just rebuild` (pristine)
# would have regenerated the same label as a TRANSMIT-ENABLED image, in the same
# directory, under the same filename, with nothing to flag it — and the documented
# mitigation ("the dist dir is deliberately left holding the safe build") describes a
# directory whose contents no tracked input can reproduce.
#
# A safety setting has to be reproducible from the tree, or it is not a setting.
CONFIG_MESHTASTIC_TX_ENABLED_DEFAULT=n

# Fleet image class 3: the transmit-disabled build. The class is what stops a
# courier from ever replacing this image with a transmitting one — the safety
# property rides in the image, not in a bench convention.
CONFIG_MESHTASTIC_FLEET_CLASS=3
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--custom-tlv 0x00A0 0x03"
