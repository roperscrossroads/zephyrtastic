board:
  name: heltec_vision_master_e290
  full_name: Vision Master E290 (HT-VME290)
  vendor: heltec
  # 2.9" B/W E-Ink dev board: ESP32-S3R8 (8MB octal PSRAM) + bare SX1262 (no
  # FEM, 21 dBm) + SSD1680-class e-ink on a second SPI. No GNSS on the standard
  # E290 (a separate V0.4.1 revision adds it). Distinct from the E213 (2.13",
  # HT-VME213) — same silicon, smaller panel.
  socs:
  - name: esp32s3
