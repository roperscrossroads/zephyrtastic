# XEdDSA verify against upstream-harvested vectors. The suite calls the primitive
# directly -- no meshtastic_init(), no threads, no radio -- so it is field arithmetic
# plus PSA's SHA-512.
#
# The PKC + persistence recipe lives in ../common/pki-psa.conf (pulled in by
# testcase.yaml's extra_conf_files): MESHTASTIC_XEDDSA depends on MESHTASTIC_PKI, which
# depends on SETTINGS, so a suite missing that block does not report a missing option --
# it drops PKI, then XEDDSA, and fails to LINK.
CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n

# The unit under test. SHA-512 comes with it (the Kconfig selects PSA_WANT_ALG_SHA_512);
# every other PSA option it needs is in the shared recipe.
CONFIG_MESHTASTIC_XEDDSA=y

CONFIG_MAIN_STACK_SIZE=8192
