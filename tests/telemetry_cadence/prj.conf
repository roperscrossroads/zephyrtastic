CONFIG_ZTEST=y

CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_MESHTASTIC_AIRTIME=y

# The senders under test: device metrics on the sim radio, on a short default
# so simulated time reaches several deadlines per test.
CONFIG_MESHTASTIC_DEVICE_METRICS=y
CONFIG_MESHTASTIC_DEVICE_METRICS_AUTO_SEND=y
CONFIG_MESHTASTIC_DEVICE_METRICS_INTERVAL_SEC=30
CONFIG_MESHTASTIC_LOCAL_STATS_TO_PHONE=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n

# Keep the other beacons off the sim radio; frames are filtered by port anyway.
CONFIG_MESHTASTIC_NODEINFO_AUTO_SEND=n

CONFIG_MAIN_STACK_SIZE=8192
