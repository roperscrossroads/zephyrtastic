CONFIG_ZTEST=y
CONFIG_GPIO=y
# The module alone: its init is called by the test, not by meshtastic_init(),
# so no radio and no stack. native_sim's led0 is gpio_emul pin 0 (the one-LED
# board); boards/rgb.overlay gives the XIAO's three.
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_PHONEAPI=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_EXTNOTIFY=n
CONFIG_MESHTASTIC_LED_STATUS=y
CONFIG_MESHTASTIC_LED_STATUS_LOCATE_SEC=2
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
