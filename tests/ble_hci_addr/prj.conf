# The Zephyr host's scanner/advertiser address selection, pinned against a
# fake controller (tests/common/fake_hci). agents-f5f2 / agents-t2hb.12.
CONFIG_ZTEST=y
CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_DEVICE_NAME="zeph-test"
CONFIG_LOG=y
