# "Where did this reboot come from?" -- the recording half.
#
# The reboot itself is Zephyr's job and cannot be tested here (a test cannot call something
# that never returns), which is exactly why the recording is split out from the sys_reboot()
# wrapper. What is worth pinning is that the record says the right thing, and in particular
# that it does NOT claim something it was not told.
CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_REBOOT_TRACE=y
CONFIG_THREAD_NAME=y
