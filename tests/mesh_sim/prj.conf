CONFIG_ZTEST=y

# Real LoRa subsystem + native backend (no hardware driver, no Semtech DT node);
# the simulated driver auto-enables from its DT node in the board overlay.
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
# DEVICE_METRICS on, AUTO_SEND off. The duty-cycle test needs AIRTIME (the
# regulatory gate reads the TX window), and MESHTASTIC_AIRTIME depends on
# DEVICE_METRICS -- but a periodic telemetry BROADCAST would pollute every
# other test's TX capture queue, which is why this suite had metrics off in the
# first place. Disabling the auto-send keeps that property while still
# compiling the accounting.
#
# The politeness gate AIRTIME also brings only throttles BG-tier
# fire-and-forget broadcasts at 40% CHANNEL utilization; nothing here is
# BG-tier, so existing tests are unaffected.
CONFIG_MESHTASTIC_DEVICE_METRICS=y
CONFIG_MESHTASTIC_DEVICE_METRICS_AUTO_SEND=n
CONFIG_MESHTASTIC_AIRTIME=y
CONFIG_MESHTASTIC_LOCAL_STATS_TO_PHONE=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEDB=y

CONFIG_MAIN_STACK_SIZE=8192

# Cluster sync (M4a): the digest RX path is exercised against the sim radio.
# The period is pinned to the max so no spontaneous digest TX can pollute the
# other tests' capture queues — the test injects digests, it never waits for
# one.
CONFIG_MESHTASTIC_CLUSTER=y
CONFIG_MESHTASTIC_CLUSTER_DIGEST_PERIOD_SEC=86400
# The pull jitter is pure contention avoidance — it exists so a fleet that all
# hears one broadcast digest does not answer in one slot. There is no logic in
# it, and leaving it on would only make the walk's assertions race a random
# delay, so the sim runs it at zero.
CONFIG_MESHTASTIC_CLUSTER_PULL_DELAY_MS=0
# The M4a divergence test deliberately opens an exchange against a peer that
# never answers. Five seconds (the minimum) is how long the walk test then
# waits for the slot — and waiting on the real timeout is also what proves a
# vanished peer cannot wedge the walk.
CONFIG_MESHTASTIC_CLUSTER_SYNC_TIMEOUT_SEC=5
