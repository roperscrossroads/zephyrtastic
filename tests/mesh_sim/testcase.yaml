common:
  tags:
    - meshtastic
    - lora_sim
    - native_sim
  integration_platforms:
    - native_sim/native/64
  platform_allow:
    - native_sim/native/64
tests:
  meshtastic.mesh_sim.native_sim: {}
  # Second config rather than folding the scanner into the base one: the scanner
  # gates TX while sweeping, and every other test in this suite transmits. Keeping
  # them separate means the base config stays a pure participant and cannot be
  # perturbed by a sweep left running.
  meshtastic.mesh_sim.scanner.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_SCANNER=y
      - CONFIG_MESHTASTIC_SCANNER_RING_RECORDS=64
      - CONFIG_MESHTASTIC_SCANNER_DWELL_MS=1000

  # Signal measurement.
  meshtastic.mesh_sim.rf.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_RF=y
      - CONFIG_MESHTASTIC_RF_PEERS=8

  # RF *and* scanner together. Neither config above builds both, and both tap
  # the same RX callback — exactly the shape of gap that let a plain compile
  # error ship in the scanner's own shell block once already.
  meshtastic.mesh_sim.rf_scanner.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_RF=y
      - CONFIG_MESHTASTIC_RF_PEERS=8
      - CONFIG_MESHTASTIC_SCANNER=y
      - CONFIG_MESHTASTIC_SCANNER_RING_RECORDS=64
      - CONFIG_MESHTASTIC_SCANNER_DWELL_MS=1000

  # A cap the tests can actually reach. The default 32 cannot overflow here at
  # all: the owner-existence gate limits an injected frame to base + this node's
  # pins + the one peer the NodeDB knows, so the table tops out well short --
  # which is the same reason agents-xhli.10 was never reproducible on the bench.
  # The whole suite reruns at this cap, which is the point: narrowing must not
  # disturb anything else.
  meshtastic.mesh_sim.cluster_small_table.native_sim:
    extra_configs:
      # 16, not 14, since the FW (firmware intent) section joined the
      # allowlist: a CORE claim is twice the allowlist (14), and a cap equal to
      # the claim would leave narrowing nothing to free.
      - CONFIG_MESHTASTIC_CLUSTER_MAX_ENTRIES=16

  # Signed cluster entries (agents-ooma.31): PKI and persistence on, XEdDSA on,
  # and this node signs what it authors.
  #
  # ONLY the signing tests run here, by name. The rest of this suite cannot run
  # with PKI on, and that is a harness limit, not a finding about signing --
  # measured 2026-09-18: with PKI on and signing OFF, 34 cluster tests fail
  # exactly as they do with signing on. The harness builds injected frames with
  # the node's own wire builder, which PKC-encrypts any unicast and refuses one to
  # a node whose key it lacks; PEER's key is a placeholder that is not a curve
  # point; and the harness cannot decrypt a PKC reply addressed to PEER. So every
  # walk dies, and the retries burn the duty-cycle budget until later tests
  # cannot transmit at all. The bench runs PKI ON, so mesh_sim has never
  # exercised the cluster the way the bench runs it: agents-ooma.37.
  meshtastic.mesh_sim.cluster_sign.native_sim:
    extra_conf_files:
      - prj.conf
      - ../common/pki-psa.conf
    extra_configs:
      - CONFIG_MESHTASTIC_XEDDSA=y
      - CONFIG_MESHTASTIC_CLUSTER_SIGN=y
      - CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="-test=mesh_sim::test_cluster_sign_our_own_writes_are_signed,mesh_sim::test_cluster_sign_masters_entry_verifies_and_keeps_its_signature,mesh_sim::test_cluster_sign_forgeries_are_refused,mesh_sim::test_cluster_sign_fragmented_entry_verifies_after_reassembly,mesh_sim::test_cluster_sign_unsigned_still_accepted_and_counted"
