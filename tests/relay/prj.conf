CONFIG_ZTEST=y

# Real LoRa subsystem + the simulated driver (see mesh_sim/prj.conf).
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y

# The relay's receiving half (agents-jbrq.12): one node, the far tier's frames
# injected as if the ear forwarded them over the BLE peer link. No cluster, no
# BLE stack (the bearer is injected directly), no telemetry broadcasts to
# pollute the TX capture queue.
CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_MESHTASTIC_CLUSTER=n

CONFIG_MAIN_STACK_SIZE=8192
