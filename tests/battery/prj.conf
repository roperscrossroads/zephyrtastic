CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_PHONEAPI=n

# The unit under test. Selects ADC; the emulated controller and the vbatt
# voltage-divider node both come from the board overlay. HAS_POWEROFF does not
# exist on native_sim, so CONFIG_MESHTASTIC_BATTERY_CUTOFF cannot be selected
# here -- this suite covers the read path only (millivolts/percent/present/
# external_power), not the low-voltage cutoff state machine. See
# meshtastic_battery_cutoff.h's own test suite for that.
CONFIG_MESHTASTIC_BATTERY=y

CONFIG_ADC=y
CONFIG_ADC_EMUL=y

CONFIG_MAIN_STACK_SIZE=4096
