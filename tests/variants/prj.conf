# The BASELINE for the sweep: every module this matrix toggles is ON here, so a
# scenario's `=n` is a real subtraction rather than a no-op on something that
# was already off. Scenarios in testcase.yaml turn things OFF, never on.
CONFIG_ZTEST=y

CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_PHONEAPI=n

CONFIG_GNSS=y
CONFIG_GNSS_EMUL_MANUAL_UPDATE=y
CONFIG_MESHTASTIC_GNSS=y
CONFIG_MESHTASTIC_NODEINFO=y
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_MESHTASTIC_SCANNER=y
CONFIG_MESHTASTIC_SCANNER_RING_RECORDS=64
CONFIG_MESHTASTIC_SCANNER_DWELL_MS=1000
CONFIG_MESHTASTIC_CLUSTER=y
CONFIG_MESHTASTIC_DEVICE_METRICS=y
CONFIG_MESHTASTIC_AIRTIME=y

CONFIG_MAIN_STACK_SIZE=8192
