# The fatal breadcrumb (src/meshtastic_fatal.c), driven by calling
# k_sys_fatal_error_handler() directly. RESET_ON_FATAL_ERROR is off so the
# handler ends in arch_system_halt(), which the test defines and returns from.
CONFIG_ZTEST=y
CONFIG_RESET_ON_FATAL_ERROR=n

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n

CONFIG_MAIN_STACK_SIZE=4096
