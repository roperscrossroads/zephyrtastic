# Durable (flash-backed) boot-history tests.
#
# Settings + NVS are ON, unlike most suites, because the property under test is
# precisely "does it survive being reloaded from flash" -- testing the ring
# arithmetic alone would miss the half that agents-l984 is actually about.
# native_sim provides a flash simulator, the same way tests/admin_pki uses it.
CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_BOOTLOG=y
CONFIG_MESHTASTIC_BOOTLOG_DURABLE=y
# Four, not the default sixteen, so the wrap cases are short and explicit.
CONFIG_MESHTASTIC_BOOTLOG_DURABLE_ENTRIES=4

CONFIG_MESHTASTIC_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_MESHTASTIC_PHONEAPI=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n

CONFIG_MAIN_STACK_SIZE=4096
