common:
  extra_conf_files:
    - ../common/pki-psa.conf
  tags:
    - meshtastic
    - admin
    - pki
    - native_sim
  integration_platforms:
    - native_sim/native/64
  platform_allow:
    - native_sim/native/64
tests:
  meshtastic.admin_pki.native_sim: {}

  # The mesh beacon is off by default (partial vs. the reference): the default
  # image above proves a mesh_beacon write is NAKed; this opt-in image proves
  # the write-time sanitiser and the no-reboot apply when it IS built.
  meshtastic.admin_pki.meshbeacon.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_MESHBEACON=y

  # Key verification absent: the admin case and the shell carry an #if on it,
  # and this is the only suite with the PKI it depends on.
  meshtastic.admin_pki.no_keyverify.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_KEYVERIFY=n

  # The warm ring SMALLER than the hot store, as on the XIAO (100 warm, 120 hot).
  # The default scenario sizes warm above hot so churn cannot push a key out; here
  # the key of a node evicted from the hot store must still survive, because the
  # eviction itself puts it into the warm ring (agents-2dk3 Phase 2).
  meshtastic.admin_pki.warm_below_hot.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_NODEDB_WARM_KEYS=16
