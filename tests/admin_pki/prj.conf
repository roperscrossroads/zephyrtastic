# Isolated PKI-enabled test build: exercises the real X25519 + AES-CCM PKC path
# end to end (remote admin authorized by SecurityConfig.admin_key). Kept separate
# from tests/protocol because enabling PKI changes global RX behaviour (unknown-
# node holding, PKC decode attempts) that the PSK-based protocol tests rely on.
CONFIG_ZTEST=y

# GPIO for the external-notification module (its LED), so its admin test builds.
CONFIG_GPIO=y
CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_NODEDB=y
# Warm key tier sized above the hot store (default 32) so the hot-eviction test,
# which saturates the hot store with key-bearing fillers, does not also evict the
# admin peer's key from the warm ring.
CONFIG_MESHTASTIC_NODEDB_WARM_KEYS=64
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n

# The PKC + persistence recipe lives in ../common/pki-psa.conf (pulled in by
# testcase.yaml's extra_conf_files), not here -- it is shared with the other PKI suites.

CONFIG_MAIN_STACK_SIZE=8192

# Fast for the test (default 60000 -- upstream's EDIT_TRANSACTION_IDLE_MS), but
# kept comfortably ABOVE the default CONFIG_MESHTASTIC_SETTINGS_SAVE_DELAY_MS
# (1000ms, not overridden here) so test_edit_transaction_suppresses_a_save_
# already_queued's own 1100ms wait -- deliberately holding a transaction open
# past one debounce window -- finishes before the idle timeout would also fire
# and auto-commit out from under what that test is isolating.
CONFIG_MESHTASTIC_ADMIN_EDIT_IDLE_MS=1500
