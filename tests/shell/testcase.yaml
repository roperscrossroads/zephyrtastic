common:
  tags:
    - meshtastic
    - shell
    - native_sim
  integration_platforms:
    - native_sim/native/64
  platform_allow:
    - native_sim/native/64
tests:
  # Default production-ish build: writes compiled in, gated at runtime by
  # is_managed; raw PSK hex disclosure off.
  meshtastic.shell.native_sim: {}

  # Writes compiled out entirely. Also the build-coverage half: without this
  # scenario the CONFIG_MESHTASTIC_SHELL_CONFIG_WRITE=n paths never compile.
  meshtastic.shell.no_config_write.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_SHELL_CONFIG_WRITE=n

  # PSK hex opt-in, to keep the disclosure path compiling and to prove the
  # option is what actually controls it.
  meshtastic.shell.psk_hex.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_SHELL_PSK_HEX=y

  # Compiles the shell WITH the scanner. Neither the base shell config nor the
  # mesh_sim scanner config builds both, and that gap let a plain compile error
  # ship: `scan presets` calls shell_parse_modem_preset(), which is defined
  # further down the same file, and nothing in twister caught the missing forward
  # declaration because no config had both symbols on at once.
  meshtastic.shell.scanner.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_SCANNER=y
      - CONFIG_MESHTASTIC_SCANNER_RING_RECORDS=64

  # `meshtastic rf`. native_sim has no board FEM override, so this scenario is
  # also the only place the "[--] not on this hardware" branch compiles AND runs
  # — on the bench boards that row is always the controllable one.
  meshtastic.shell.rf.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_RF=y
      # The dummy backend captures only 300-400 chars by default, and the rf
      # report is a deliberately complete walk of the chain (~2 KB). Without
      # this the later sections are silently truncated and a test asserting on
      # them fails for a reason that has nothing to do with the code.
      - CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=4096

  # Compiles the shell WITH cluster sync — and, until this row existed, nothing
  # in twister did. mesh_sim builds the cluster module with SHELL=n; every shell
  # scenario built the shell with CLUSTER=n; so the ~200-line `meshtastic
  # cluster …` block only ever compiled in a hardware build. That is the same
  # escape class as the scanner row above, and the same one the M4a digest-TX
  # seam closed on the transmit side.
  meshtastic.shell.cluster.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_CLUSTER=y
      # Never fire on its own during the suite: the tests drive promote/pull
      # explicitly and a spontaneous digest would race their assertions.
      - CONFIG_MESHTASTIC_CLUSTER_DIGEST_PERIOD_SEC=86400

  # The a4it.8 compile-time safety seed: a build with the default off boots
  # receive-only before any config write exists.
  meshtastic.shell.tx_default_off.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_TX_ENABLED_DEFAULT=n
