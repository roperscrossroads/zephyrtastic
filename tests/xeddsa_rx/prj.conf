# The RX signature policy gate, driven directly with the stack up: it reads SecurityConfig
# and the NodeDB, so both must be real. The sim LoRa device is here because meshtastic_init()
# wants a radio, not because this suite sends anything.
#
# The PKC + persistence recipe comes from ../common/pki-psa.conf via testcase.yaml.
CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_XEDDSA=y

CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y

# NodeInfo is what the first-contact bootstrap case decodes.
CONFIG_MESHTASTIC_NODEINFO=y
CONFIG_MESHTASTIC_NODEINFO_AUTO_SEND=n

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
