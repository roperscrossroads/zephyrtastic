# Isolated unit test for the light-sleep governor (src/meshtastic_power.c).
#
# Mirrors tests/protocol/prj.conf (a known-good CONFIG_MESHTASTIC=y native_sim
# build) plus the PM subsystem the governor needs. The test never calls
# meshtastic_init(), so no stack threads or radio run — the governor is exercised
# directly through its public notes + meshtastic_power_config_apply(), and the
# config-store seeding (set_config -> apply_core) is safe standalone because
# apply_core only mutates in-memory `mt` fields and store_schedule_save() is a
# no-op with SETTINGS=n.
CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEDB=y

# The governor compiles only with CONFIG_PM; the app.overlay adds the STANDBY
# power-state that makes the pm_policy lock real. CONFIG_ASSERT=y turns an
# unbalanced pm_policy get/put (the failure the edge-toggle discipline guards
# against) into an abort, so the phone-count test actually proves balance.
CONFIG_PM=y
CONFIG_ASSERT=y

CONFIG_MAIN_STACK_SIZE=4096
