CONFIG_ZTEST=y

CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_POSITION=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_NODEDB=y

# Keep the other beacons off the sim radio; frames are filtered by port anyway.
CONFIG_MESHTASTIC_NODEINFO_AUTO_SEND=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n

# A compiled interval simulated time can wait out, so the fallback itself is
# observable (agents-t2hb.2).
CONFIG_MESHTASTIC_POSITION_BROADCAST_INTERVAL_SEC=30

# The own-position phone push, shrunk from 60 s so a test can see it repeat.
CONFIG_MESHTASTIC_POSITION_TO_PHONE_SEC=10

CONFIG_MAIN_STACK_SIZE=8192
