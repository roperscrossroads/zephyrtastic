# The position module on the whole stack with the sim radio, driven through the
# PhoneAPI the way a phone drives it: a position the phone hands the node about
# itself (Android "provide location", addressed to the node) is adopted locally
# and never transmitted; a phone broadcast is adopted and sent; a unicast to a
# peer is sent and not adopted (agents-t2hb.13).
common:
  tags:
    - meshtastic
    - position
    - lora_sim
    - native_sim
  integration_platforms:
    - native_sim/native/64
  platform_allow:
    - native_sim/native/64
tests:
  # The B1 cadence tests re-send one coordinate, i.e. a stationary node: the
  # floor is off here so they pin the interval, not the floor.
  meshtastic.position.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_POSITION_STATIONARY_FLOOR_SEC=0
  # The stationary floor, shrunk from 6 h to something simulated time can wait
  # out (agents-t2hb.3). Tests that need the other scenario skip themselves.
  meshtastic.position.stationary_floor.native_sim:
    extra_configs:
      - CONFIG_MESHTASTIC_POSITION_STATIONARY_FLOOR_SEC=24
