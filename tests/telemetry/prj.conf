# LocalStats telemetry unit tests.
#
# Mirrors tests/airtime/prj.conf (itself a mirror of the known-good
# tests/protocol native_sim build) with everything LocalStats reads switched on:
# DEVICE_METRICS (LOCAL_STATS depends on it), AIRTIME (the two utilization
# fields), NODEDB (the online/total counts) and SYS_HEAP_RUNTIME_STATS (the heap
# pair). The test never calls meshtastic_init(), so no stack threads run and the
# telemetry thread is never created -- the collection and the phone hand-off are
# exercised in isolation.
CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=y
CONFIG_MESHTASTIC_AIRTIME=y
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_MESHTASTIC_LOCAL_STATS=y
CONFIG_MESHTASTIC_LOCAL_STATS_TO_PHONE=y

CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_MAIN_STACK_SIZE=4096
