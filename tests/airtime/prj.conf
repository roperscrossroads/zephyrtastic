# Isolated unit test for the airtime rolling-window accounting.
#
# Mirrors tests/protocol/prj.conf (a known-good CONFIG_MESHTASTIC=y native_sim
# build) with two changes: DEVICE_METRICS on (MESHTASTIC_AIRTIME depends on it)
# and AIRTIME explicitly on. The test never calls meshtastic_init(), so no stack
# threads run — the airtime state is exercised in complete isolation, which is
# what lets the time-advancing decay tests be deterministic.
CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=y
CONFIG_MESHTASTIC_AIRTIME=y
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEDB=y

CONFIG_MAIN_STACK_SIZE=4096
