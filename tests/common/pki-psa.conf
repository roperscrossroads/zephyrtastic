# Shared build recipe: real PKC on real (native_sim) flash.
#
# THE one place this block lives. It was copy-pasted into three suites before
# (admin_pki, node_identity, xeddsa) and node_identity's own comment said so --
# "the PSA/NVS recipe is admin_pki's". Three copies of a crypto build recipe drift
# silently: a suite that misses a PSA_WANT does not fail loudly, it silently drops
# CONFIG_MESHTASTIC_PKI (which depends on SETTINGS) and then anything depending on
# PKI, and the suite fails to LINK with an undefined reference instead of saying
# which option is missing.
#
# Pull it in from a suite's testcase.yaml:
#     common:
#       extra_conf_files:
#         - ../common/pki-psa.conf
#
# Suite-specific options stay in that suite's prj.conf.

# Persistence: PKI depends on it, and the keypair must survive a reboot in-test.
CONFIG_MESHTASTIC_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# PKC: X25519 ECDH over Curve25519 -> SHA-256 -> AES-256-CCM.
CONFIG_MESHTASTIC_PKI=y
CONFIG_MBEDTLS=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_SHA_256=y
