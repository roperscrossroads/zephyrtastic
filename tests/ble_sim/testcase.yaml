common:
  tags:
    - meshtastic
    - ble
    - native_sim
  integration_platforms:
    - native_sim/native/64
  platform_allow:
    - native_sim/native/64
  timeout: 120
tests:
  # ESP32-S3 (Heltec) shape: public identity.
  meshtastic.ble_sim.public: {}
  meshtastic.ble_sim.public_armed:
    extra_configs:
      - CONFIG_TEST_BOOT_ARMED=y
  # nRF52840 (XIAO) shape: static random identity.
  meshtastic.ble_sim.random:
    extra_configs:
      - CONFIG_TEST_RANDOM_IDENTITY=y
  meshtastic.ble_sim.random_armed:
    extra_configs:
      - CONFIG_TEST_RANDOM_IDENTITY=y
      - CONFIG_TEST_BOOT_ARMED=y
  # Two connection slots, as every non-courier image builds (overlay-ble-peer,
  # overlay-nonet). A running connectable advert holds one of them in reserve.
  meshtastic.ble_sim.public_2slot:
    extra_configs:
      - CONFIG_BT_MAX_CONN=2
  meshtastic.ble_sim.random_2slot:
    extra_configs:
      - CONFIG_TEST_RANDOM_IDENTITY=y
      - CONFIG_BT_MAX_CONN=2
