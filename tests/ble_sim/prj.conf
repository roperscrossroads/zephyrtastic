# The firmware's own BLE modules (meshtastic_ble.c, meshtastic_ble_peer.c) on
# the real Zephyr host, against the fake controller in tests/common/fake_hci.
CONFIG_ZTEST=y

CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEINFO=n
CONFIG_MESHTASTIC_NODEDB=y

# Real NVS behind settings: the peer scan's arm persists and restores at boot.
CONFIG_MESHTASTIC_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Bluetooth as on the bench images (overlay-v4-unified + overlay-nonet +
# overlay-smp-central's slot count).
CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=3
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_DEVICE_NAME="Zephyr Meshtastic"
CONFIG_MESHTASTIC_BLE=y
CONFIG_MESHTASTIC_BLE_PAIRING=y
CONFIG_MESHTASTIC_BLE_PEER=y
# Short enough that the idle-link backstop does not stall the suite.
CONFIG_MESHTASTIC_BLE_PEER_CLASSIFY_WINDOW_MS=500

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_LOG=y
CONFIG_MESHTASTIC_BLE_PEER_BRINGUP_TIMEOUT_MS=2000
