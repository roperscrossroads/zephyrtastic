# Node id derived from the X25519 public key (CONFIG_MESHTASTIC_NODE_ID_FROM_KEY).
# The PSA/NVS recipe is admin_pki's: a real keypair on real (native_sim) flash, because the
# thing under test is an id that follows a persisted key.
CONFIG_ZTEST=y
CONFIG_GPIO=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n

# The PKC + persistence recipe lives in ../common/pki-psa.conf (pulled in by
# testcase.yaml's extra_conf_files), not here -- it is shared with the other PKI suites.

# The unit under test. The node-id source stays CUSTOM (no HWINFO here), so the suite's
# configured id is the PROVISIONAL one the key-derived id must replace.
CONFIG_MESHTASTIC_NODE_ID_FROM_KEY=y

CONFIG_MAIN_STACK_SIZE=8192
