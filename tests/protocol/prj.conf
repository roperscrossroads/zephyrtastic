CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEDB=y

CONFIG_MAIN_STACK_SIZE=4096

# Clock persistence, against native_sim's counter (see the board overlay).
#
# Set EXPLICITLY, not left to the Kconfig default: the default is n until the
# feature has been brought up on hardware, and a test that inherits a default is
# a test that silently stops running when the default moves. It did exactly that
# once — the coverage vanished the moment the default flipped, and the suite
# stayed green.
CONFIG_MESHTASTIC_CLOCK_PERSIST=y
CONFIG_COUNTER=y
CONFIG_COUNTER_NATIVE_SIM=y
CONFIG_MESHTASTIC_BOOTLOG=y
