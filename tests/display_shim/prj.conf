# The display shim alone: a display device between CFB and the panel that forwards a frame
# only when it differs from the one on the glass. The panel is the dummy display; the UI
# (MESHTASTIC_DISPLAY) is not built, so what reaches the shim is what the test writes.
CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_PHONEAPI=n

CONFIG_DISPLAY=y
CONFIG_DUMMY_DISPLAY=y
CONFIG_MESHTASTIC_DISPLAY_SHIM=y
CONFIG_MESHTASTIC_DISPLAY=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
