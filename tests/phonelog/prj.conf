# Log-to-phone backend tests.
#
# Needs a real logging subsystem in DEFERRED mode -- the backend refuses to
# build any other way, because in immediate mode it would run on whatever thread
# (or ISR) emitted the message and take the PhoneAPI's mutexes there.
#
# LOCAL_STATS / DEVICE_METRICS are deliberately OFF: this app registers a
# PhoneAPI transport and then counts exactly what lands in its queue, so any
# other producer of FromRadio frames would be noise in every assertion.
CONFIG_ZTEST=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEDB=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_BUFFER_SIZE=32768

CONFIG_MESHTASTIC_PHONELOG=y
CONFIG_MESHTASTIC_PHONELOG_LEVEL=3
# Pinned rather than inherited, because the rate test's burst is sized from it:
# it emits 2x the cap in one tight loop with no yields, so the whole burst lands
# inside a single refill window. Raise this and the burst stops fitting in the
# log core's buffer -- the messages are then dropped before any backend sees
# them and the test would be measuring CONFIG_LOG_BUFFER_SIZE instead. It
# asserts dropped_core == 0 so that failure mode is named, not silent.
CONFIG_MESHTASTIC_PHONELOG_RATE=20

CONFIG_MAIN_STACK_SIZE=4096
