CONFIG_ZTEST=y

CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_PHONEAPI=y
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEINFO=n

# The whole stack on the sim radio, with the real NVS behind the settings
# subsystem: the point is what the loads read back and whether the radio moves.
CONFIG_MESHTASTIC_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MESHTASTIC_SETTINGS_SAVE_DELAY_MS=100

CONFIG_MESHTASTIC_PKI=y
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_MESHTASTIC_NODEDB_PERSIST_KEYS=y
CONFIG_MESHTASTIC_NODEDB_PERSIST_RECORDS=y

CONFIG_MESHTASTIC_LOCKDOWN=y
CONFIG_MESHTASTIC_LOCKDOWN_PBKDF2_ITERATIONS=1000
CONFIG_HWINFO=y
CONFIG_MBEDTLS=y

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
