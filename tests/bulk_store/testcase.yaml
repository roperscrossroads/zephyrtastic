# The bulk store (agents-2dk3 Phase 3a): a second NVS on its own partition for
# large, rebuildable tables. Real NVS on the flash simulator, the whole stack up
# so lockdown sealing is the real thing.
common:
  tags:
    - meshtastic
    - native_sim
  integration_platforms:
    - native_sim/native/64
  platform_allow:
    - native_sim/native/64
tests:
  meshtastic.bulk_store.native_sim:
    extra_configs:
      # Snapshots every 2 s so the tests see a save without waiting 5 minutes.
      - CONFIG_MESHTASTIC_NODEDB_PERSIST_INTERVAL_SEC=2
  # Keys in bulk with node records OFF (PERSIST_RECORDS and PERSIST_KEYS are
  # independent): the unlock reload must still restore the warm pages. Build-only,
  # because the node-record tests above need records on.
  meshtastic.bulk_store.keys_without_records.native_sim:
    build_only: true
    extra_configs:
      - CONFIG_MESHTASTIC_NODEDB_PERSIST_RECORDS=n
