CONFIG_ZTEST=y

# Real LoRa subsystem + native backend; the simulated driver auto-enables from
# its DT node in the board overlay. The GNSS module's only observable output is
# a Position broadcast, so the suite needs a radio to count transmissions on.
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_PHONEAPI=n

# The unit under test. MESHTASTIC_GNSS selects MESHTASTIC_POSITION, which owns
# the actual transmission.
CONFIG_GNSS=y
CONFIG_GNSS_EMUL_MANUAL_UPDATE=y
CONFIG_MESHTASTIC_GNSS=y

# The board GNSS driver (gnss-nmea-generic) boots suspended and is only started
# by meshtastic_gnss_init()'s explicit PM resume, so build with PM_DEVICE=y to
# keep that call live rather than compiled-out-by-IS_ENABLED. The emul comes up
# active on its own, so the resume returns -EALREADY -- which the module treats
# as success, and this pins that.
CONFIG_PM_DEVICE=y

# KEEP THE CAPTURE QUEUE PURE. Every test here counts frames on the sim radio
# and attributes them to the GNSS send gate, so nothing else may beacon:
#   - NodeInfo announces at NODEINFO_START_DELAY_SEC and then every 3 h,
#   - DEVICE_METRICS telemetry broadcasts on its own cadence.
# Both are covered (or filed as uncovered) elsewhere; here they are noise that
# would make a gating assertion pass or fail for the wrong reason.
CONFIG_MESHTASTIC_NODEINFO_AUTO_SEND=n
CONFIG_MESHTASTIC_DEVICE_METRICS=y
CONFIG_MESHTASTIC_DEVICE_METRICS_AUTO_SEND=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n

CONFIG_MAIN_STACK_SIZE=8192

# The 1PPS capture, on the emulated GPIO declared in the board overlay. Without
# GPIO_EMUL the node has no driver and MESHTASTIC_GNSS_PPS compiles out, taking
# its tests with it — silently, which is the failure this suite exists to avoid.
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
